name: Build and Scan for Vulnerabilities

# No `paths-ignore` for documentation-only changes: every path a docs change touches is checked by a
# job here. Prettier checks Markdown, `.kiro/` and `.claude/`, and the infra suite reads
# `documentation/`, `.kiro/steering/`, `.claude/commands/` and Markdown files (infra/test/docs).
on:
    push:
        branches: [main, "release/**", development, "development-*"]
    pull_request:
        branches: [main, "release/**", development, "development-*"]

# A new commit on a pull request cancels that pull request's older run. Push runs are keyed on their
# own run ID, so they are never cancelled.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

# Least-privilege token: the jobs only check out code and upload artifacts
permissions:
    contents: read

# One full run per commit. A pull request whose head is a release/** branch of this repository (for
# example release -> main) tests a commit the push to that branch already runs in full, so every job
# carries the same `if` and skips on that pull request. Fork pull requests always run: a fork's push
# does not run here. Every push to main, development, development-* and release/** still runs in full.
jobs:
    # Lockfile sync check, root dependency audit, Prettier and ESLint.
    lint:
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v4

            - name: Setup node
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      web/package-lock.json
                      infra/package-lock.json
                      documentation/docusaurus-site/package-lock.json
                      tools/VamsReleaseAutomation/cicd/pipeline/package-lock.json

            - name: Pin npm version
              run: npm install -g npm@11.19.1

            # `npm install` tolerates a package-lock.json that has drifted from its package.json and
            # silently rewrites it, so drift only surfaces for consumers who run `npm ci`. This dry run
            # is the same check `npm ci` performs, over all five lockfiles, and fails the build instead.
            # npm 11.7 and later validate the optional native bindings for every platform; earlier
            # releases (including the npm bundled with Node 22) check only the runner's own, so the
            # check runs under a pinned npm 11 rather than the runner's bundled version.
            - name: Check package-lock.json files are in sync
              run: |
                  for dir in . web infra documentation/docusaurus-site tools/VamsReleaseAutomation/cicd/pipeline; do
                      echo "::group::npm ci --dry-run ($dir)"
                      (cd "$dir" && npx -y -p npm@11 npm ci --dry-run --ignore-scripts --no-audit --no-fund)
                      echo "::endgroup::"
                  done

            - name: Npm ci root directory
              run: npm ci

            - name: Npm audit root directory
              run: npm audit --omit=dev

            - name: Prettier Check
              run: npm run prettier-check

            # web/.eslintrc.cjs loads eslint-plugin-react-hooks, which only web/ installs. The viewer
            # postinstall builds are skipped: ESLint does not load them.
            - name: Npm ci web directory
              working-directory: web
              run: npm ci --ignore-scripts

            - name: eslint
              run: npm run lint

    # Security scan of the source tree. Findings are report-only; a scan that does not run fails the
    # job. It runs before any dependency install, so it scans the checked-out source only.
    ash:
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v4
              with:
                  path: ./vams

            - name: Setup Python Version
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-python@v7
              with:
                  python-version: 3.12.16

            - name: Clone automated security helper
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v4
              with:
                  repository: aws-samples/automated-security-helper
                  # ASH v3.7.1
                  ref: af1206aff596f1288ad066828058b3011de2a998 # pragma: allowlist secret
                  path: ./ash

            # ASH installs Trivy into its image with Trivy's install script, which downloads the
            # archive from get.trivy.dev; that host is not reliably reachable from runners. The same
            # Trivy version is downloaded here from its GitHub release, checked against the SHA-256
            # pinned below, and copied into the ASH image in place of the install script. The step
            # fails if the ASH Dockerfile no longer has that install line or names another version,
            # so an ASH bump cannot skip the swap silently.
            - name: Provide a pinned Trivy to the ASH image build
              env:
                  # The version ASH's Dockerfile pins at the ASH ref above. Bump both pins with every
                  # ASH ref change; infra/test/ci/ciWorkflow.test.ts fails when they move apart.
                  TRIVY_VERSION: "0.69.3"
                  # sha256 of trivy_0.69.3_Linux-64bit.tar.gz, from the release's checksums file
                  TRIVY_SHA256: 1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75 # pragma: allowlist secret
              run: |
                  set -euo pipefail
                  test "$(uname -m)" = "x86_64"
                  archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
                  curl -sSfL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
                  echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
                  mkdir -p ash/ci-trivy
                  tar -xzf "$RUNNER_TEMP/$archive" -C ash/ci-trivy trivy
                  ash/ci-trivy/trivy --version
                  python3 - <<'PY'
                  import os, re, sys
                  path = "ash/Dockerfile"
                  text = open(path, encoding="utf-8").read()
                  version = os.environ["TRIVY_VERSION"]
                  if f'ARG TRIVY_VERSION="v{version}"' not in text:
                      print(f"::error title=Trivy pin::the ASH Dockerfile does not pin Trivy v{version}")
                      sys.exit(1)
                  pattern = re.compile(r"^RUN .*aquasecurity/trivy/\$\{TRIVY_VERSION\}/contrib/install\.sh.*$", re.M)
                  text, count = pattern.subn("COPY ci-trivy/trivy /usr/local/bin/trivy", text)
                  if count != 1:
                      print(f"::error title=Trivy pin::expected one Trivy install line in the ASH Dockerfile, found {count}")
                      sys.exit(1)
                  open(path, "w", encoding="utf-8").write(text)
                  PY
                  grep -n "ci-trivy" ash/Dockerfile

            # ASH builds its scanner image on the base image named in its Dockerfile, hosted on public
            # ECR. Anonymous public ECR pulls are rate limited per source IP, which shared runners hit,
            # so the image is pulled here with retries. If public ECR still refuses it, the same Docker
            # Official Image is pulled from Docker Hub and passed to the ASH build as BASE_IMAGE.
            - name: Pull the ASH base image
              run: |
                  ecr_image=$(sed -n 's/^ARG BASE_IMAGE=//p' ash/Dockerfile | head -n 1)
                  hub_image="docker.io/${ecr_image#public.ecr.aws/docker/}"
                  for attempt in 1 2 3 4; do
                      docker pull "$ecr_image" && exit 0
                      sleep $((attempt * 20))
                  done
                  echo "::warning title=ASH base image::public ECR refused $ecr_image; trying Docker Hub"
                  for attempt in 1 2 3; do
                      if docker pull "$hub_image"; then
                          echo "DOCKER_EXTRA_ARGS=--build-arg BASE_IMAGE=$hub_image" >> "$GITHUB_ENV"
                          exit 0
                      fi
                      sleep $((attempt * 20))
                  done
                  echo "::error title=ASH base image::the base image could not be pulled from public ECR or Docker Hub"
                  exit 1

            # The scan's findings never fail the build. The exit code is kept for the summary below
            # (0 no actionable findings, 2 actionable findings). The output directory must not start
            # with a dot, because upload-artifact skips hidden files.
            - name: Run automated security helper
              run: |
                  cd ash
                  export PATH=$PATH:./
                  rc=0
                  ash --source-dir ../vams --output-dir "$GITHUB_WORKSPACE/ash-output" || rc=$?
                  echo "ASH_EXIT_CODE=$rc" >> "$GITHUB_ENV"

            # Writes the scan result to the job summary and one annotation. Findings are report-only and
            # never fail the job. A scan that produced no readable results file did not run, so it
            # fails the job with an error annotation. Findings are listed by scanner, rule ID and file
            # path only, never with code or a matched value, because the repository is public.
            - name: Summarize automated security helper results
              if: always()
              env:
                  ASH_TAG: v3.7.1
              run: |
                  set +e
                  python3 - <<'PY'
                  import json, os
                  rc = os.environ.get("ASH_EXIT_CODE", "unknown")
                  path = os.path.join(os.environ["GITHUB_WORKSPACE"], "ash-output", "ash_aggregated_results.json")
                  out = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
                  out.write("## ASH security scan (report only)\n\n")
                  try:
                      with open(path, encoding="utf-8") as handle:
                          report = json.load(handle)
                  except Exception:
                      out.write(f"The scan did not run: no readable results file (exit code {rc}).\n")
                      print(f"::error title=ASH scan::the scan did not run: no readable results file (exit code {rc})")
                      raise SystemExit(3)
                  level_to_severity = {"error": "HIGH", "warning": "MEDIUM", "note": "LOW", "none": "INFO"}
                  rows = []
                  for run in (report.get("sarif") or {}).get("runs") or []:
                      tool = (((run.get("tool") or {}).get("driver") or {}).get("name")) or "unknown"
                      for result in run.get("results") or []:
                          if result.get("suppressions"):
                              continue
                          props = result.get("properties") or {}
                          severity = str(props.get("issue_severity") or "").upper()
                          if severity not in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "INFO"):
                              severity = level_to_severity.get(str(result.get("level") or "").lower(), "MEDIUM")
                          if severity not in ("CRITICAL", "HIGH"):
                              continue
                          scanner = props.get("scanner_name") or (props.get("scanner_details") or {}).get("tool_name") or tool
                          locations = result.get("locations") or [{}]
                          uri = (((locations[0].get("physicalLocation") or {}).get("artifactLocation") or {}).get("uri")) or "-"
                          rows.append([severity, scanner, result.get("ruleId") or "-", uri])
                  metadata = report.get("metadata") or {}
                  counts = (metadata.get("summary_stats") or {}).get("severity_counts") or {}
                  names = ["critical", "high", "medium", "low", "info", "suppressed"]
                  count_text = ", ".join(f"{name} {counts.get(name, 0)}" for name in names)
                  meaning = {"0": "no actionable findings", "2": "actionable findings"}.get(rc, "see the scan log")
                  out.write(f"- ASH version: {os.environ.get('ASH_TAG')} (results file: {metadata.get('tool_version') or 'not recorded'})\n")
                  out.write(f"- Result: exit code {rc} ({meaning})\n")
                  out.write(f"- Findings by severity: {count_text}\n\n")
                  cap = 50
                  if rows:
                      clean = lambda value: str(value).replace("|", "\\|").replace("\n", " ")
                      out.write("| Severity | Scanner | Rule | File |\n| --- | --- | --- | --- |\n")
                      for row in rows[:cap]:
                          out.write("| " + " | ".join(clean(value) for value in row) + " |\n")
                      if len(rows) > cap:
                          out.write(f"\n{len(rows) - cap} more not listed.\n")
                      out.write(f"\n{len(rows)} unsuppressed HIGH or CRITICAL findings remain.\n")
                  else:
                      out.write("No unsuppressed HIGH or CRITICAL findings remain.\n")
                  print(f"::warning title=ASH scan::{count_text}; unsuppressed HIGH or CRITICAL: {len(rows)}")
                  PY
                  summary_rc=$?
                  if [ "$summary_rc" -eq 3 ]; then
                      exit 1
                  elif [ "$summary_rc" -ne 0 ]; then
                      echo "::warning title=ASH scan::the summary could not be written"
                  fi
                  exit 0

            - name: Upload Report
              if: always()
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/upload-artifact@v4
              with:
                  name: automated-security-helper-report
                  path: ash-output/
                  retention-days: 7

    # The VamsCLI suite. Its build backend is setuptools, so no Poetry install is needed.
    vamscli-test:
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v4

            - name: Setup Python Version
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-python@v7
              with:
                  python-version: 3.12.16

            - name: Install VamsCLI dependencies
              working-directory: tools/VamsCLI
              run: |
                  pip install -e ".[dev]"

            - name: Run VamsCLI pytest tests
              working-directory: tools/VamsCLI
              run: |
                  pytest --cov=vamscli --cov-report=xml --cov-report=term -v --tb=short > pytest_output.txt 2>&1

            - name: Upload VamsCLI test results
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/upload-artifact@v4
              with:
                  name: vamscli-test-results
                  path: |
                      tools/VamsCLI/pytest_output.txt
                      tools/VamsCLI/coverage.xml
              if: always()

    # The production web build. Its output, web/dist, is handed to the infra tests and the synth: the
    # web app deployment stages it as a CDK asset, and infra/test/web reads its size and assets.
    web-build:
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v4

            - name: Setup node
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Pin npm version
              run: npm install -g npm@11.19.1

            # With install scripts: the viewer postinstall builds are part of the bundle.
            - name: Npm ci web directory
              working-directory: web
              run: npm ci

            # - name: Run npm audit web directory
            #   working-directory: web
            #   run: npm audit

            - name: Web build
              working-directory: web
              env:
                  CI: ""
              run: npm run build.lowmem

            - name: Upload web build
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/upload-artifact@v4
              with:
                  name: web-dist
                  path: web/dist/
                  if-no-files-found: error
                  include-hidden-files: true
                  retention-days: 1

    # One TypeScript type check over all of infra (lib, bin, config, test). The infra Jest suite
    # compiles transpile-only (infra/tsconfig.json sets isolatedModules), so a type error fails here and
    # not in the shards.
    infra-typecheck:
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v4

            - name: Setup node
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: infra/package-lock.json

            - name: Pin npm version
              run: npm install -g npm@11.19.1

            - name: Npm ci infrastructure directory
              working-directory: infra
              run: npm ci --ignore-scripts

            - name: Infra type check
              working-directory: infra
              run: npm run typecheck

    # The infra Jest suite in six shards. `npm test` runs `jest` from infra/package.json; Jest's
    # --shard splits the test files, so each file runs in exactly one shard.
    infra-test:
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
        needs: web-build
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4, 5, 6]
        name: infra-test (shard ${{ matrix.shard }}/6)
        steps:
            - name: Checkout repo
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v4

            - name: Download web build
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/download-artifact@v4
              with:
                  name: web-dist
                  path: web/dist

            - name: Setup node
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      infra/package-lock.json

            - name: Pin npm version
              run: npm install -g npm@11.19.1

            # The docs prettier test resolves prettier from the root install.
            - name: Npm ci root directory
              run: npm ci --ignore-scripts

            - name: Npm ci infrastructure directory
              working-directory: infra
              run: npm ci

            - name: Infra tests
              working-directory: infra
              # jest.config.js keys its worker bound on CI: two workers here, where a forced worker exit
              # was first reported. GitHub sets CI=true by default; stated so the coupling is visible.
              env:
                  CI: "true"
              run: npm test -- --ci --shard=${{ matrix.shard }}/6

            # - name: Npm audit infrastructure directory
            #   working-directory: infra
            #   run: npm audit --omit=dev

    # CloudFormation synth with the CDK CLI pinned by infra/package-lock.json, then cfn_nag over the
    # synthesized templates in the same job, since they read cdk.out.
    synth:
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
        needs: web-build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v4

            - name: Download web build
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/download-artifact@v4
              with:
                  name: web-dist
                  path: web/dist

            - name: Setup node
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: infra/package-lock.json

            - name: Pin npm version
              run: npm install -g npm@11.19.1

            - name: Npm ci infrastructure directory
              working-directory: infra
              run: npm ci

            # cdk-nag runs on every synth: infra/config/config.ts sets enableCdkNag to true itself, so
            # CDK_NAG_ENABLED is informational.
            - name: Synthesize Cloudformation templates
              working-directory: infra
              run: |
                  export CDK_NAG_ENABLED=true
                  export REGION=us-east-1
                  npx cdk synth

            - name: Scan VAMS WAF Cloudformation template
              # Third-party action pinned to the commit its master branch resolved to (the README
              # documents @master; the last tagged release, v0.8.10, is one commit behind it).
              uses: stelligent/cfn_nag@8b5f03da74202ba323a145e9d037ddce6cab9dec # master 2022-06-07
              with:
                  input_path: infra/cdk.out/vams-waf-prod-us-east-1.template.json

            - name: Scan VAMS Cloudformation template
              # Third-party action pinned to the commit its master branch resolved to (the README
              # documents @master; the last tagged release, v0.8.10, is one commit behind it).
              uses: stelligent/cfn_nag@8b5f03da74202ba323a145e9d037ddce6cab9dec # master 2022-06-07
              with:
                  input_path: infra/cdk.out/vams-core-prod-us-east-1.template.json

    # The web unit suite, on every push and pull request the workflow runs for. A job of its own so
    # it runs beside the other jobs instead of lengthening them. The viewer postinstall builds are
    # skipped: the unit suite does not load them.
    web-test:
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v4

            - name: Setup node
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Pin npm version
              run: npm install -g npm@11.19.1

            - name: Npm ci web directory
              working-directory: web
              run: npm ci --ignore-scripts

            - name: Web test
              working-directory: web
              env:
                  CI: "true"
              run: npx jest --ci --coverage

    # The backend suite, on every push and pull request the workflow runs for.
    #
    # `pytest` directly rather than `make all`: that target chains install + flake8 + mypy +
    # coverage, and its sibling `test` target invokes `ptw` — pytest-WATCH, which never exits and
    # would hang a runner. Adding lint and type-check here would make an unrelated mypy finding read
    # as a test regression.
    #
    # `backendPipelines` runs in the pipelines-test job below, not here.
    #
    # The backend requires Python >= 3.13 (backend/pyproject.toml: requires-python = ">=3.13,<4"),
    # and EVERY line of requirements-dev.txt carries a `; python_version >= "3.13"` marker
    # because it is exported from a lock resolved under that constraint. Under an older interpreter
    # every marker evaluates FALSE, so `pip install -r requirements-dev.txt` installs nothing,
    # exits 0, and pytest then fails at collection.
    backend-test:
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v4

            - name: Setup Python for the backend suite
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-python@v7
              with:
                  python-version: 3.13

            - name: Install backend dependencies
              working-directory: backend
              run: pip install -r requirements-dev.txt

            # pytest-xdist runs one worker per vCPU. `--dist loadfile` keeps every test file in one
            # worker, so a file's tests keep their order and share their module-level setup.
            - name: Run backend pytest tests
              working-directory: backend
              run: pytest -q --tb=short -n auto --dist loadfile

    # The pipeline suites under backendPipelines/. Their test modules share basenames across pipelines
    # and no tests directory is a package, so one pytest process over the tree fails at collection.
    # backendPipelines/ci/pipeline_tests.py finds every tests directory, builds each one's environment
    # from its own requirements, and runs one pytest process per directory. It splits the directories
    # into three groups, one job each, so a new directory runs without a workflow edit. A directory
    # whose tests render is marked in backendPipelines/ci/suite-settings.json and runs under xvfb-run. A directory
    # that cannot run on a CPU-only runner is listed with its reason in
    # backendPipelines/ci/excluded-test-dirs.json; backendPipelines/tests/test_ci_pipeline_suites.py
    # fails when a test module is neither run nor listed, or when this matrix and the runner's group
    # count differ. Python 3.12 is the pipeline Lambda runtime (LAMBDA_PYTHON_RUNTIME).
    pipelines-test:
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                group: [1, 2, 3]
        name: pipelines-test (group ${{ matrix.group }}/3)
        steps:
            - name: Checkout repo
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v4

            - name: Setup Python for the pipeline suites
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-python@v7
              with:
                  python-version: 3.12.16

            - name: Install the system packages the group's suites need
              # A suite that renders (headlessDisplay in suite-settings.json) runs under xvfb-run; the runner
              # prints that group's packages and nothing for the other groups.
              run: |
                  read -ra packages <<< "$(python backendPipelines/ci/pipeline_tests.py system-packages --group ${{ matrix.group }})"
                  if [ "${#packages[@]}" -gt 0 ]; then
                      sudo apt-get update
                      sudo apt-get install -y --no-install-recommends "${packages[@]}"
                  fi

            - name: Run pipeline pytest tests
              # --low-disk holds one environment at a time: the container environments together
              # pass the runner's free disk.
              run: python backendPipelines/ci/pipeline_tests.py run --group ${{ matrix.group }} --work-dir "$RUNNER_TEMP/pipeline-tests" --low-disk

            - name: Upload pipeline test logs
              if: always()
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/upload-artifact@v4
              with:
                  name: pipelines-test-logs-${{ matrix.group }}
                  path: ${{ runner.temp }}/pipeline-tests/logs/
                  retention-days: 7

    # The VamsMCP suite. The server imports vamscli, which is not on PyPI, so VamsCLI is installed from
    # its directory first. The mcp SDK needs Pydantic v2, so this suite has a job of its own rather
    # than sharing the backend's Pydantic v1 environment.
    vamsmcp-test:
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout repo
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v4

            - name: Setup Python Version
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-python@v7
              with:
                  python-version: 3.12.16

            - name: Install VamsMCP dependencies
              working-directory: tools/VamsMCP
              run: |
                  pip install -e ../VamsCLI
                  pip install -e ".[dev]"

            - name: Run VamsMCP pytest tests
              working-directory: tools/VamsMCP
              run: pytest -q --tb=short

    # The vra engine: its pytest suites, and the offline package check (parse, ledger-template validate,
    # identical copies, doc commands against the CLI, agent policy, FILES.md, links, neutrality scan).
    release-automation-test:
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout repo
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v4

            - name: Setup Python Version
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-python@v7
              with:
                  python-version: 3.12.16

            - name: Install release automation dependencies
              working-directory: tools/VamsReleaseAutomation
              run: pip install -e ".[dev]"

            - name: Run the release automation check
              working-directory: tools/VamsReleaseAutomation
              run: bash scripts/check.sh

    # The optional AWS CodePipeline lane (CDK app): lockfile sync, type check, and jest including the
    # cdk-nag "no unsuppressed finding" test. ESLint runs in the lint job (root `npm run lint`).
    release-automation-pipeline:
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout repo
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/checkout@v4

            - name: Setup node
              # GitHub-maintained actions/* use major-version tags; third-party actions are SHA-pinned.
              # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: tools/VamsReleaseAutomation/cicd/pipeline/package-lock.json

            - name: Pin npm version
              run: npm install -g npm@11.19.1

            - name: Npm ci release automation pipeline
              working-directory: tools/VamsReleaseAutomation/cicd/pipeline
              run: npm ci --ignore-scripts

            - name: Pipeline type check
              working-directory: tools/VamsReleaseAutomation/cicd/pipeline
              run: npm run typecheck

            - name: Pipeline jest (includes cdk-nag)
              working-directory: tools/VamsReleaseAutomation/cicd/pipeline
              run: npm test
