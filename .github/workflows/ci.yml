name: Build and Scan for Vulnerabilities

on:
    push:
        branches: [main, "release/**"]
    pull_request:
        branches: [main, "release/**"]

# Least-privilege token: the build job only checks out code and uploads artifacts
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
              with:
                  path: ./vams

            - name: Setup Python Version
              uses: actions/setup-python@v4
              with:
                  python-version: 3.12.7

            - name: Setup node for the whole package
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Clone automated security helper
              uses: actions/checkout@v4
              with:
                  repository: aws-samples/automated-security-helper
                  path: ./ash

            - name: Run automated security helper
              run: |
                  cd ash
                  export PATH=$PATH:./
                  ash --source-dir ../vams || true
            - name: Upload Report
              uses: actions/upload-artifact@v4
              with:
                  name: automated-security-helper-report
                  path: ash/aggregated_results.txt

            - name: Npm install root directory
              working-directory: vams
              run: npm install

            - name: Npm audit root directory
              working-directory: vams
              run: npm audit --omit=dev

            - name: Prettier Check
              working-directory: vams
              run: npm run prettier-check

            - name: Install Poetry Action
              uses: snok/install-poetry@v1
              with:
                  version: 1.8.2
                  virtualenvs-create: true
                  virtualenvs-in-project: true
                  virtualenvs-path: backend/.venv
                  installer-parallel: true

            - name: Install VamsCLI dependencies
              working-directory: vams/tools/VamsCLI
              run: |
                  pip install -e ".[dev]"

            - name: Run VamsCLI pytest tests
              working-directory: vams/tools/VamsCLI
              run: |
                  pytest --cov=vamscli --cov-report=xml --cov-report=term -v --tb=short > pytest_output.txt 2>&1

            - name: Upload VamsCLI test results
              uses: actions/upload-artifact@v4
              with:
                  name: vamscli-test-results
                  path: |
                      vams/tools/VamsCLI/pytest_output.txt
                      vams/tools/VamsCLI/coverage.xml
              if: always()

            - name: Run npm install web directory
              working-directory: vams/web
              run: npm install

            # - name: Run npm audit web directory
            #   working-directory: vams/web
            #   run: npm audit

            # The web suite runs on a PUSH to main or a release branch, not on every pull request.
            # Scoped to pushes so PR feedback stays fast
            - name: Web test
              if: github.event_name == 'push'
              working-directory: vams/web
              env:
                  CI: "true"
              run: npx jest --ci
            #####

            - name: Web build
              working-directory: vams/web
              env:
                  CI: ""
              run: npm run build.lowmem

            - name: Npm install infrastructure directory
              working-directory: vams/infra
              run: npm install

            - name: Infra tests
              working-directory: vams/infra
              run: npm test

            # - name: Npm audit infrastructure directory
            #   working-directory: vams/infra
            #   run: npm audit --omit=dev

            - name: Synthesize Cloudformation templates
              working-directory: vams/infra
              run: |
                  CDK_NAG_ENABLED=true
                  export REGION=us-east-1
                  npm -g uninstall aws-cdk
                  npm -g install aws-cdk
                  cdk synth

            - name: eslint
              working-directory: vams
              run: npm run lint

            - name: Scan VAMS WAF Cloudformation template
              uses: stelligent/cfn_nag@master
              with:
                  input_path: vams/infra/cdk.out/vams-waf-prod-us-east-1.template.json

            - name: Scan VAMS Cloudformation template
              uses: stelligent/cfn_nag@master
              with:
                  input_path: vams/infra/cdk.out/vams-core-prod-us-east-1.template.json

            #####
            # The backend suite runs on a PUSH to main or a release branch.
            #
            # `pytest` directly rather than `make all`: that target chains install + flake8 + mypy +
            # coverage, and its sibling `test` target invokes `ptw` — pytest-WATCH, which never exits and
            # would hang a runner. Running the suite is the property being restored here; adding lint and
            # type-check in the same step would make an unrelated mypy finding read as a test regression.
            #
            # `backendPipelines` stays out deliberately. Those suites must be invoked one directory per
            # process: 12 test-module basenames are duplicated across pipeline `lambda/tests/` dirs.
            # Adding them needs a matrix over ~30 directories, which is a separate change.
            # The backend requires Python >= 3.13 (backend/pyproject.toml: requires-python = ">=3.13,<4"),
            # and EVERY line of requirements-dev.txt carries a `; python_version >= "3.13"` marker
            # because it is exported from a lock resolved under that constraint. Under the job's 3.12.7
            # interpreter all 46 markers evaluate FALSE, so `pip install -r requirements-dev.txt` installs
            # nothing, exits 0, and pytest then fails at collection — a green install followed by an
            # inexplicable failure.
            #
            # Switched here rather than job-wide: these are the LAST steps in the job, so nothing after
            # them can be affected, and the earlier VamsCLI/ash/synth steps keep the interpreter they
            # already pass on. (VamsCLI declares >= 3.12, so it would tolerate 3.13 too — but changing
            # what currently passes is not part of restoring the backend suite.)
            - name: Setup Python for the backend suite
              if: github.event_name == 'push'
              uses: actions/setup-python@v4
              with:
                  python-version: 3.13

            - name: Install backend dependencies
              if: github.event_name == 'push'
              working-directory: vams/backend
              run: pip install -r requirements-dev.txt

            - name: Run backend pytest tests
              if: github.event_name == 'push'
              working-directory: vams/backend
              run: pytest -q --tb=short
            #####
