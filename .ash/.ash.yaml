# ASH (Automated Security Helper) settings for the CI `ash` job. Two things are set here: the
# report formats ASH writes, and finding suppressions. Every other setting (scanners, severity
# thresholds, ignore paths) keeps the ASH default.
#
# Report formats: ASH writes every format by default, and with ~31,000 results (all severities) the
# unused ones cost most of the job (the JUnit XML report alone takes ~29 minutes). The job summary
# reads `ash_aggregated_results.json`, which ASH always writes; the uploaded artifact keeps SARIF,
# HTML, the Markdown and text summaries and the unused-suppressions report. The formats below are
# not read by anything. Disabling a format changes no scan and no finding. The GitHub Advanced
# Security SARIF (`ash.ghas.sarif`, under a second) is still written: ASH v3.7.1 does not match a
# `github-ghas` entry to its reporter, so the entry would have no effect.
reporters:
    csv:
        enabled: false
    cyclonedx:
        enabled: false
    flat-json:
        enabled: false
    gitlab-cyclonedx:
        enabled: false
    gitlab-sast:
        enabled: false
    junitxml:
        enabled: false
    ocsf:
        enabled: false
    spdx:
        enabled: false
    yaml:
        enabled: false

# Suppressions:
# Prefer an inline suppression at the finding (`# pragma: allowlist secret` for detect-secrets,
# `# nosec <rule> - <reason>` for bandit, `# checkov:skip=<rule>: <reason>` for checkov). An entry
# here is only for a finding that cannot carry one: a JSON file has no comment syntax, a pragma
# inside a Markdown code sample renders on the documentation site, and grype reports a workflow
# action without a line. Each entry names the rule, the file and the line, and states why the value
# is not a secret or why the finding does not apply. ASH lists an entry that no longer matches a
# finding in `reports/ash.unused-suppressions.md`, so a line that moves shows up there, and
# `infra/test/ci/ciWorkflow.test.ts` fails when a pinned line no longer holds a value of the kind its
# rule detects. detect-secrets reports a value once per file, at its first line, so a value repeated
# further down the file needs no entry of its own.
global_settings:
    suppressions:
        # Recorded DynamoDB stream events used as test fixtures. The value is the stream record's
        # eventID, an AWS-generated record identifier.
        - rule_id: SECRET-HEX-HIGH-ENTROPY-STRING
          path: backend/tests/handlers/indexing/test_streams_fixtures/example_event.json
          line_start: 4
          line_end: 4
          reason: DynamoDB stream record eventID in a test fixture, not a secret
        - rule_id: SECRET-HEX-HIGH-ENTROPY-STRING
          path: backend/tests/handlers/indexing/test_streams_fixtures/insert_asset_event.json
          line_start: 4
          line_end: 4
          reason: DynamoDB stream record eventID in a test fixture, not a secret
        - rule_id: SECRET-HEX-HIGH-ENTROPY-STRING
          path: backend/tests/handlers/indexing/test_streams_fixtures/test_lambda_handler_private_fields_not_indexed_expected.json
          line_start: 2
          line_end: 2
          reason: DynamoDB stream record eventID in a test fixture, not a secret

        # Upgrade migration config template. The values are DynamoDB table-name placeholders
        # (YOUR-STACK-...-XXXXX) that the operator replaces.
        - rule_id: SECRET-BASE64-HIGH-ENTROPY-STRING
