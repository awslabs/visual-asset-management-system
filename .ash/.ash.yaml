        # grype matches the action tag `v4` as version 4.0.0, inside the advisory's affected range
        # (>= 4.0.0, < 4.1.3). A major-version tag resolves to the latest v4 release, which carries
        # the fix, so the workflow does not run an affected version.
        - rule_id: GHSA-cxww-7g56-2vh6-actions/download-artifact
          path: .github/workflows/ci.yml
          reason: actions/download-artifact@v4 resolves to the latest v4 release, which is past the fixed 4.1.3
