name: vams-isaacsim-vamscli
description: The VAMS CLI installed from the recipe's repository asset into an isolated virtual environment.
schemaVersion: 1.0
phases:
    - name: build
      steps:
          - name: FetchSource
            action: ExecuteBash
            inputs:
                commands:
                    - set -euo pipefail
                    - rm -rf /opt/vams/vamscli-src
                    - mkdir -p /opt/vams/vamscli-src
                    - /usr/local/bin/aws s3 cp --recursive --only-show-errors "${ASSET_vamscli}" /opt/vams/vamscli-src
                    - test -f /opt/vams/vamscli-src/pyproject.toml
          - name: BuildVirtualEnvironment
            action: ExecuteBash
            inputs:
                commands:
                    - set -euo pipefail
                    - |
                        # The CLI needs Python 3.12; Isaac Sim bundles an older interpreter, and the
                        # connector calls the executable rather than importing it, so the two never share
                        # an environment.
                        rm -rf /opt/vams/vamscli-venv
                        python3 -m venv /opt/vams/vamscli-venv
                        /opt/vams/vamscli-venv/bin/pip install --no-cache-dir --upgrade pip setuptools wheel
                        /opt/vams/vamscli-venv/bin/pip install --no-cache-dir /opt/vams/vamscli-src
                    - ln -sfn /opt/vams/vamscli-venv/bin/vamscli /usr/local/bin/vamscli
          - name: OpenPermissionsToEveryDesktopUser
            action: ExecuteBash
            inputs:
                commands:
                    - set -euo pipefail
                    - chmod -R a+rX /opt/vams
    - name: validate
      steps:
          - name: CliRuns
            action: ExecuteBash
            inputs:
                commands:
                    - set -eux
                    - /opt/vams/vamscli-venv/bin/vamscli --version
                    - /usr/local/bin/vamscli --version
