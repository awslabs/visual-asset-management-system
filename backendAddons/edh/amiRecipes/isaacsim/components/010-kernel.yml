name: vams-isaacsim-kernel
description: Holds the kernel Ubuntu 24.04 boots, installs the headers and extra modules its driver build needs, and keeps nouveau from loading so the NVIDIA driver install can run.
schemaVersion: 1.0
phases:
    - name: build
      steps:
          - name: HoldKernel
            action: ExecuteBash
            inputs:
                commands:
                    - set -euxo pipefail
                    - export DEBIAN_FRONTEND=noninteractive
                    - apt-mark hold linux-aws linux-image-aws linux-headers-aws linux-modules-extra-aws linux-tools-aws
          - name: InstallKernelModules
            action: ExecuteBash
            inputs:
                commands:
                    - set -euxo pipefail
                    - export DEBIAN_FRONTEND=noninteractive
                    - apt-get -o DPkg::Lock::Timeout=600 update -y
                    - |
                        # DKMS builds the GPU driver against the running kernel at the desktop's first
                        # boot, so an image whose kernel has no published modules fails here instead.
                        if ! apt-get -o DPkg::Lock::Timeout=600 install -y --no-install-recommends \
                            "linux-headers-$(uname -r)" "linux-modules-extra-$(uname -r)"; then
                            echo "kernel $(uname -r): the archive carries no headers or extra modules for it"
                            exit 1
                        fi
          - name: DisableNouveau
            action: ExecuteBash
            inputs:
                commands:
                    - set -euxo pipefail
                    - |
                        # The extra modules above carry nouveau, which loads at boot on every NVIDIA GPU.
                        # EDH blacklists it and installs the NVIDIA driver in the same boot, with no reboot
                        # in between, and nvidia-installer aborts while nouveau is loaded, leaving the
                        # desktop without a driver. The image therefore boots with nouveau kept out: a
                        # modprobe.d blacklist, copied into the initramfs, and the kernel command line.
                        printf 'blacklist nouveau\noptions nouveau modeset=0\n' \
                            > /etc/modprobe.d/vams-blacklist-nouveau.conf
                        printf '%s\n' \
                            'GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} modprobe.blacklist=nouveau nouveau.modeset=0"' \
                            > /etc/default/grub.d/90-vams-nouveau.cfg
                        update-initramfs -u -k all
                        update-grub
    - name: validate
      steps:
          - name: KernelModulesPresent
            action: ExecuteBash
            inputs:
                commands:
                    - set -eux
                    - dpkg -s "linux-headers-$(uname -r)" >/dev/null
                    - dpkg -s "linux-modules-extra-$(uname -r)" >/dev/null
                    - apt-mark showhold | grep -qx linux-aws
                    - grep -qx 'blacklist nouveau' /etc/modprobe.d/vams-blacklist-nouveau.conf
                    - grep -q 'modprobe.blacklist=nouveau' /boot/grub/grub.cfg
