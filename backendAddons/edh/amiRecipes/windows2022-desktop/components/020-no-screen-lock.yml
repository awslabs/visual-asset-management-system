name: vams-windows2022-no-screen-lock
description: Turns off the idle screen lock on VAMS Windows desktops, so a desktop left idle while connected does not ask for the Windows password again.
schemaVersion: 1.0
phases:
    - name: build
      steps:
          - name: WriteMachinePolicies
            action: ExecutePowerShell
            inputs:
                commands:
                    - |
                        $ErrorActionPreference = 'Stop'
                        # Computer Configuration > Control Panel > Personalization > Do not display the lock screen.
                        $personalization = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
                        if (-not (Test-Path $personalization)) { New-Item -Path $personalization -Force | Out-Null }
                        New-ItemProperty -Path $personalization -Name NoLockScreen -PropertyType DWord -Value 1 -Force | Out-Null
                        # Computer Configuration > System > Power Management > Sleep Settings > Require a password
                        # when a computer wakes, plugged in (AC) and on battery (DC): disabled, so the desktop
                        # does not ask for the Windows password when it resumes.
                        $wakePassword = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
                        if (-not (Test-Path $wakePassword)) { New-Item -Path $wakePassword -Force | Out-Null }
                        New-ItemProperty -Path $wakePassword -Name ACSettingIndex -PropertyType DWord -Value 0 -Force | Out-Null
                        New-ItemProperty -Path $wakePassword -Name DCSettingIndex -PropertyType DWord -Value 0 -Force | Out-Null
          - name: TurnOffDisplayAndSleepTimeouts
            action: ExecutePowerShell
            inputs:
                commands:
                    - |
                        powercfg /change monitor-timeout-ac 0
                        if ($LASTEXITCODE -ne 0) { throw "powercfg /change monitor-timeout-ac exited $LASTEXITCODE" }
                        powercfg /change standby-timeout-ac 0
                        if ($LASTEXITCODE -ne 0) { throw "powercfg /change standby-timeout-ac exited $LASTEXITCODE" }
          - name: WriteDefaultUserScreenSaverPolicy
            action: ExecutePowerShell
            inputs:
                commands:
                    - |
                        $ErrorActionPreference = 'Stop'
                        # The screen saver policies (Enable screen saver, Password protect the screen saver,
                        # Screen saver timeout) are User Configuration policies, read from each user's own
                        # HKCU\Software\Policies key. They are written into the default user profile, which the
                        # profile of every new account is copied from, including the account EDH creates for
                        # the desktop user at first boot. reg.exe holds no handle on the hive, so it unloads.
                        $hive = 'HKU\VamsDefaultUser'
                        & reg.exe load $hive 'C:\Users\Default\NTUSER.DAT' | Out-Null
                        if ($LASTEXITCODE -ne 0) { throw "reg.exe load of the default user profile exited $LASTEXITCODE" }
                        try {
                            $desktop = "$hive\Software\Policies\Microsoft\Windows\Control Panel\Desktop"
                            foreach ($name in 'ScreenSaveActive', 'ScreenSaverIsSecure', 'ScreenSaveTimeOut') {
                                & reg.exe add $desktop /v $name /t REG_SZ /d 0 /f | Out-Null
                                if ($LASTEXITCODE -ne 0) { throw "reg.exe add $name exited $LASTEXITCODE" }
                            }
                        } finally {
                            [GC]::Collect()
                            & reg.exe unload $hive | Out-Null
                        }
                        if ($LASTEXITCODE -ne 0) { throw "reg.exe unload of the default user profile exited $LASTEXITCODE" }
          - name: InstallDcvNoLockOnDisconnect
            action: ExecutePowerShell
            inputs:
                commands:
                    - |
                        $ErrorActionPreference = 'Stop'
                        # Amazon DCV's os-auto-lock (session security parameter, 1 = lock the OS session when the
                        # last client connection ends) is written to 1 by EDH's first-boot DCV setup, after this
                        # image is built, so it cannot be set here once. A SYSTEM startup task sets it to 0 on every
                        # boot instead. EDH's setup may finish without a restart, so the task waits up to 30 minutes
                        # for EDH to write the value before it acts; it restarts the DCV server only when the value
                        # changed, and changes nothing when DCV is not installed.
                        $script = 'C:\ProgramData\VAMS\dcv-no-lock-on-disconnect.ps1'
                        New-Item -ItemType Directory -Force -Path (Split-Path $script) | Out-Null
                        $body = @(
                            '$ErrorActionPreference = ''Stop'''
                            '$security = ''Registry::HKEY_USERS\S-1-5-18\Software\GSettings\com\nicesoftware\dcv\security'''
                            '$current = $null'
                            'for ($i = 0; $i -lt 120; $i++) {'
                            '    $current = (Get-ItemProperty -Path $security -Name os-auto-lock -ErrorAction SilentlyContinue).''os-auto-lock'''
                            '    if ($null -ne $current) { break }'
                            '    Start-Sleep -Seconds 15'
                            '}'
                            'if (-not (Get-Service -Name dcvserver -ErrorAction SilentlyContinue)) { exit 0 }'
                            'if ($current -ne 0) {'
                            '    if (-not (Test-Path $security)) { New-Item -Path $security -Force | Out-Null }'
                            '    New-ItemProperty -Path $security -Name os-auto-lock -PropertyType DWord -Value 0 -Force | Out-Null'
                            '    Restart-Service -Name dcvserver -Force'
                            '}'
                        )
                        Set-Content -Path $script -Value $body -Encoding UTF8
                        $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$script`""
                        $trigger = New-ScheduledTaskTrigger -AtStartup
                        $trigger.Delay = 'PT2M'
                        $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
                        Register-ScheduledTask -TaskName 'VAMS-DcvNoLockOnDisconnect' -Action $action -Trigger $trigger -Principal $principal -Force | Out-Null
    - name: validate
      steps:
          - name: DcvNoLockOnDisconnectTaskPresent
            action: ExecutePowerShell
            inputs:
                commands:
                    - |
                        $ErrorActionPreference = 'Stop'
                        $task = Get-ScheduledTask -TaskName 'VAMS-DcvNoLockOnDisconnect'
                        if ($task.Principal.UserId -ne 'SYSTEM') { throw 'the DCV no-lock task does not run as SYSTEM' }
                        if (-not (Select-String -Path 'C:\ProgramData\VAMS\dcv-no-lock-on-disconnect.ps1' -SimpleMatch 'os-auto-lock -PropertyType DWord -Value 0' -Quiet)) {
                            throw 'the DCV no-lock script does not set os-auto-lock to 0'
                        }
          - name: PoliciesPresent
            action: ExecutePowerShell
            inputs:
                commands:
                    - |
                        $ErrorActionPreference = 'Stop'
                        $personalization = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
                        if ($personalization.NoLockScreen -ne 1) { throw 'NoLockScreen is not 1' }
                        $wakePassword = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
                        if ($wakePassword.ACSettingIndex -ne 0) { throw 'a password is still required on wake (AC)' }
                        if ($wakePassword.DCSettingIndex -ne 0) { throw 'a password is still required on wake (DC)' }
                        $hive = 'HKU\VamsDefaultUser'
                        & reg.exe load $hive 'C:\Users\Default\NTUSER.DAT' | Out-Null
                        if ($LASTEXITCODE -ne 0) { throw "reg.exe load of the default user profile exited $LASTEXITCODE" }
                        try {
                            $desktop = "$hive\Software\Policies\Microsoft\Windows\Control Panel\Desktop"
                            foreach ($name in 'ScreenSaveActive', 'ScreenSaverIsSecure', 'ScreenSaveTimeOut') {
                                $answer = & reg.exe query $desktop /v $name
                                if ($LASTEXITCODE -ne 0 -or -not ($answer -match "^\s+$name\s+REG_SZ\s+0\s*$")) {
                                    throw "the default user profile does not set $name to 0"
                                }
                            }
                        } finally {
                            [GC]::Collect()
                            & reg.exe unload $hive | Out-Null
                        }
                        if ($LASTEXITCODE -ne 0) { throw "reg.exe unload of the default user profile exited $LASTEXITCODE" }
