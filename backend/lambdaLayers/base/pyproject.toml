[project]
name = "base"
version = "0.1.0"
description = ""
authors = [
    {name = "Kurt Scheuringer", email = "scheurik@amazon.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-lambda-powertools==2.36.0",
    "boto3==1.43.126",
    "botocore==1.43.126",
    "mypy-boto3-stepfunctions==1.43.117",
    "opensearch-py==2.7.1",
    "pydantic==1.10.13",
    "casbin==1.36.0",
    "locked-dict>=2023.10.22,<2024.0.0",
    "geojson>=3.2.0,<4.0.0",
    "urllib3>=2.6.0,<3",
    "requests==2.34.2",
]

# The layer is installed by pip from the committed requirements.txt, which is exported from uv.lock
# (uv lock && uv export --frozen --no-hashes --no-emit-project --no-dev -o requirements.txt).
[tool.uv]
package = false
required-version = "==0.13.8"
exclude-newer = "7 days"
environments = ["sys_platform == 'linux'"]
