[project]
name = "authorizerlambdalayer"
version = "0.1.0"
description = ""
authors = [
    {name = "Kurt Scheuringer", email = "scheurik@amazon.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-lambda-powertools>=3.19.0,<4.0.0",
    "pyjwt[crypto]>=2.12.1,<3.0.0",
    "requests>=2.32.5,<3.0.0",
    "cryptography>=50.0.1,<51.0.0",
    "joserfc>=1.6.3,<2.0.0",
    "urllib3==2.8.0",
]

# The layer is installed by pip from the committed requirements.txt, which is exported from uv.lock
# (uv lock && uv export --frozen --no-hashes --no-emit-project --no-dev -o requirements.txt).
[tool.uv]
package = false
required-version = "==0.13.8"
exclude-newer = "7 days"
environments = ["sys_platform == 'linux'"]
