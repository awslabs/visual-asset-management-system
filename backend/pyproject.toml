[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Kurt Scheuringer",email = "scheurik@amazon.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "aws-lambda-powertools (==2.36.0)",
    "pydantic (==1.10.13)",
    "opensearch-py (==2.7.1)",
    "casbin (==1.36.0)",
    "locked-dict (==2023.10.22)",
    "boto3 (==1.43.126)",
    "botocore (==1.43.126)",
    "urllib3 (>=2.6.0,<3)"
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "flake8==6.0.0",
    "coverage==7.17.2",
    "pytest-mock==3.17.0",
    "moto==5.2.5",
    "pytest-watch==4.2.0",
    "pytest-xdist==3.8.0",
    "mypy==1.0",
    "boto3==1.43.126",
    "botocore==1.43.126",
    "geojson==3.2.0",
    "joserfc==1.7.6",
    "pyjwt[crypto]==2.15.1",
]

# Test and tooling project only: nothing is built or installed as a package. requirements.txt and
# requirements-dev.txt are exported from uv.lock (see backend/CLAUDE.md, Updating Python Dependencies).
[tool.uv]
package = false
required-version = "==0.13.8"
exclude-newer = "7 days"
