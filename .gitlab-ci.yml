# Pipeline for the internal AWS GitLab CI/CD system. It publishes the documentation site to the
# internal GitLab Pages host and includes an indexer template from an internal GitLab project, so it
# runs nowhere else. A customer using GitLab should replace this file with their own pipeline rather
# than adapt it; the `include` below will not resolve outside the internal instance.

stages:
    - build
    - deploy
    - index

variables:
    # README badge commit off. Set to "false" to let the indexer commit the badges —
    # indexing, score, security and interfaces run either way.
    SKIP_README_UPDATE: "true"

include:
    - project: "envision-engineering-amer/namer/automation-tools/agentic-pace"
      ref: main
      file: "/monticello/templates/indexer.yml"

# Documentation build and deploy to GitLab Pages
# Builds only the current branch's docs
pages:
    stage: deploy
    image: node:22-slim
    variables:
        DOCS_URL: "https://aws-spatial-prototyping.pages.aws.dev"
    before_script:
        - cd documentation/docusaurus-site
        - npm ci
    script:
        # Determine deploy path based on branch
        - |
            if [ "$CI_COMMIT_BRANCH" = "main" ]; then
              export DOCS_BASE_URL="/vams-govcloud/"
              export DEPLOY_SUBDIR=""
            else
              SLUG=$(echo "$CI_COMMIT_BRANCH" | sed 's|/|-|g')
              export DOCS_BASE_URL="/vams-govcloud/$SLUG/"
              export DEPLOY_SUBDIR="$SLUG"
            fi
            echo "Building for branch $CI_COMMIT_BRANCH -> baseUrl=$DOCS_BASE_URL"
        - npm run build
        - export BUILD_DIR="$(pwd)/build"
        - cd "$CI_PROJECT_DIR"
        - mkdir -p public
        - |
            if [ -z "$DEPLOY_SUBDIR" ]; then
              cp -r "$BUILD_DIR"/* public/
            else
              mkdir -p "public/$DEPLOY_SUBDIR"
              cp -r "$BUILD_DIR"/* "public/$DEPLOY_SUBDIR/"
            fi
    artifacts:
        paths:
            - public
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
          changes:
              - documentation/docusaurus-site/**/*
              - .gitlab-ci.yml
        - if: $CI_COMMIT_BRANCH =~ /^release\//
          changes:
              - documentation/docusaurus-site/**/*
              - .gitlab-ci.yml
        - if: $CI_PIPELINE_SOURCE == "web"
