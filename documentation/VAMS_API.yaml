                databaseId:
                    type: string
                assetId:
                    type: string
                recordDate:
                    type: string
                    description: "ISO-8601 UTC timestamp of the operation"
                changeSource:
                    type: string
                    enum:
                        - create
                        - createDirect
                        - edit
                        - archive
                        - unarchive
                        - unarchiveDirect
                        - permanentDelete
                    description: "Lifecycle operation; the *Direct variants mark changes originated from S3 bucket-sync ingestion"
                changeUserId:
                    type: string
                    description: "Acting user ID or SYSTEM_USER"
                assetSnapshot:
                    type: object
                    additionalProperties: true
                    description: "Open-schema snapshot of asset fields after the operation (assetName, description, isDistributable, tags, bucketId, assetLocationKey, archivedReason/unarchivedReason when applicable; fields may grow over time)"
                migratedRecord:
                    type: boolean
                    description: "Present and true on records backfilled by the deployment data migration"
