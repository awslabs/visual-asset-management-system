    /workflows/{workflowDatabaseId}/{workflowId}/execute:
        post:
            summary: "Execute a workflow (asset-less, multi-file input)."
            description: >
                Launch a workflow execution over a selected set of input files (which may span
                assets). When the input files resolve to a single input asset the output is locked to
                that asset unless the workflow's outputTarget allows override; when they resolve to zero
                or multiple assets an explicit output target (both outputAssetId and outputDatabaseId)
                is honored regardless, or the workflow may be configured as results-only. Per-pipeline
                template parameters (templateId + templateTags, or a customTemplateOverride) resolve the
                config for each pipeline.


                The execution also captures the stored metadata its pipelines declared through
                metadataInputs. Metadata sources are optional at every arity and are never enforced, but
                the workflow assetScope's SPAN keys (singleAssetOnly, crossAssetAllowed) bound the named
                metadata-source assets as well as the input files: a workflow declaring singleAssetOnly
                (or crossAssetAllowed false) rejects an execution naming more than one asset in
                metadataSourceAssets with a 400. The span is evaluated by the same rule the input files
                pass through, so a scope setting both keys resolves to the stricter one and admits a
                single source asset. Executing requires GET on the workflow, GET on every referenced
                pipeline, GET on every input-file asset, GET on every asset named as a metadata source,
                and GET on every database whose metadata is captured; a named database the caller cannot
                read fails the request, while a database derived from the input files that the caller
                cannot read is skipped and contributes no metadata. A successful response's warnings
                array reports the non-fatal observations - a pipeline declaring a metadata type the run
                named no source for, an entity bounded by the per-entity metadata limits, an entity
                emptied by the total per-execution metadata bound, a metadata-source database whose
                metadata could not be read, and a metadataSourceDatabaseId the run did not use because
                it also supplied input files.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                inputFiles:
                                    type: array
                                    maxItems: 1000
                                    description: "Selected input files (0..1000; arity enforced against the workflow/pipeline config)."
                                    items:
                                        type: object
                                        properties:
                                            databaseId:
                                                $ref: "#/components/schemas/id_regex"
                                            assetId:
                                                $ref: "#/components/schemas/asset_id_regex"
                                            relativeFileKey:
                                                type: string
                                                description: "Asset-relative file key (leading /); '/' selects the whole asset, '/folder/' a folder."
                                            versionId:
                                                type: string
                                                description: "Optional S3 object version of this file, as returned by GET /database/{databaseId}/assets/{assetId}/fileInfo?includeVersions=true. NOT an asset version number. Empty reads whatever version is current when the execution launches. A value that names no readable version of the key is reported as a missing input."
                                        required:
                                            - databaseId
                                            - assetId
                                            - relativeFileKey
                                metadataSourceDatabaseId:
                                    $ref: "#/components/schemas/id_regex"
                                    description: >
                                        A database whose own metadata is captured as an execution input. Applies ONLY
                                        to an execution with NO input files: an execution that selects input files
                                        derives its databases from those files' assets, so a value sent alongside
                                        input files takes no part in the capture - the request still succeeds and the
                                        response warnings name the ignored database, rather than the setting being
                                        silently dropped. GLOBAL is rejected - it is the unscoped/all-databases
                                        keyword rather than a database whose metadata can be read. Optional at every
                                        arity and never enforced. Requires GET on the named database. See
                                        pipelineMetadataInputs for the entities captured and the per-entity limits.
                                metadataSourceAssets:
                                    type: array
                                    maxItems: 1000
                                    description: >
                                        Assets whose own metadata is captured as an execution input (0..1000). A
                                        metadata source is an ENTITY, never a file: it carries no file key, is exempt
                                        from input-file arity and input-file filters, and takes no part in resolving
                                        the output target - which is what lets an inputFileArity 'none' execution name
                                        the assets its pipelines read metadata from. The assetScope SPAN keys do apply:
                                        a workflow declaring singleAssetOnly (or crossAssetAllowed false) accepts at
                                        most one source asset here and rejects several with a 400. The whole-asset and
                                        folder keys do not apply - a source has no file key for them to describe.
                                        Their databases also contribute to the databases captured. Optional at every
                                        arity and never enforced. Requires GET on every named asset.
                                    items:
                                        type: object
                                        properties:
                                            databaseId:
                                                $ref: "#/components/schemas/id_regex"
                                            assetId:
                                                $ref: "#/components/schemas/asset_id_regex"
                                        required:
                                            - databaseId
                                            - assetId
                                outputAssetId:
                                    $ref: "#/components/schemas/asset_id_regex"
                                    description: >
                                        Output asset. Honored whenever the input files do not resolve to a single
                                        input asset (regardless of override); for a single input asset only when the
                                        workflow's outputTarget allows override, otherwise locked to the input asset.
                                        Omit for a results-only workflow (outputTarget.locationType 'none').
                                outputDatabaseId:
                                    $ref: "#/components/schemas/id_regex"
                                    description: >
                                        Output database. When inputs resolve to zero or multiple assets, supply it
                                        together with outputAssetId. For a single-input-asset override it falls back
                                        to the input asset's database when omitted.
                                outputFileBaseExecutionPathExtension:
                                    type: string
                                    maxLength: 1024
                                    description: >
                                        Optional base path (under the output asset) that output files are written
                                        beneath, inserted immediately before each output file's own name so the
                                        folders a pipeline creates are preserved (a file at
                                        '/path1/path2/file.txt' with a prefix of '/YOLO/' lands at
                                        '/path1/path2/YOLO/file.txt'). A trailing '/' makes the prefix a folder;
                                        without one it is joined onto the file name ('YOLO' gives
                                        '/path1/path2/YOLOfile.txt'). May contain dynamic tag placeholders (e.g.
                                        {{firstAssetFileFileNameNoExt}}, {{jobName}}) resolved at launch. OMIT the
                                        field to inherit the workflow's
                                        systemConfig.defaultOutputFileBaseExecutionPathExtension; send an empty
                                        string or '/' to write at the asset root regardless of that default. Must
                                        not contain '..' or backslashes.
                                pipelineExecutionParameters:
                                    type: object
                                    description: >
                                        Per-pipeline execution parameters, keyed by pipelineId. At most 100
                                        entries, matching the workflow's own cap on specifiedPipelines. Each key
                                        must be a valid pipeline identifier and each value an object.
                                    additionalProperties:
                                        type: object
                                        properties:
                                            templateId:
                                                type: string
                                                description: "Template the pipeline's configuration is resolved from. Must be a valid template identifier."
                                            templateTags:
                                                type: array
                                                maxItems: 250
                                                description: >
                                                    Caller-supplied tag values for the chosen template (at most 250).
                                                    Each entry is a key/value pair; the key is at most 128
                                                    characters and the value at most 65,536 characters serialized.
                                                items:
                                                    type: object
                                                    properties:
                                                        key:
                                                            type: string
                                                            minLength: 1
                                                            maxLength: 128
                                                        value:
                                                            description: "A string, number, boolean, or string list, per the tag's declared type."
                                                    required:
                                                        - key
                                            customTemplateOverride:
                                                type: string
                                                maxLength: 5242880
                                                description: >
                                                    Configuration body used in place of a stored template, up to
                                                    5,242,880 characters (5 MB) — the same absolute cap a stored
                                                    template body is held to.
                                executionGroupId:
                                    type: string
                                    maxLength: 64
                                    description: "Optional group id for bulk grouping / abort-by-group. Must be a valid identifier: it becomes a query key on the executions list and the abort-by-group route."
                                triggerType:
                                    type: string
                                    enum: [manual, fileUpload]
                                    description: "Trigger type (default manual; set by trigger dispatch otherwise)."
            responses:
                "200":
                    description: Workflow execution started.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        $ref: '#/components/schemas/executeWorkflowResponse'
                "400":
                    description: >
                        Validation, template-resolution, or cross-entity validation error, including
                        metadataSourceAssets spanning more assets than the workflow's assetScope span
                        keys allow, a workflow that is archived or disabled, a conflicting execution
                        already running under the workflow's concurrencyRestriction, and a recorded
                        set of inputs too large to store (fewer or shorter template tag values and
                        metadata-source entities). A template-resolution failure returns
                        a message object carrying templateResolutionErrors, and a cross-entity failure
                        one carrying executionValidationErrors — so the 400 body's message is an object
                        holding a list of strings rather than a string on those two paths.


                        A request throttled by Amazon DynamoDB or AWS Step Functions, and one that
                        reaches the account's Step Functions execution limit, is also answered here
                        with the status code the AWS service reported and a message naming the
                        condition; both are retryable.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized (API, the workflow, a referenced pipeline, an input-file asset, a metadata-source asset, a named metadata-source database, or the output asset).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: >
                        The workflow, an input-file asset, a metadata-source asset, or the output asset
                        does not exist, or one or more selected input files do not exist in their
                        asset's bucket.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: workflowDatabaseId
                in: path
                description: Workflow database ID (use GLOBAL for global workflows).
                required: true
                schema:
                    $ref: '#/components/schemas/id_regex'
              - name: workflowId
                in: path
                description: Workflow ID.
                required: true
                schema:
                    $ref: '#/components/schemas/id_regex'
    /database/{databaseId}/assets/{assetId}/workflows/executions:
        get:
            summary: "List all workflow executions for an asset."
            description: >-
                Lists the executions associated with an asset — the union of runs that read it and runs
                that wrote to it. Lists recent executions by default (started within the last 90 days);
                filterStartDate queries an explicit lower bound. Supports optional equality filters
                (workflowId, workflowDatabaseId, status, triggerType, groupId), each AND-ed and matched
                per field, and NextToken pagination. The applied window is echoed back as
                filterStartDate.


                One request collects at most the 200 most recent executions of the asset, across both
                directions, and each is then checked against the caller's access; the response carries
                a NextToken when older executions remain, so page until the token is absent.
            responses:
                "200":
                    description: OK.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: object
                                        properties:
                                            Items:
                                                type: array
                                                items:
                                                    $ref: "#/components/schemas/executionListRow"
                                            filterStartDate:
                                                type: string
                                                description: "The lower bound that was applied, so the response is self-describing."
                                            NextToken:
                                                type: string
                                                nullable: true
                "400":
                    description: A filter or pagination parameter is invalid — a filterStartDate outside the accepted UTC form, a workflowId or workflowDatabaseId outside the ID pattern, or a startingToken that cannot be decoded.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized (API, or GET on the asset).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Asset not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: startingToken
                in: query
                description: "NextToken from a previous page. A token that cannot be decoded is rejected with 400 rather than restarting at the first page."
                required: false
                allowEmptyValue: true
                schema:
                    type: string
              - name: databaseId
                in: path
                description: Database ID.
                required: true
                schema:
                    $ref: '#/components/schemas/id_regex'
              - name: assetId
                in: path
                description: Asset ID.
                required: true
                schema:
                    $ref: '#/components/schemas/asset_id_regex'
              - in: query
                name: filterStartDate
                required: false
                description: "UTC lower bound on execution start date, of the form YYYY-MM-DDTHH:MM:SSZ; only executions started on or after this date are listed. Fractional seconds and a +00:00 offset are accepted and normalized. Any other form is rejected with 400. Defaults to 90 days ago."
                schema:
                    type: string
              - in: query
                name: workflowId
                required: false
                description: "List only executions of this workflow. Pair with workflowDatabaseId to name a single workflow: a workflow ID is unique only within its database. An ID that does not match the ID pattern is rejected with 400 rather than returning an empty list."
                schema:
                    $ref: '#/components/schemas/id_regex'
              - in: query
                name: workflowDatabaseId
                required: false
                description: "List only executions of workflows in this database. Accepts GLOBAL for the shared workflow catalog."
                schema:
                    type: string
              - in: query
                name: status
                required: false
                schema:
                    type: string
              - in: query
                name: triggerType
                required: false
                schema:
                    type: string
              - in: query
                name: groupId
                required: false
                schema:
                    type: string
