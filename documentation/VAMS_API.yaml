                                    asset:
                                        $ref: "#/components/schemas/asset"
                "400":
                    description: Invalid parameters.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to update asset.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Asset not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
                - name: "databaseId"
                  in: path
                  description: "Unique identifier for database."
                  required: true
                  schema:
                    $ref: "#/components/schemas/id_regex"
                - name: "assetId"
                  in: path
                  description: "Unique identifier for asset."
                  required: true
                  schema:
                    $ref: "#/components/schemas/id_regex"
            security:
                - DefaultCognitoAuthorizer: []
        delete:
            summary: "Delete an asset."
            responses:
                "200":
                    description: Asset deleted.
                "404":
                    description: Asset not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
        parameters:
            - name: "databaseId"
              in: "path"
              description: "Unique identifier for database, must be all lower case, no special chars or spaces except - and _ only letters for first character min 3 and max 100."
              required: true
              schema:
                $ref: '#/components/schemas/id_regex'
            - name: "assetId"
              in: "path"
              description: "Unique identifier for asset, must be all lower case, no special chars or spaces except - and _ only letters for first character min 3 and max 100."
              required: true
              schema:
                $ref: '#/components/schemas/id_regex'
    /database/{databaseId}/assets/{assetId}/download:
        post:
            summary: "Generate presigned url(s) for downloading the given or latest version of an asset"
            description: "Generate presigned url(s) for downloading the given or latest version of an asset. Provide an optional key to specify a single file within the asset, or keys to generate URLs for multiple files of the same asset in one request (max 1500 keys per request; assetFile only; key and keys are mutually exclusive). Each keys entry is either a relative-path string (latest version) or an object {key, versionId} pinning that file to a specific S3 version; per-file versionIds are mutually exclusive with a request-level assetVersionId/assetVersionIdAlias. Version resolution per file: assetVersionId/assetVersionIdAlias pins ALL files to that asset version snapshot; otherwise a per-file versionId (or the single versionId for a single key) selects that S3 version; with no version specified the latest file version is returned. Only one of versionId, assetVersionId, or assetVersionIdAlias can be specified; versionId cannot be combined with keys (put versions on individual keys instead). Version parameters are not allowed for assetPreview downloads. Bulk requests skip file paths that do not exist or are not downloadable (reported per file with success=false and a warning in the message) and fail only when no URL can be generated."
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - databaseId
                                - assetId
                            properties:
                                key:
                                    $ref: "#/components/schemas/asset_path_pattern_regex"
                                keys:
                                    type: array
                                    maxItems: 1500
                                    items:
                                        oneOf:
                                            - type: string
                                              description: "Relative file path (leading '/'); resolves to the latest version."
                                            - type: object
                                              required: [key]
                                              properties:
                                                  key:
                                                      type: string
                                                      description: "Relative file path (leading '/')."
                                                  versionId:
                                                      type: string
                                                      description: "S3 version ID to pin this file to; omit for latest."
                                    description: "Optional array of file keys to generate presigned URLs for in bulk (same asset). Each entry is a path string (latest) or {key, versionId}. Mutually exclusive with key; not allowed for assetPreview; per-file versionIds cannot combine with assetVersionId/assetVersionIdAlias."
                                versionId:
                                    type: string
                                    description: "Optional S3 version ID to download a specific version of the file. Cannot be combined with keys."
                                assetVersionId:
                                    type: string
                                    description: "Optional VAMS asset version ID. Resolves the S3 versionId from the asset version snapshot for the specified file(s). Only one of versionId, assetVersionId, or assetVersionIdAlias can be specified."
                                assetVersionIdAlias:
                                    type: string
                                    description: "Optional asset version alias name. Resolves the alias to an asset version ID, then resolves the S3 versionId from the asset version snapshot. Only one of versionId, assetVersionId, or assetVersionIdAlias can be specified."
            responses:
                "200":
                    description: Presigned url(s) for asset download generated. Single-file requests populate downloadUrl/versionId; bulk requests (keys) additionally populate files with one entry per requested key (downloadUrl carries the first successful URL for compatibility).
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    downloadUrl:
                                        type: string
                                        description: "Presigned URL (first successful URL for bulk requests)."
                                    expiresIn:
                                        type: integer
                                        description: "URL expiration in seconds."
                                    downloadType:
                                        type: string
                                        enum: [assetFile, assetPreview]
                                    versionId:
                                        type: string
                                        nullable: true
                                    files:
                                        type: array
                                        nullable: true
                                        description: "Per-file entries for bulk requests; null for single-file requests."
                                        items:
                                            type: object
                                            properties:
                                                key:
                                                    type: string
                                                downloadUrl:
                                                    type: string
                                                    nullable: true
                                                versionId:
                                                    type: string
                                                    nullable: true
                                                success:
                                                    type: boolean
                                                error:
                                                    type: string
                                                    nullable: true
                                                    description: "Per-file failure reason when success is false (file missing, archived, etc.)."
                                    message:
                                        type: string
                                        description: "Status message; includes a warning when bulk file paths were skipped."
                "400":
                    description: |
                        Bad request. Possible reasons:
                        - DatabaseId OR AssetId invalid.
                        - Only one of versionId, assetVersionId, or assetVersionIdAlias can be specified.
                        - Only one of key or keys can be specified; keys not allowed for assetPreview; versionId cannot be combined with keys.
                        - keys exceeds the maximum of 1500 entries.
                        - Version parameters are not allowed for assetPreview downloads.
                        - No download URLs could be generated for the requested files (bulk request where every path was invalid).
                        - Ambiguous alias: multiple versions share this alias.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "401":
                    description: Asset not distributable.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: |
                        Not found. Possible reasons:
                        - Database OR Asset not found.
                        - Asset version not found for asset.
                        - File not found in asset version.
                        - No asset version found with the specified alias.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
        parameters:
            - name: "databaseId"
              in: "path"
              description: "Unique identifier for database, must be all lower case, no special chars or spaces except - and _ only letters for first character min 3 and max 100."
              required: true
              schema:
                  type: "string"
                  pattern: ^[a-zA-Z]([-_a-zA-Z0-9]){3,100}
            - name: "assetId"
              in: "path"
              description: "Unique identifier for asset, must be all lower case, no special chars or spaces except - and _ only letters for first character min 3 and max 100."
              required: true
              schema:
                  type: "string"
                  pattern: ^[a-zA-Z]([-_a-zA-Z0-9]){3,100}
    /database/{databaseId}/assets/{assetId}/export:
        post:
            summary: "Export comprehensive asset data including child tree, metadata, files, and relationships"
            description: "Exports a complete asset hierarchy starting from the specified root asset, including all child assets, their files, metadata, versions, and relationships. Supports pagination for large asset trees and optional response compression (100KB threshold). The export includes configurable filters for files, metadata, and relationship fetching. Uses POST method to support request body with filter options and optional presigned URL generation."
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                generatePresignedUrls:
                                    type: boolean
                                    default: false
                                    description: "Generate presigned S3 URLs for file downloads (skipped for archived files)"
                                includeFolderFiles:
                                    type: boolean
                                    default: false
                                    description: "Include folder markers in file listings"
                                includeOnlyPrimaryTypeFiles:
                                    type: boolean
                                    default: false
                                    description: "Include only files with primaryType metadata set"
                                includeFileMetadata:
                                    type: boolean
                                    default: true
                                    description: "Include file-specific metadata"
                                includeAssetLinkMetadata:
                                    type: boolean
                                    default: true
                                    description: "Include asset link relationship metadata"
                                includeAssetMetadata:
                                    type: boolean
                                    default: true
                                    description: "Include asset-level metadata"
                                fetchAssetRelationships:
                                    type: boolean
                                    default: true
                                    description: "Fetch asset relationships and linked asset details. When false, only returns the single root asset without any relationship data or child assets."
                                fetchEntireChildrenSubtrees:
                                    type: boolean
                                    default: false
                                    description: "Fetch entire children relationship sub-trees. When false, only fetches root asset plus one level of children. When true, fetches the complete tree hierarchy."
                                includeParentRelationships:
                                    type: boolean
                                    default: false
                                    description: "Include parent relationships in the relationship data. When false (default), filters out relationships where the root asset is the child (i.e., parent relationships to the root asset)."
                                includeArchivedFiles:
                                    type: boolean
                                    default: false
                                    description: "Include archived files in export. Note: Presigned URLs will not be generated for archived files regardless of generatePresignedUrls setting."
                                fileExtensions:
                                    type: array
                                    items:
                                        type: string
                                    description: "Filter files to only specified extensions (e.g., ['.pdf', '.jpg'])"
                                maxAssets:
                                    type: integer
                                    default: 100
                                    minimum: 1
                                    maximum: 1000
                                    description: "Maximum number of assets to return per page"
                                startingToken:
                                    type: string
                                    description: "Pagination token from previous response for retrieving next page"
            responses:
                "200":
                    description: Asset export data retrieved successfully. Response may be gzip compressed if size exceeds 100KB.
                    headers:
                        Content-Encoding:
                            schema:
                                type: string
                                enum: [gzip]
                            description: "Present when response is compressed"
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - assets
                                    - totalAssetsInTree
                                    - assetsInThisPage
                                properties:
                                    assets:
                                        type: array
                                        description: "Array of assets with complete data"
                                        items:
                                            type: object
                                            properties:
                                                is_root_lookup_asset:
                                                    type: boolean
                                                id:
                                                    type: string
                                                databaseid:
                                                    type: string
                                                assetid:
                                                    type: string
                                                bucketid:
                                                    type: string
                                                assetname:
                                                    type: string
                                                bucketname:
                                                    type: string
                                                bucketprefix:
                                                    type: string
                                                assettype:
                                                    type: string
                                                description:
                                                    type: string
                                                isdistributable:
                                                    type: boolean
                                                tags:
                                                    type: array
                                                    items:
                                                        type: string
                                                asset_version_id:
                                                    type: string
                                                asset_version_createdate:
                                                    type: string
                                                asset_version_comment:
                                                    type: string
                                                archived:
                                                    type: boolean
                                                metadata:
                                                    type: object
                                                    additionalProperties:
                                                        type: object
                                                        properties:
                                                            valueType:
                                                                type: string
                                                            value:
                                                                type: string
                                                files:
                                                    type: array
                                                    items:
                                                        type: object
                                    relationships:
                                        type: array
                                        description: "Array of parent-child relationships (only in first page)"
                                        items:
                                            type: object
                                            properties:
                                                parentAssetId:
                                                    type: string
                                                parentAssetDatabaseId:
                                                    type: string
                                                childAssetId:
                                                    type: string
                                                childAssetDatabaseId:
                                                    type: string
                                                assetLinkType:
                                                    type: string
                                                assetLinkId:
                                                    type: string
                                                assetLinkAliasId:
                                                    type: string
                                                metadata:
                                                    type: object
                                    NextToken:
                                        type: string
                                        description: "Pagination token for retrieving next page of assets"
                                    totalAssetsInTree:
                                        type: integer
                                        description: "Total number of assets in the complete tree"
                                    assetsInThisPage:
                                        type: integer
                                        description: "Number of assets returned in this page"
                "400":
                    description: Invalid parameters or pagination token.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to access asset or child assets.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Asset not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing export request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
                - name: "databaseId"
                  in: "path"
                  description: "Unique identifier for database."
                  required: true
                  schema:
                      $ref: '#/components/schemas/id_regex'
                - name: "assetId"
                  in: "path"
                  description: "Unique identifier for asset."
                  required: true
                  schema:
                      $ref: '#/components/schemas/asset_id_regex'
            security:
                - DefaultCognitoAuthorizer: []
    /database/{databaseId}/assets/{assetId}/assetHistory:
        get:
            summary: "Get asset lifecycle history records."
            description: "Returns the lifecycle history records for an asset (create, edit, archive, unarchive, permanent delete), newest first, with the acting user and a snapshot of the asset fields after each operation. History records persist across permanent deletion and are returned again if an asset is recreated with the same asset ID. Returns 404 when no asset record exists (live or archived) for the ID."
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/getAssetHistoryResponse"
                "400":
                    description: Invalid parameters or pagination token.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to view history for this asset.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Asset not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: databaseId
                in: path
                description: Database ID
                required: true
                schema:
                    $ref: '#/components/schemas/id_regex'
              - name: assetId
                in: path
                description: Asset ID
                required: true
                schema:
                    $ref: '#/components/schemas/asset_id_regex'
              - name: pageSize
                in: query
                required: false
                schema:
                    type: integer
                    minimum: 1
                    maximum: 1000
                    default: 100
                description: Maximum number of history records per page.
              - name: startingToken
                in: query
                required: false
                schema:
                    type: string
                description: Continuation token from a previous response's NextToken.
            security:
              - DefaultCognitoAuthorizer: []
    /database/{databaseId}/assets/{assetId}/download/stream/{proxy+}:
        get:
            summary: "Stream asset files with HTTP range support."
            description: "Stream asset files with HTTP range support for large files. Requires asset to be distributable. Delivery uses one of two modes selected by the ALWAYS_REDIRECT_TO_PRESIGNED toggle in the streamAsset handler. In presigned-redirect mode (required on the API Gateway REST API, and the current default), every request returns a 307 redirect to a short-lived S3 presigned URL that the client follows to fetch the bytes directly from the CORS-enabled asset bucket (S3 serves Range/206 natively). In inline mode, files at or under ~4.4MB are returned inline (base64-encoded for binary) and larger files fall back to the 307 redirect. Optionally specify a version using one of versionId (S3 version), assetVersionId (VAMS asset version snapshot), or assetVersionIdAlias (named version alias). Only one of versionId, assetVersionId, or assetVersionIdAlias can be specified. Version parameters are not allowed for assetPreview downloads."
            responses:
                "200":
                    description: Asset file content returned inline (inline mode, files at or under ~4.4MB).
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
                        text/plain:
                            schema:
                                type: string
                        image/*:
                            schema:
                                type: string
                                format: binary
                        video/*:
                            schema:
                                type: string
                                format: binary
                        audio/*:
                            schema:
                                type: string
                                format: binary
                    headers:
                        Accept-Ranges:
                            description: "Indicates that the server supports range requests"
                            schema:
                                type: string
                                example: "bytes"
                        Content-Type:
                            description: "MIME type of the file"
                            schema:
                                type: string
                        Content-Length:
                            description: "Size of the content in bytes"
                            schema:
                                type: string
                        Content-Range:
                            description: "Range of bytes being returned (for partial content)"
                            schema:
                                type: string
                                example: "bytes 200-1023/2048"
                        Content-Encoding:
                            description: "Content encoding if applicable"
                            schema:
                                type: string
                "206":
                    description: Partial content returned (when Range header is used).
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
                    headers:
                        Content-Range:
                            description: "Range of bytes being returned"
                            schema:
                                type: string
                                example: "bytes 200-1023/2048"
                        Content-Type:
                            description: "MIME type of the file"
                            schema:
                                type: string
                        Content-Length:
                            description: "Size of the partial content in bytes"
                            schema:
                                type: string
                "307":
                    description: "Temporary redirect to an S3 presigned URL for the file (presigned-redirect mode, and for larger files in inline mode). The client follows the Location header to fetch the bytes directly from S3."
                    headers:
                        Location:
                            description: "S3 presigned URL to fetch the file content."
                            schema:
                                type: string
                "400":
                    description: |
                        Bad request. Possible reasons:
                        - Invalid parameters, file too large for streaming, or unallowed file type.
                        - Only one of versionId, assetVersionId, or assetVersionIdAlias can be specified.
                        - Version parameters are not allowed for assetPreview downloads.
                        - Ambiguous alias: multiple versions share this alias.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to stream this asset or asset not distributable.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: |
                        Not found. Possible reasons:
                        - Database, asset, or file not found.
                        - Asset version not found for asset.
                        - File not found in asset version.
                        - No asset version found with the specified alias.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
                - name: "databaseId"
                  in: "path"
                  description: "Unique identifier for database."
                  required: true
                  schema:
                      $ref: '#/components/schemas/id_regex'
                - name: "assetId"
                  in: "path"
                  description: "Unique identifier for asset."
                  required: true
                  schema:
                      $ref: '#/components/schemas/id_regex'
                - name: "proxy+"
                  in: "path"
                  description: "File path within the asset to stream. Can include subdirectories and filename."
                  required: true
                  schema:
                    type: "string"
                - name: "Range"
                  in: "header"
                  description: "HTTP Range header for partial content requests (e.g., 'bytes=200-1023')."
                  required: false
                  schema:
                      type: string
                      pattern: ^bytes=\d+-\d*$
                      example: "bytes=200-1023"
                - name: "versionId"
                  in: "query"
                  description: "Optional S3 version ID to stream a specific version of the file. Only one of versionId, assetVersionId, or assetVersionIdAlias can be specified."
                  required: false
                  schema:
                      type: string
                      maxLength: 256
                - name: "assetVersionId"
                  in: "query"
                  description: "Asset version ID to resolve file version from. Resolves the S3 versionId from the asset version snapshot for the specified file. Only one of versionId, assetVersionId, or assetVersionIdAlias can be specified."
                  required: false
                  schema:
                      type: string
                - name: "assetVersionIdAlias"
                  in: "query"
                  description: "Asset version alias to resolve file version from. Resolves the alias to an asset version ID, then resolves the S3 versionId from the asset version snapshot. Only one of versionId, assetVersionId, or assetVersionIdAlias can be specified."
                  required: false
                  schema:
                      type: string
            security:
                - DefaultCognitoAuthorizer: []
        head:
            summary: "Check asset file availability and permissions without downloading content."
            description: "Check if an asset file exists and retrieve metadata headers without downloading file content. Uses S3 head_object for efficient metadata retrieval. Returns the same headers as GET but with empty body. Does not check file size thresholds or generate redirects. Requires asset to be distributable. Supports optional version parameters: versionId (S3 version), assetVersionId (VAMS asset version snapshot), or assetVersionIdAlias (named version alias). Only one of versionId, assetVersionId, or assetVersionIdAlias can be specified."
            responses:
                "200":
                    description: File exists and user has permission to access it.
                    headers:
                        Accept-Ranges:
                            description: "Indicates that the server supports range requests"
                            schema:
                                type: string
                                example: "bytes"
                        Content-Type:
                            description: "MIME type of the file"
                            schema:
                                type: string
                        Content-Length:
                            description: "Size of the content in bytes"
                            schema:
                                type: string
                        Last-Modified:
                            description: "Last modification date"
                            schema:
                                type: string
                                format: date-time
                        ETag:
                            description: "Entity tag for cache validation"
                            schema:
                                type: string
                        x-amz-version-id:
                            description: "S3 version ID if versioned"
                            schema:
                                type: string
                        x-amz-storage-class:
                            description: "S3 storage class"
                            schema:
                                type: string
                        Cache-Control:
                            description: "Cache control directive"
                            schema:
                                type: string
                                example: "no-cache, no-store"
                "400":
                    description: |
                        Bad request. Possible reasons:
                        - Invalid parameters or unallowed file type.
                        - Only one of versionId, assetVersionId, or assetVersionIdAlias can be specified.
                        - Ambiguous alias: multiple versions share this alias.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to access this asset or asset not distributable.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: |
                        Not found. Possible reasons:
                        - Database, asset, or file not found.
                        - Asset version not found for asset.
                        - File not found in asset version.
                        - No asset version found with the specified alias.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
                - name: "databaseId"
                  in: "path"
                  description: "Unique identifier for database."
                  required: true
                  schema:
                      $ref: '#/components/schemas/id_regex'
                - name: "assetId"
                  in: "path"
                  description: "Unique identifier for asset."
                  required: true
                  schema:
                      $ref: '#/components/schemas/id_regex'
                - name: "proxy+"
                  in: "path"
                  description: "File path within the asset to check. Can include subdirectories and filename."
                  required: true
                  schema:
                    type: "string"
                - name: "versionId"
                  in: "query"
                  description: "Optional S3 version ID to check a specific version of the file. Only one of versionId, assetVersionId, or assetVersionIdAlias can be specified."
                  required: false
                  schema:
                      type: string
                      maxLength: 256
                - name: "assetVersionId"
                  in: "query"
                  description: "Asset version ID to resolve file version from. Resolves the S3 versionId from the asset version snapshot for the specified file. Only one of versionId, assetVersionId, or assetVersionIdAlias can be specified."
                  required: false
                  schema:
                      type: string
                - name: "assetVersionIdAlias"
                  in: "query"
                  description: "Asset version alias to resolve file version from. Resolves the alias to an asset version ID, then resolves the S3 versionId from the asset version snapshot. Only one of versionId, assetVersionId, or assetVersionIdAlias can be specified."
                  required: false
                  schema:
                      type: string
