                    - metadataKey: "organization"
                      metadataValue: "Engineering Department"
                      metadataValueType: "string"
                    - metadataKey: "data_classification"
                      metadataValue: "Internal"
                      metadataValueType: "string"
        
        updateDatabaseMetadataRequest:
            type: object
            properties:
                metadata:
                    type: array
                    minItems: 1
                    maxItems: 500
                    items:
                        $ref: "#/components/schemas/bulkMetadataItem"
                    description: "List of metadata items to update (at least one required, max 500 for REPLACE_ALL mode)"
                updateType:
                    type: string
                    enum: [update, replace_all]
                    default: "update"
                    description: "Update mode: 'update' (default, upserts provided metadata) or 'replace_all' (replaces all metadata, requires PUT+POST+DELETE permissions, max 500 items)"
            required:
                - metadata
            example:
                metadata:
                    - metadataKey: "organization"
                      metadataValue: "Engineering & Design Department"
                      metadataValueType: "string"
                updateType: "update"
        
        deleteDatabaseMetadataRequest:
            type: object
            properties:
                metadataKeys:
                    type: array
                    minItems: 1
                    items:
                        type: string
                    description: "List of metadata keys to delete (at least one required)"
            required:
                - metadataKeys
            example:
                metadataKeys: ["organization", "data_classification"]
        
        databaseMetadataModel:
            type: object
            properties:
                databaseId:
                    $ref: '#/components/schemas/id_regex'
                    description: "Database ID"
                metadataKey:
                    type: string
                    description: "Metadata key (used as primary key)"
                metadataValue:
                    type: string
                    description: "Metadata value"
                metadataValueType:
                    $ref: "#/components/schemas/metadataValueType"
                metadataSchemaField:
                    type: boolean
                    description: "Is this field defined in a schema?"
                    nullable: true
                metadataSchemaRequired:
                    type: boolean
                    description: "Is this field required per schema?"
                    nullable: true
                metadataSchemaDefaultValue:
                    type: string
                    description: "Default value from schema"
                    nullable: true
                metadataSchemaDependsOn:
                    type: string
                    description: "Field this depends on"
                    nullable: true
                metadataSchemaMultiFieldConflict:
                    type: boolean
                    description: "Multiple schemas define this field with conflicts"
                    nullable: true
                metadataSchemaControlledListKeys:
                    type: array
                    items:
                        type: string
                    description: "Controlled list values for INLINE_CONTROLLED_LIST type"
                    nullable: true
            required:
                - databaseId
                - metadataKey
                - metadataValue
                - metadataValueType
        
        getDatabaseMetadataResponse:
            type: object
            properties:
                metadata:
                    type: array
                    items:
                        $ref: "#/components/schemas/databaseMetadataModel"
                    description: "List of metadata for the database"
                    default: []
                restrictMetadataOutsideSchemas:
                    type: boolean
                    description: "True if database restricts metadata outside schemas AND schemas exist for this entity type"
                NextToken:
                    type: string
                    description: "Pagination token for retrieving next page"
                message:
                    type: string
                    description: "Response message"
                    default: "Success"
            required:
                - metadata
                - restrictMetadataOutsideSchemas
        
        # Set Primary File Schemas
        setPrimaryFileRequest:
            type: object
            properties:
                filePath:
                    type: string
                    description: "Path to the file relative to the asset root"
                primaryType:
                    type: string
                    enum: ["", "primary", "lod1", "lod2", "lod3", "lod4", "lod5", "other"]
                    description: "Primary type for the file. Empty string removes the metadata."
                primaryTypeOther:
                    type: string
                    maxLength: 30
                    description: "Custom primary type when primaryType is 'other'"
            required:
                - filePath
                - primaryType
        
        setPrimaryFileResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: "Whether the operation was successful"
                message:
                    type: string
                    description: "Message describing the result"
                filePath:
                    type: string
                    description: "File path that was modified"
                primaryType:
                    type: string
                    description: "The primary type that was set (null if removed)"
            required:
                - success
                - message
                - filePath
                
        deleteAssetPreviewResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: "Whether the operation was successful"
                message:
                    type: string
                    description: "Message describing the result"
                assetId:
                    $ref: '#/components/schemas/id_regex'
                    description: "Asset ID whose preview was deleted"
            required:
                - success
                - message
                - assetId
                
        deleteAuxiliaryPreviewAssetFilesRequest:
            type: object
            properties:
                filePath:
                    type: string
                    description: "Path to the file or prefix relative to the asset root. Will be treated as a prefix for deletion."
            required:
                - filePath
                
        deleteAuxiliaryPreviewAssetFilesResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: "Whether the operation was successful"
                message:
                    type: string
                    description: "Message describing the result"
                filePath:
                    type: string
                    description: "File path or prefix that was used for deletion"
                deletedCount:
                    type: integer
                    description: "Number of auxiliary files deleted"
            required:
                - success
                - message
                - filePath
                - deletedCount
        
        # Search API Schemas
        simpleSearchRequest:
            type: object
            properties:
                query:
                    type: string
                    maxLength: 1000
                    description: "General keyword search across all fields"
                entityTypes:
                    type: array
                    items:
                        type: string
                        enum: [asset, file]
                    description: "Filter by entity type (default: both asset and file)"
                assetName:
                    type: string
                    maxLength: 256
                    description: "Search by asset name"
                assetId:
                    type: string
                    maxLength: 256
                    description: "Search by asset ID"
                assetType:
                    type: string
                    maxLength: 256
                    description: "Filter by asset type"
                fileKey:
                    type: string
                    maxLength: 1000
                    description: "Search by S3 file key"
                fileExtension:
                    type: string
                    maxLength: 50
                    description: "Filter by file extension (without leading dot)"
                databaseId:
                    type: string
                    maxLength: 256
                    description: "Filter by database ID"
                tags:
                    type: array
                    items:
                        type: string
                        maxLength: 256
                    description: "Search by tags"
                metadataKey:
                    type: string
                    maxLength: 256
                    description: "Search metadata field names"
                metadataValue:
                    type: string
                    maxLength: 1000
                    description: "Search metadata field values"
                includeArchived:
                    type: boolean
                    default: false
                    description: "Include archived items"
                geoSearch:
                    $ref: "#/components/schemas/geoSearch"
                from:
                    type: integer
                    minimum: 0
                    maximum: 10000
                    default: 0
                    description: "Starting offset for pagination"
                size:
                    type: integer
                    minimum: 1
                    maximum: 1000
                    default: 100
                    description: "Number of results to return"
            required: []
        
        searchRequest:
            type: object
            properties:
                query:
                    type: string
                    maxLength: 1000
                    description: "General text search query"
                tokens:
                    type: array
                    items:
                        $ref: "#/components/schemas/searchToken"
                    description: "Structured search tokens"
                filters:
                    type: array
                    items:
                        $ref: "#/components/schemas/searchFilter"
                    description: "Additional OpenSearch filters"
                sort:
                    type: array
                    items:
                        oneOf:
                            - type: string
                            - $ref: "#/components/schemas/searchSort"
                    description: "Sort configuration"
                operation:
                    type: string
                    enum: [AND, OR]
                    default: "AND"
                    description: "Default operation for tokens"
                entityTypes:
                    type: array
                    items:
                        type: string
                        enum: [asset, file]
                    description: "Filter by entity type"
                includeArchived:
                    type: boolean
                    default: false
                    description: "Include archived items"
                aggregations:
                    type: boolean
                    default: true
                    description: "Include aggregations in response"
                metadataQuery:
                    type: string
                    maxLength: 1000
                    description: "Separate metadata search query"
                metadataSearchMode:
                    type: string
                    enum: [key, value, both]
                    default: "both"
                    description: "Search metadata keys, values, or both"
                includeMetadataInSearch:
                    type: boolean
                    default: true
                    description: "Include metadata fields in general search"
                explainResults:
                    type: boolean
                    default: false
                    description: "Include match explanations"
                includeHighlights:
                    type: boolean
                    default: true
                    description: "Enhanced highlighting"
                geoSearch:
                    $ref: "#/components/schemas/geoSearch"
                from:
                    type: integer
                    minimum: 0
                    maximum: 10000
                    default: 0
                    description: "Starting offset for pagination"
                size:
                    type: integer
                    minimum: 1
                    maximum: 2000
                    default: 100
                    description: "Number of results to return"
            required: []

        geoSearch:
            type: object
            description: |
                Geospatial filter applied to the geo_MD_location field on indexed asset and file
                documents. The indexer derives geo_MD_location from a metadata 'location' key
                (GeoJSON or {latitude, longitude, altitude}) or from individual latitude /
                longitude / altitude metadata fields. Provide exactly one of point, bbox, or
                geoJson.
            properties:
                relation:
                    type: string
                    enum: [intersects, within, contains, disjoint]
                    default: intersects
                    description: "Spatial relation between input shape and indexed shapes"
                point:
                    type: object
                    description: "Single point with optional radius (meters) for proximity filtering"
                    properties:
                        lat:
                            type: number
                            minimum: -90
                            maximum: 90
                        lon:
                            type: number
                            minimum: -180
                            maximum: 180
                        radiusMeters:
                            type: number
                            exclusiveMinimum: 0
                            description: "Optional radius in meters; treated as a circle around (lat, lon)"
                    required: [lat, lon]
                bbox:
                    type: object
                    description: "Axis-aligned geographic bounding box"
                    properties:
                        topLeft:
                            type: object
                            properties:
                                lat: { type: number, minimum: -90, maximum: 90 }
                                lon: { type: number, minimum: -180, maximum: 180 }
                            required: [lat, lon]
                        bottomRight:
                            type: object
                            properties:
                                lat: { type: number, minimum: -90, maximum: 90 }
                                lon: { type: number, minimum: -180, maximum: 180 }
                            required: [lat, lon]
                    required: [topLeft, bottomRight]
                geoJson:
                    type: object
                    description: "GeoJSON Geometry, Feature, or FeatureCollection"

        searchToken:
            type: object
            properties:
                operation:
                    type: string
                    enum: [AND, OR]
                    default: "AND"
                operator:
                    type: string
                    enum: ["=", ":", "!=", "!:"]
                    default: "="
                propertyKey:
                    type: string
                    description: "Property key to search (null or 'all' for multi-field search)"
                value:
                    type: string
                    minLength: 1
                    description: "Search value"
            required:
                - value
        
        searchFilter:
            type: object
            properties:
                query_string:
                    type: object
                    additionalProperties:
                        type: string
                    description: "OpenSearch query_string filter"
            required:
                - query_string
        
        searchSort:
            type: object
            properties:
                field:
                    type: string
                    minLength: 1
                    description: "Field to sort by"
                order:
                    type: string
                    enum: [asc, desc]
                    default: "asc"
                    description: "Sort order"
            required:
                - field
        
        searchMappingsResponse:
            type: object
            properties:
                mappings:
                    type: object
                    properties:
                        asset_index:
                            type: object
                            description: "Asset index mappings"
                        file_index:
                            type: object
                            description: "File index mappings"
                    description: "Index mappings for both asset and file indexes"
            required:
                - mappings
        
        searchHitSource:
            type: object
            properties:
                _rectype:
                    type: string
                    enum: [asset, file]
                    description: "Record type"
                str_databaseid:
                    type: string
                    description: "Database ID"
                str_assetid:
                    type: string
                    description: "Asset ID"
                str_assetname:
                    type: string
                    description: "Asset name"
                str_key:
                    type: string
                    description: "S3 key for files"
                str_description:
                    type: string
                    description: "Asset description"
                str_assettype:
                    type: string
                    description: "Asset type"
                str_fileext:
                    type: string
                    description: "File extension"
                list_tags:
                    type: array
                    items:
                        type: string
                    description: "Tags associated with the item"
                bool_isdistributable:
                    type: boolean
                    description: "Whether asset is distributable"
                date_lastmodified:
                    type: string
                    format: date-time
                    description: "Last modified date"
                num_size:
                    type: integer
                    description: "File size in bytes"
                str_etag:
                    type: string
                    description: "S3 ETag"
                str_s3_version_id:
                    type: string
                    description: "S3 version ID"
                str_asset_version_id:
                    type: string
                    description: "Asset version ID"
                bool_archived:
                    type: boolean
                    description: "Whether item is archived"
                str_previewfilekey:
                    type: string
                    description: "S3 key of the associated preview file. Empty string if no preview exists. Present on both asset and file index records."
                str_assetlocationkey:
                    type: string
                    description: "S3 key from the asset's assetLocation. Empty string if not set. Only present on asset index records."
                str_bucketid:
                    type: string
                    description: "Bucket ID for the asset"
                str_bucketname:
                    type: string
                    description: "S3 bucket name"
                str_bucketprefix:
                    type: string
                    description: "S3 bucket base prefix"
                num_filesize:
                    type: integer
                    description: "File size in bytes (file index only)"
                bool_has_asset_children:
                    type: boolean
                    description: "Whether asset has child asset links (asset index only)"
                bool_has_asset_parents:
                    type: boolean
                    description: "Whether asset has parent asset links (asset index only)"
                bool_has_assets_related:
                    type: boolean
                    description: "Whether asset has related asset links (asset index only)"
            additionalProperties: true
            required:
                - _rectype
        
        searchHitExplanation:
            type: object
            properties:
                matched_fields:
                    type: array
                    items:
                        type: string
                    description: "Fields that matched the query"
                match_reasons:
                    type: object
                    additionalProperties:
                        type: string
                    description: "Field to reason mapping"
                query_type:
                    type: string
                    description: "Type of query (general, metadata, combined)"
                score_breakdown:
                    type: object
                    properties:
                        total_score:
                            type: number
                        field_matches:
                            type: integer
                        highlight_matches:
                            type: integer
            required:
                - matched_fields
                - match_reasons
                - query_type
        
        searchHit:
            type: object
            properties:
                _index:
                    type: string
                    description: "Index name"
                _id:
                    type: string
                    description: "Document ID"
                _score:
                    type: number
                    description: "Search relevance score"
                _source:
                    $ref: "#/components/schemas/searchHitSource"
                    description: "Source document data"
                highlight:
                    type: object
                    additionalProperties:
                        type: array
                        items:
                            type: string
                    description: "Highlighted text snippets"
                explanation:
                    $ref: "#/components/schemas/searchHitExplanation"
                    description: "Match explanation (if requested)"
            required:
                - _index
                - _id
                - _source
        
        searchHits:
            type: object
            properties:
                total:
                    type: object
                    properties:
                        value:
                            type: integer
                            description: "Total number of hits"
                        relation:
                            type: string
                            description: "Relation type (eq, gte)"
                    required:
                        - value
                max_score:
                    type: number
                    description: "Maximum score among hits"
                hits:
                    type: array
                    items:
                        $ref: "#/components/schemas/searchHit"
                    description: "Array of search hits"
            required:
                - total
                - hits
        
        aggregationBucket:
            type: object
            properties:
                key:
                    oneOf:
                        - type: string
                        - type: integer
                        - type: number
                    description: "Bucket key"
                doc_count:
                    type: integer
                    description: "Number of documents in bucket"
            required:
                - key
                - doc_count
        
        aggregation:
            type: object
            properties:
                doc_count:
                    type: integer
                    description: "Total document count"
                buckets:
                    type: array
                    items:
                        $ref: "#/components/schemas/aggregationBucket"
                    description: "Aggregation buckets"
        
        searchResponse:
            type: object
            properties:
                took:
                    type: integer
                    description: "Time taken in milliseconds"
                timed_out:
                    type: boolean
                    description: "Whether the search timed out"
                _shards:
                    type: object
                    properties:
                        total:
                            type: integer
                        successful:
                            type: integer
                        skipped:
                            type: integer
                        failed:
                            type: integer
                    description: "Shard information"
                hits:
                    $ref: "#/components/schemas/searchHits"
                    description: "Search results"
                aggregations:
                    type: object
                    additionalProperties:
                        $ref: "#/components/schemas/aggregation"
                    description: "Search aggregations"
            required:
                - took
                - timed_out
                - _shards
                - hits
        
        # Cognito User Management API Schemas
        createCognitoUserRequest:
            type: object
            properties:
                userId:
                    $ref: "#/components/schemas/userid_regex"
                    description: "User ID (username) - 3-256 characters"
                email:
                    $ref: "#/components/schemas/email_pattern_regex"
                    description: "User email address"
                phone:
                    type: string
                    pattern: ^\+[0-9]{10,15}$
                    description: "Optional phone number in E.164 format (e.g., +12345678900)"
            required:
                - userId
                - email
            example:
                userId: "user@example.com"
                email: "user@example.com"
                phone: "+12345678900"
        
        updateCognitoUserRequest:
            type: object
            properties:
                email:
                    $ref: "#/components/schemas/email_pattern_regex"
                    description: "Updated email address (optional)"
                phone:
                    type: string
                    pattern: ^\+[0-9]{10,15}$
                    description: "Updated phone number in E.164 format (optional)"
            required: []
            example:
                email: "newemail@example.com"
                phone: "+19876543210"
        
        resetPasswordRequest:
            type: object
            properties:
                confirmReset:
                    type: boolean
                    default: false
                    description: "Confirmation for password reset (must be true)"
            required:
                - confirmReset
            example:
                confirmReset: true
        
        cognitoUserResponse:
            type: object
            properties:
                userId:
                    type: string
                    description: "User ID (username)"
                email:
                    type: string
                    description: "User email address"
                phone:
                    type: string
                    description: "User phone number (if set)"
                    nullable: true
                userStatus:
                    type: string
                    enum: [UNCONFIRMED, CONFIRMED, ARCHIVED, COMPROMISED, UNKNOWN, RESET_REQUIRED, FORCE_CHANGE_PASSWORD]
                    description: "Cognito user status"
                enabled:
                    type: boolean
                    description: "Whether the user account is enabled"
                userCreateDate:
                    type: string
                    format: date-time
                    description: "Date when user was created"
                    nullable: true
                userLastModifiedDate:
                    type: string
                    format: date-time
                    description: "Date when user was last modified"
                    nullable: true
                mfaEnabled:
                    type: boolean
                    description: "Whether MFA is enabled for this user"
                    default: false
            required:
                - userId
                - email
                - userStatus
                - enabled
            example:
                userId: "user@example.com"
                email: "user@example.com"
                phone: "+12345678900"
                userStatus: "CONFIRMED"
                enabled: true
