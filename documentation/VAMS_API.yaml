        assetFileVersionItemModel:
            type: object
            properties:
                relativeKey:
                    type: string
                    description: "Path relative to the asset root"
                versionId:
                    type: string
                    description: "S3 version ID"
                isArchived:
                    type: boolean
                    description: "Whether this file is archived"
            required:
                - relativeKey
                - versionId
        
        assetVersionMetadataItemModel:
            type: object
            properties:
                type:
                    type: string
                    enum: [metadata, attribute]
                    description: "Type of metadata item: 'metadata' (from AssetFileMetadataStorageTableV2) or 'attribute' (from FileAttributeStorageTableV2)"
                filePath:
                    type: string
                    description: "File path relative to asset root. '/' for asset-level metadata, '/path/to/file' for file-level metadata"
                metadataKey:
                    type: string
                    description: "Metadata or attribute key name"
                metadataValue:
                    type: string
                    description: "Metadata or attribute value (stored as string)"
                metadataValueType:
                    $ref: "#/components/schemas/metadataValueType"
                    description: "Data type of the value"
            required:
                - type
                - filePath
                - metadataKey
                - metadataValue
                - metadataValueType
            example:
