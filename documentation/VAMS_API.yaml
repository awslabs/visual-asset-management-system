                          createdOn: "2024-01-15T10:30:00.000Z"
                        - userId: "user2@example.com"
                          roleName: ["viewer"]
                          createdOn: "2024-01-16T14:20:00.000Z"
                    NextToken: "2024-01-16T14:20:00.000Z"
        
        userRoleOperationResponse:
