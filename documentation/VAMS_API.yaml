            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        $ref: "#/components/schemas/workflowTrigger"
                "403":
                    description: Not authorized.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Database, Workflow, OR Trigger not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: databaseId
                in: path
                description: Database ID.
                required: true
                schema:
                    $ref: '#/components/schemas/id_regex'
              - name: workflowId
                in: path
                description: Workflow ID.
                required: true
                schema:
                    $ref: '#/components/schemas/id_regex'
              - name: triggerType
                in: path
                description: "The trigger's key. Use the bare type (supported value: fileUpload) to address a workflow's first trigger of that type, or '<type>#<triggerId>' to address an additional one. On PUT, a key with a new id creates another trigger of that type."
                required: true
                schema:
                    type: string
                    pattern: '^[-_a-zA-Z0-9]+(#[-_a-zA-Z0-9]{3,63})?$'
                    example: "fileUpload#nightly"
        put:
            summary: "Set or replace a workflow trigger."
            description: "Configures a trigger that auto-launches the workflow on a matching event (e.g. a fileUpload trigger firing on a matching file upload). A trigger-launched execution runs as the reserved system user (SYSTEM_USER), not as the user whose action fired the trigger: the acting user may lack permission to run the workflow, so the execution is intentionally decoupled from their permissions to ensure the trigger functions reliably on the data. Executions started directly through the execute endpoint run as the calling user.

Several triggers of one type are supported: address each with its own key ('<type>#<triggerId>'), give it its own inputFileFilters, and point it at its own defaultTemplateIds. An upload launches the workflow once per matching trigger. Two conditions are rejected: a workflow whose concurrencyRestriction is perAsset supports only one trigger of a type (several would contend on the same asset), and two triggers of one type may not name the same defaultTemplateIds — including two that both name none, which is a valid choice and therefore a comparable value."
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/setWorkflowTriggerRequest"
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        $ref: '#/components/schemas/workflowTrigger'
                "400":
                    description: "Invalid parameters; a template named in defaultTemplateIds has a required tag with no default value (message contains a triggerTemplateErrors list) — a triggered (headless) execution cannot supply template tags, so give each such tag a default value or make it optional; an additional trigger of a type on a workflow whose concurrencyRestriction is perAsset; or an additional trigger of a type naming the same defaultTemplateIds as an existing one."
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/triggerTemplateError'
                "403":
                    description: Not authorized.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Database OR Workflow not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: databaseId
                in: path
                description: Database ID.
                required: true
                schema:
                    $ref: '#/components/schemas/id_regex'
              - name: workflowId
                in: path
                description: Workflow ID.
                required: true
                schema:
                    $ref: '#/components/schemas/id_regex'
              - name: triggerType
                in: path
                description: "The trigger's key. Use the bare type (supported value: fileUpload) to address a workflow's first trigger of that type, or '<type>#<triggerId>' to address an additional one. On PUT, a key with a new id creates another trigger of that type."
                required: true
                schema:
                    type: string
                    pattern: '^[-_a-zA-Z0-9]+(#[-_a-zA-Z0-9]{3,63})?$'
                    example: "fileUpload#nightly"
        delete:
            summary: "Delete a workflow trigger."
            responses:
                "200":
                    description: Trigger deleted.
                "400":
                    description: Invalid parameters.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
