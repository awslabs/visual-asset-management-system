            summary: "List all Cognito users."
            description: "Retrieve a paginated list of all users in the Cognito user pool. Returns user details including email, phone, status, and MFA settings. Only available when Cognito is enabled."
            responses:
                "200":
                    description: Users retrieved successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/listCognitoUsersResponse'
                "400":
                    description: Invalid pagination parameters.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to list users.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "503":
                    description: Cognito user management is not available (Cognito not enabled).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
                - name: maxItems
                  in: query
                  description: "Maximum number of users to return (1-60)"
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 60
                      default: 60
                - name: pageSize
                  in: query
                  description: "Number of users per page (1-60)"
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 60
                      default: 60
                - name: startingToken
                  in: query
                  description: "Pagination token from previous response"
                  schema:
                      type: string
            security:
                - DefaultCognitoAuthorizer: []
        post:
            summary: "Create a new Cognito user."
            description: "Create a new user in the Cognito user pool with auto-verified email and optional phone. Cognito auto-generates a temporary password and sends a welcome email to the user. Only available when Cognito is enabled."
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
