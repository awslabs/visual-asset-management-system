openapi: "3.0.1"
info:
    title: "Amazon Visual Asset Management System API"
    description: "REST API (v1) for the Visual Asset Management System (VAMS). All endpoints are secured by a custom Lambda authorizer that validates JWT tokens from Amazon Cognito or external OAuth providers, and enforces two-tier ABAC/RBAC authorization."
    version: "2022-01-27 01:29:36UTC"
servers:
    - url: "{apiGatewayUrl}"
      description: "Amazon API Gateway REST API invoke URL. The stage path (default: /api) is absorbed by the web distribution fronting (CloudFront or ALB)."
      variables:
          apiGatewayUrl:
              default: ""
paths:
    /api/amplify-config:
        get:
            summary: "Get authentication provider configuration."
            description: "Returns the authentication provider configuration used to bootstrap the web application. This endpoint is unauthenticated."
            responses:
                "200":
                    description: OK.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    region:
                                        type: string
                                        description: "Deployment Region"
                                        example: "us-east-1"
                                    api:
                                        type: string
                                        description: "API base URL, including the stage path"
                                    cognitoUserPoolId:
                                        type: string
                                        description: "Amazon Cognito user pool identifier; 'undefined' when Cognito is not the authentication provider"
                                    cognitoAppClientId:
                                        type: string
                                        description: "Amazon Cognito app client identifier; 'undefined' when Cognito is not the authentication provider"
                                    cognitoIdentityPoolId:
                                        type: string
                                        description: "Amazon Cognito identity pool identifier; 'undefined' when Cognito is not the authentication provider"
                                    cognitoUserPoolEndpoint:
                                        type: string
                                        description: "Partition-aware Amazon Cognito user pool (IDP) endpoint URL; 'undefined' when Cognito is not the authentication provider. Supplied because the AWS Amplify JavaScript library resolves only the aws and aws-cn partitions and would otherwise build a .amazonaws.com host in the AWS European Sovereign Cloud, where the suffix is .amazonaws.eu"
                                        example: "https://cognito-idp.us-east-1.amazonaws.com"
                                    contentSecurityPolicy:
                                        type: string
                                        description: "Content Security Policy header value applied by the web application"
                                    bannerHtmlMessage:
                                        type: string
                                        description: "Optional banner HTML rendered by the web application; empty when not configured"
                                    externalOAuthIdpURL:
                                        type: string
                                        description: "External OAuth identity provider URL; present when an external OAuth IDP is the authentication provider"
                                    externalOAuthIdpClientId:
                                        type: string
                                        description: "External OAuth identity provider client identifier"
                                    externalOAuthIdpScope:
                                        type: string
                                        description: "External OAuth identity provider scope"
                                    externalOAuthIdpScopeMfa:
                                        type: string
                                        description: "External OAuth identity provider MFA scope"
                                    externalOAuthIdpTokenEndpoint:
                                        type: string
                                        description: "External OAuth identity provider token endpoint"
                                    externalOAuthIdpAuthorizationEndpoint:
                                        type: string
                                        description: "External OAuth identity provider authorization endpoint"
                                    externalOAuthIdpDiscoveryEndpoint:
                                        type: string
                                        description: "External OAuth identity provider discovery endpoint"
                                required:
                                    - region
                                    - api
                "500":
                    description: Internal server error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
    /secure-config:
        get:
            summary: "Get secure runtime configuration."
            description: "Returns the runtime configuration for the authenticated user, including the enabled feature flags, the Amazon Location Service map API URL (when enabled), and the deployed web application URL."
            responses:
                "200":
                    description: Runtime configuration retrieved successfully.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    featuresEnabled:
                                        type: string
                                        description: "Comma-separated list of enabled feature flags"
                                        example: "CLOUDFRONTDEPLOY,LOCATIONSERVICES,AUTHPROVIDER_COGNITO"
                                    locationServiceApiUrl:
                                        type: string
                                        description: "Amazon Location Service map style descriptor URL with embedded API key; empty when Location Services is not enabled"
                                    webDeployedUrl:
                                        type: string
                                        description: "Deployed web application URL; empty when not configured"
                                required:
                                    - featuresEnabled
                                    - locationServiceApiUrl
                                    - webDeployedUrl
                "403":
                    description: Not authorized.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Internal server error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
    /api/version:
        get:
            summary: "Get VAMS version information."
            description: "Returns the current version of the Visual Asset Management System. This endpoint is unauthenticated and can be used for health checks or version verification."
            responses:
                "200":
                    description: Version information retrieved successfully.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    version:
                                        type: string
                                        description: "Current VAMS version"
                                        example: "2.2.0"
                                required:
                                    - version
                "500":
                    description: Internal server error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
    /assets:
            put:
                summary: "Create or update an asset."
                requestBody:
                    required: true
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/asset'
                responses:
                    "200":
                        description: OK
                    "400":
                        description: Invalid parameters.
                        content:
                            application/json:
                                schema:
                                    $ref: '#/components/schemas/error'
                    "404":
                        description: Database not found.
                        content:
                            application/json:
                                schema:
                                    $ref: '#/components/schemas/error'
                    "500":
                        description: Error processing request.
                        content:
                            application/json:
                                schema:
                                    $ref: '#/components/schemas/error'
            get:
                summary: "List all assets."
                responses:
                    "200":
                        description: OK
                        content:
                            application/json:
                                schema:
                                    type: object
                                    properties:
                                        assets:
                                            type: array
                                            items:
                                                $ref: "#/components/schemas/asset"
                    "500":
                        description: Error processing request.
                        content:
                            application/json:
                                schema:
                                    $ref: '#/components/schemas/error'
    /assets/all:
            put:
                summary: "Create or update one or multiple assets."
                requestBody:
                    required: true
                    content:
                        application/json:
                            schema:
                                type: object
                                items:
                                    $ref: "#/components/schemas/asset"
                responses:
                    "200":
                        description: OK
                    "400":
                        description: Invalid parameters.
                        content:
                            application/json:
                                schema:
                                    $ref: '#/components/schemas/error'
                    "404":
                        description: Database not found.
                        content:
                            application/json:
                                schema:
                                    $ref: '#/components/schemas/error'
                    "500":
                        description: Error processing request.
                        content:
                            application/json:
                                schema:
                                    $ref: '#/components/schemas/error'
    /asset-links:
        post:
            summary: "Create a new asset link."
            description: "Create a new asset link between two assets with relationship type and optional metadata. Supports 'related' and 'parentChild' relationship types with cycle detection. Assets can be in different databases (cross-database links)."
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/createAssetLinkRequest"
            responses:
                "200":
                    description: Asset link created successfully.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/createAssetLinkResponse"
                "400":
                    description: Invalid parameters or validation error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to create asset link.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            security:
              - DefaultCognitoAuthorizer: []
    /database/{databaseId}/assets/{assetId}/asset-links:
        get:
            summary: "Get asset links for a specific asset."
            description: "Retrieve all asset links (related, parents, children) for a specific asset. Supports optional tree view for hierarchical display of parent-child relationships."
            responses:
                "200":
                    description: Asset links retrieved successfully.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                  - $ref: "#/components/schemas/getAssetLinksResponse"
                                  - $ref: "#/components/schemas/getAssetLinksTreeViewResponse"
                "400":
                    description: Invalid parameters.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to view asset links.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Asset not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: "assetId"
                in: "path"
                description: "Unique identifier for asset."
                required: true
                schema:
                    $ref: "#/components/schemas/id_regex"
              - name: "databaseId"
                in: "path"
                description: "Database ID for the asset."
                required: true
                schema:
                    $ref: "#/components/schemas/id_regex"
              - name: "childTreeView"
                in: "query"
                description: "Whether to return children as a tree structure."
                required: false
                schema:
                    type: boolean
                    default: false
            security:
              - DefaultCognitoAuthorizer: []
    /asset-links/single/{assetLinkId}:
        get:
            summary: "Get a single asset link by ID."
            description: "Retrieve details of a specific asset link by its unique identifier."
            responses:
                "200":
                    description: Asset link retrieved successfully.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/getSingleAssetLinkResponse"
                "400":
                    description: Invalid parameters.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to view this asset link.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Asset link not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: "assetLinkId"
                in: "path"
                description: "Unique identifier for asset link."
                required: true
                schema:
                    $ref: "#/components/schemas/uuid_regex"
            security:
              - DefaultCognitoAuthorizer: []
    /asset-links/{assetLinkId}:
        put:
            summary: "Update an asset link."
            description: "Update an existing asset link. Currently only tags can be updated."
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/updateAssetLinkRequest"
            responses:
                "200":
                    description: Asset link updated successfully.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/updateAssetLinkResponse"
                "400":
                    description: Invalid parameters.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to update this asset link.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Asset link not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            security:
              - DefaultCognitoAuthorizer: []
        delete:
            summary: "Delete an asset link."
            description: "Delete an asset link by its unique identifier. Also removes associated metadata."
            responses:
                "200":
                    description: Asset link deleted successfully.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/deleteAssetLinkResponse"
                "400":
                    description: Invalid parameters.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to delete asset link.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Asset link not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            security:
              - DefaultCognitoAuthorizer: []
        parameters:
          - name: "assetLinkId"
            in: "path"
            description: "Unique identifier for asset link."
            required: true
            schema:
                $ref: "#/components/schemas/uuid_regex"
    /asset-links/{assetLinkId}/metadata:
        get:
            summary: "Get metadata for an asset link."
            description: "Retrieve all metadata associated with a specific asset link with pagination support."
            responses:
                "200":
                    description: Metadata retrieved successfully.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/getAssetLinkMetadataResponse"
                "400":
                    description: Invalid parameters or pagination token.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to view metadata for this asset link.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Asset link not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: "assetLinkId"
                in: "path"
                description: "Unique identifier for asset link."
                required: true
                schema:
                    $ref: "#/components/schemas/uuid_regex"
              - $ref: "#/components/parameters/maxItemsParam"
              - $ref: "#/components/parameters/pageSizeParam"
              - $ref: "#/components/parameters/startingTokenParam"
            security:
              - DefaultCognitoAuthorizer: []
        post:
            summary: "Create metadata for an asset link (bulk operation)."
            description: "Add new metadata items to a specific asset link. Supports bulk creation of multiple metadata items in a single request. Returns partial success information if some items fail."
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/createAssetLinkMetadataRequest"
            responses:
                "200":
                    description: Metadata creation completed (may include partial failures).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/bulkMetadataOperationResponse"
                "400":
                    description: Invalid parameters or validation error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to create metadata for this asset link.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Asset link not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: "assetLinkId"
                in: "path"
                description: "Unique identifier for asset link."
                required: true
                schema:
                    $ref: "#/components/schemas/uuid_regex"
            security:
              - DefaultCognitoAuthorizer: []
        put:
            summary: "Update metadata for an asset link (bulk operation)."
            description: "Update existing metadata items for a specific asset link. Supports two update modes: UPDATE (default, upserts provided metadata) and REPLACE_ALL (replaces all metadata with provided items, requires PUT+POST+DELETE permissions). Returns partial success information if some items fail. REPLACE_ALL mode includes automatic rollback on failure."
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/updateAssetLinkMetadataRequest"
            responses:
                "200":
                    description: Metadata update completed (may include partial failures).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/bulkMetadataOperationResponse"
                "400":
                    description: Invalid parameters or validation error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to update metadata for this asset link.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Asset link not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: "assetLinkId"
                in: "path"
                description: "Unique identifier for asset link."
                required: true
                schema:
                    $ref: "#/components/schemas/uuid_regex"
            security:
              - DefaultCognitoAuthorizer: []
        delete:
            summary: "Delete metadata for an asset link (bulk operation)."
            description: "Remove metadata items from an asset link. Supports bulk deletion of multiple metadata items in a single request. Returns partial success information if some items fail."
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/deleteAssetLinkMetadataRequest"
            responses:
                "200":
                    description: Metadata deletion completed (may include partial failures).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/bulkMetadataOperationResponse"
                "400":
                    description: Invalid parameters or validation error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to delete metadata for this asset link.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Asset link not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: "assetLinkId"
                in: "path"
                description: "Unique identifier for asset link."
                required: true
                schema:
                    $ref: "#/components/schemas/uuid_regex"
            security:
              - DefaultCognitoAuthorizer: []
    /auth/constraints:
        get:
            summary: "List all constraints."
            description: "Retrieve a paginated list of all authorization constraints. Constraints define fine-grained access control rules based on object attributes and user/group permissions."
            responses:
                "200":
                    description: Constraints retrieved successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/getConstraintsResponse'
                "400":
                    description: Invalid pagination parameters.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to list constraints.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
                - $ref: '#/components/parameters/maxItemsParam'
                - $ref: '#/components/parameters/pageSizeParam'
                - $ref: '#/components/parameters/startingTokenParam'
            security:
            - DefaultCognitoAuthorizer: []    
    /auth/constraints/{constraintId}/:
        get:
            summary: "Get a specific constraint."
            description: "Retrieve details of a specific authorization constraint by its ID."
            responses:
                "200":
                    description: Constraint retrieved successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/getConstraintResponse'
                "400":
                    description: Invalid constraint ID.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to view this constraint.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Constraint not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: "constraintId"
                in: "path"
                description: "Unique identifier for constraint."
                required: true
                schema:
                    $ref: '#/components/schemas/object_name_pattern_regex'
            security:
            -   DefaultCognitoAuthorizer: []
        post:
            summary: "Create or update a constraint."
            description: "Create a new constraint or update an existing one. Constraints define fine-grained access control rules with criteria (AND/OR logic) and permissions for groups/users. At least one criteria (criteriaAnd or criteriaOr) must be provided."
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/createConstraintRequest'
            parameters:
            - name: "constraintId"
              in: "path"
              description: "Unique identifier for constraint. If provided in path, overrides identifier in request body."
              required: true
              schema:
                $ref: '#/components/schemas/object_name_pattern_regex'
            responses:
                "200":
                    description: Constraint created/updated successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/constraintOperationResponse'
                "400":
                    description: Invalid parameters, missing required criteria, or role does not exist.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to create/update constraints.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            security:
            -   DefaultCognitoAuthorizer: []
        put:
            summary: "Create or update a constraint."
            description: "Create a new constraint or update an existing one. Constraints define fine-grained access control rules with criteria (AND/OR logic) and permissions for groups/users. At least one criteria (criteriaAnd or criteriaOr) must be provided. PUT method is treated the same as POST for constraints."
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/createConstraintRequest'
            parameters:
            - name: "constraintId"
              in: "path"
              description: "Unique identifier for constraint. If provided in path, overrides identifier in request body."
              required: true
              schema:
                $ref: '#/components/schemas/object_name_pattern_regex'
            responses:
                "200":
                    description: Constraint created/updated successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/constraintOperationResponse'
                "400":
                    description: Invalid parameters, missing required criteria, or role does not exist.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to create/update constraints.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            security:
            -   DefaultCognitoAuthorizer: []
        delete: 
            summary: "Delete a constraint."
            description: "Delete a constraint by its ID. This operation cannot be undone."
            responses:
                "200":
                    description: Constraint deleted successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/constraintOperationResponse'
                "400":
                    description: Invalid constraint ID.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to delete constraints.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Constraint not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: "constraintId"
                in: "path"
                description: "Unique identifier for constraint."
                required: true
                schema:
                    $ref: '#/components/schemas/object_name_pattern_regex'
            security:
            -   DefaultCognitoAuthorizer: []
    /auth/loginProfile/{userId}/:
        get:
            summary: "Get loginProfile for the specified user"
            description: "Returns the requesting user's stored login profile. A user who has authenticated but has no stored profile yet (for example, not assigned any roles) receives an identity-only profile so login can still proceed."
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
