                                type: string
                                description: "User (or SYSTEM_USER) that created this version. Blank or absent for legacy versions."
                            changeWorkflowId:
                                type: string
                                description: "Workflow ID that created this version, when changeSource is workflowExecution."
                            changeWorkflowExecutionId:
                                type: string
                                description: "Workflow execution ID that created this version, when changeSource is workflowExecution."
                            changeAssetIdFrom:
                                type: string
                                description: "Source asset ID this version was copied or moved from, when applicable."
                            changeDatabaseIdFrom:
                                type: string
                                description: "Source database ID this version was copied or moved from, when applicable."
                            changeAssetFilePathFrom:
                                type: string
                                description: "Source file path this version was copied, moved, or renamed from, when applicable."
                            changeAssetFileVersionFrom:
