                - DefaultCognitoAuthorizer: []
    /database/{databaseId}/assets/{assetId}/auxiliaryPreviewAssets/stream/{proxy+}:
        get:
            summary: "Stream auxiliary preview asset files with HTTP range support."
            description: "Stream auxiliary preview asset files (e.g., converted formats, thumbnails, octree / 3D tile viewer data) from the auxiliary bucket, with HTTP range support. Delivery uses one of two modes selected by the ALWAYS_REDIRECT_TO_PRESIGNED toggle in the streamAuxiliaryPreviewAsset handler. In presigned-redirect mode (required on the API Gateway REST API, and the current default), every request returns a 307 redirect to a short-lived S3 presigned URL that the client follows to fetch the bytes directly from the CORS-enabled auxiliary bucket (S3 serves Range/206 natively). In inline mode, files at or under ~4.4MB are returned inline (base64-encoded for binary) and larger files fall back to the 307 redirect."
            responses:
                "200":
                    description: Auxiliary preview file content returned inline (inline mode, files at or under ~4.4MB).
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
                        text/plain:
                            schema:
                                type: string
                        image/*:
                            schema:
                                type: string
                                format: binary
                        video/*:
                            schema:
                                type: string
                                format: binary
                        audio/*:
                            schema:
                                type: string
                                format: binary
                    headers:
                        Accept-Ranges:
                            description: "Indicates that the server supports range requests"
                            schema:
                                type: string
                                example: "bytes"
                        Content-Type:
                            description: "MIME type of the file"
                            schema:
                                type: string
                        Content-Length:
                            description: "Size of the content in bytes"
                            schema:
                                type: string
                        Content-Range:
                            description: "Range of bytes being returned (for partial content)"
                            schema:
                                type: string
                                example: "bytes 200-1023/2048"
                        Content-Encoding:
                            description: "Content encoding if applicable"
                            schema:
                                type: string
                "206":
                    description: Partial content returned (when Range header is used).
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
                    headers:
                        Content-Range:
                            description: "Range of bytes being returned"
                            schema:
                                type: string
                                example: "bytes 200-1023/2048"
                        Content-Type:
                            description: "MIME type of the file"
                            schema:
                                type: string
                        Content-Length:
                            description: "Size of the partial content in bytes"
                            schema:
                                type: string
                "307":
                    description: "Temporary redirect to an S3 presigned URL for the file (presigned-redirect mode, and for larger files in inline mode). The client follows the Location header to fetch the bytes directly from S3."
                    headers:
                        Location:
                            description: "S3 presigned URL to fetch the file content."
                            schema:
                                type: string
                "400":
                    description: Invalid parameters, file too large for streaming, or unallowed file type.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to stream this asset.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Database, asset, or file not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
                - name: "databaseId"
                  in: "path"
                  description: "Unique identifier for database."
                  required: true
                  schema:
                      $ref: '#/components/schemas/id_regex'
                - name: "assetId"
                  in: "path"
                  description: "Unique identifier for asset."
                  required: true
                  schema:
                      $ref: '#/components/schemas/id_regex'
                - name: "proxy+"
                  in: "path"
                  description: "File path within the auxiliary preview bucket to stream. Can include subdirectories and filename."
                  required: true
                  schema:
                    type: "string"
                - name: "Range"
                  in: "header"
                  description: "HTTP Range header for partial content requests (e.g., 'bytes=200-1023')."
                  required: false
                  schema:
                      type: string
                      pattern: ^bytes=\d+-\d*$
                      example: "bytes=200-1023"
            security:
                - DefaultCognitoAuthorizer: []
        head:
            summary: "Check auxiliary preview file availability and permissions without downloading content."
            description: "Check if an auxiliary preview file exists and retrieve metadata headers without downloading file content. Uses S3 head_object for efficient metadata retrieval. Returns the same headers as GET but with empty body. Does not check file size thresholds or generate redirects."
            responses:
                "200":
                    description: File exists and user has permission to access it.
                    headers:
                        Accept-Ranges:
                            description: "Indicates that the server supports range requests"
                            schema:
                                type: string
                                example: "bytes"
                        Content-Type:
                            description: "MIME type of the file"
                            schema:
                                type: string
                        Content-Length:
                            description: "Size of the content in bytes"
                            schema:
                                type: string
                        Last-Modified:
                            description: "Last modification date"
                            schema:
                                type: string
                                format: date-time
                        ETag:
                            description: "Entity tag for cache validation"
                            schema:
                                type: string
                        x-amz-version-id:
                            description: "S3 version ID if versioned"
                            schema:
                                type: string
                        x-amz-storage-class:
                            description: "S3 storage class"
                            schema:
                                type: string
                        Cache-Control:
                            description: "Cache control directive"
                            schema:
                                type: string
                                example: "no-cache, no-store"
                "400":
                    description: Invalid parameters or unallowed file type.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to access this asset.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Database, asset, or file not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
                - name: "databaseId"
                  in: "path"
                  description: "Unique identifier for database."
                  required: true
                  schema:
                      $ref: '#/components/schemas/id_regex'
                - name: "assetId"
                  in: "path"
                  description: "Unique identifier for asset."
                  required: true
                  schema:
                      $ref: '#/components/schemas/id_regex'
                - name: "proxy+"
                  in: "path"
                  description: "File path within the auxiliary preview bucket to check. Can include subdirectories and filename."
                  required: true
                  schema:
                    type: "string"
            security:
                - DefaultCognitoAuthorizer: []
    /database/{databaseId}/assets/{assetId}/listFiles:
        get:
            summary: "List files in an asset."
            description: "List files in an asset with optional pagination and filtering. Supports two modes: basic mode (fast, minimal data) and full mode (detailed data with version info, preview files, and metadata). Use basic mode for quick file listings and full mode when you need complete file information."
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/listAssetFilesResponse"
                "403":
                    description: Database OR Asset OR Version not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Database OR Asset OR Version not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: maxItems
                in: query
                description: "Maximum number of items to return. Default is 200 for full mode, 1500 for basic mode. Maximum allowed is 1500."
                required: false
                schema:
                    type: integer
                    minimum: 1
                    maximum: 1500
              - name: pageSize
                in: query
                description: "Number of items per page. Default is 200 for full mode, 1500 for basic mode. Maximum allowed is 1500."
                required: false
                schema:
                    type: integer
                    minimum: 1
                    maximum: 1500
              - $ref: "#/components/parameters/startingTokenParam"
              - name: databaseId
                in: path
                description: Database ID
                required: true
                schema:
                    $ref: '#/components/schemas/id_regex'
              - name: assetId
                in: path
                description: Asset ID
                required: true
                schema:
                    $ref: '#/components/schemas/asset_id_regex'
              - name: includeArchived
                in: query
                description: Whether to include archived files
                required: false
                schema:
                    type: boolean
                    default: false
              - name: prefix
                in: query
                description: Filter files by prefix
                required: false
                schema:
                    type: string
              - name: basic
                in: query
                description: "Enable basic mode for fast file listing. When true, skips expensive operations (head_object calls, preview file lookups, version mismatch checks) and returns only data available from S3 list operation. Fields like versionId, primaryType, and previewFile will be null/empty in basic mode. Use basic mode for quick listings and full mode (basic=false) when you need complete file details."
                required: false
                schema:
                    type: boolean
                    default: false
              - name: assetVersionId
                in: query
                required: false
                schema:
                    type: string
                description: Optional asset version ID. When provided, returns files from the specified version snapshot instead of current state.
