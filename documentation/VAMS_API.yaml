                - assetId
                - recordDate
                - changeSource
                - changeUserId

        getAssetHistoryResponse:
            type: object
            properties:
                message:
                    type: string
                Items:
                    type: array
                    items:
                        $ref: "#/components/schemas/assetHistoryRecord"
                NextToken:
                    type: string
                    nullable: true
