                    description: "Path to the preview file for this file, if any. Empty string if no preview file exists."
                changeSource:
                    type: string
                    description: "How the current file version was created (direct, upload, workflowExecution, fileCopy, fileMove, fileRename, fileArchive, fileUnarchive, fileRevert). Blank or absent for versions created before change provenance tracking was introduced."
                changeUserId:
                    type: string
                    description: "User (or SYSTEM_USER) that created the current file version. Blank or absent for legacy versions."
            required:
                - fileName
                - key
                - relativePath
                - isFolder

