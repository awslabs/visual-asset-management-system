                - Items

        assetVersionOperationResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: "Whether the operation was successful"
                message:
                    type: string
                    description: "Message describing the result"
                assetId:
                    $ref: '#/components/schemas/id_regex'
                assetVersionId:
                    type: string
                    description: "Asset version ID"
                operation:
                    type: string
                    description: "Operation performed (create, revert, archive, unarchive)"
