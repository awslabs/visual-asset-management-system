    /database/{databaseId}/pipelines/{pipelineId}/templates:
        get:
            summary: "List a pipeline's templates."
            description: >-
                Returns one page of the pipeline's templates. Each item is the full template record,
                not a summary.


                A configBody or webFormJson that VAMS offloaded to Amazon S3 is returned EMPTY in
                this view: the list does not rehydrate bodies from Amazon S3, so a large template
                reads as if its body were blank. Read such a template through
                GET /database/{databaseId}/pipelines/{pipelineId}/templates/{templateId}, which
                returns both bodies inline. The item's tagSchema is likewise absent here and is
                returned by the single-template GET.


                A page carries at most 10 templates. When more remain, the response carries a
                NextToken; send it back as startingToken to read the next page.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: object
                                        properties:
                                            Items:
                                                type: array
                                                items:
                                                    $ref: "#/components/schemas/pipelineTemplateListItem"
                                            NextToken:
                                                type: string
                                                nullable: true
                "400":
                    description: Invalid parameters, or a startingToken that cannot be decoded.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Database OR Pipeline not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: pageSize
                in: query
                description: "Number of templates returned in one page. A value above the maximum is served at the maximum, and an unparseable value falls back to the default."
                required: false
                schema:
                    type: integer
                    minimum: 1
                    maximum: 10
                    default: 10
              - name: maxItems
                in: query
                description: "Alias of pageSize for this route; pageSize takes precedence when both are sent."
                required: false
                schema:
                    type: integer
                    minimum: 1
                    maximum: 10
                    default: 10
              - name: startingToken
                in: query
                description: "NextToken from a previous page. A token that cannot be decoded is rejected with 400."
                required: false
                allowEmptyValue: true
                schema:
                    type: string
              - name: databaseId
                in: path
                description: Database ID.
                required: true
                schema:
                    $ref: '#/components/schemas/id_regex'
              - name: pipelineId
                in: path
                description: Pipeline ID.
                required: true
                schema:
                    $ref: '#/components/schemas/id_regex'
        post:
            summary: "Create a pipeline template."
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/createPipelineTemplateRequest"
            responses:
                "200":
                    description: Template created.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        $ref: '#/components/schemas/pipelineTemplate'
                "400":
                    description: "Invalid parameters, or the template is referenced by a workflow trigger as a default and has a required tag with no default value (message contains a triggerTemplateErrors list)."
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/triggerTemplateError'
                "403":
                    description: Not authorized.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Database OR Pipeline not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
