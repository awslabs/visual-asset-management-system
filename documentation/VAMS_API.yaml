    /workflows:
        get:
            summary: "List all workflows."
            description: "Each item reports triggerCount and triggersEnabledCount (both null when the workflow's triggers could not be read). The two differ when a trigger exists but is disabled — the state behind a workflow that looks configured yet never fires. hasTriggers filters on the ENABLED count. Because triggers live in a separate table, the filter is applied after the page is read, so a filtered page may return fewer items than pageSize while still reporting a NextToken; page until the token is absent."
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: object
                                        properties:
                                            Items:
                                                type: array
                                                items:
                                                    $ref: "#/components/schemas/workflowV2"
                                            NextToken:
                                                type: string
                                                nullable: true
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - $ref: '#/components/parameters/maxItemsParam'
              - $ref: '#/components/parameters/pageSizeParam'
              - $ref: '#/components/parameters/startingTokenParam'
              - in: query
                name: hasTriggers
                required: false
                schema:
                    type: string
                    enum: [true, false]
                description: "true returns only workflows with at least one ENABLED trigger; false only those with none. Any other value is rejected with a 400 rather than silently ignored."
    /workflows/executions:
        get:
            summary: "List workflow executions across all assets (global)."
            description: "Asset-less, permission-filtered list of executions. An execution is visible when the caller has GET on its workflow and GET on EVERY asset the run read (each input file's asset plus each asset named as a metadata source), or on the asset it wrote to for a run with no inputs; a permanently deleted asset defers to GET on the database it lived in. Lists recent executions by default (started within the last 90 days); filterStartDate/filterEndDate query an explicit range. Supports optional filters (workflowId, workflowDatabaseId, status, triggerType, groupId, triggeredByUserId) and NextToken pagination. The applied window is echoed back as filterStartDate (and filterEndDate when supplied). Each row also reports the run's output target (outputLocationType, outputAssetId, outputDatabaseId); these are empty for a results-only execution that writes no files."
            parameters:
              - name: pageSize
                in: query
                description: "Rows read per page. A value above the maximum is served at the maximum, and an unparseable or non-positive value falls back to the default. The page is read before the per-execution visibility check, so a page may return fewer rows than pageSize while still carrying a NextToken; page until the token is absent."
                required: false
                schema:
                    type: integer
                    minimum: 1
                    maximum: 100
                    default: 50
              - name: maxItems
                in: query
                description: "Alias of pageSize for this route; pageSize takes precedence when both are sent."
                required: false
                schema:
                    type: integer
                    minimum: 1
                    maximum: 100
                    default: 50
              - name: startingToken
                in: query
                description: "NextToken from a previous page. A token that cannot be decoded is rejected with 400 rather than restarting at the first page."
                required: false
                allowEmptyValue: true
                schema:
                    type: string
              - name: NextToken
                in: query
                description: "Alias of startingToken, so a response's NextToken can be sent back under the name it was returned as. startingToken takes precedence when both are sent."
                required: false
                allowEmptyValue: true
                schema:
                    type: string
              - in: query
                name: filterStartDate
                required: false
                description: "UTC lower bound on execution start date, of the form YYYY-MM-DDTHH:MM:SSZ; only executions started on or after this date are listed. Fractional seconds and a +00:00 offset are accepted and normalized. Any other form is rejected with 400. Defaults to 90 days ago."
                schema:
                    type: string
              - in: query
                name: filterEndDate
                required: false
                description: "UTC upper bound on execution start date, of the form YYYY-MM-DDTHH:MM:SSZ; only executions started on or before this date are listed. Fractional seconds and a +00:00 offset are accepted and normalized. Any other form is rejected with 400."
                schema:
                    type: string
              - in: query
                name: workflowId
                required: false
                schema:
                    type: string
              - in: query
                name: workflowDatabaseId
                required: false
                schema:
                    type: string
              - in: query
                name: status
                required: false
                schema:
                    type: string
              - in: query
                name: triggerType
                required: false
                schema:
                    type: string
              - in: query
                name: groupId
                required: false
                schema:
                    type: string
              - in: query
                name: triggeredByUserId
                required: false
                schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: object
                                        properties:
                                            Items:
                                                type: array
                                                items:
                                                    $ref: "#/components/schemas/executionListRow"
                                            filterStartDate:
                                                type: string
                                                description: "The lower bound that was applied, so the response is self-describing."
                                            filterEndDate:
                                                type: string
                                                description: "The upper bound that was applied, present only when one was supplied."
                                            NextToken:
                                                type: string
                                                nullable: true
                "400":
                    description: A filter or pagination parameter is invalid — a filterStartDate or filterEndDate outside the accepted UTC form, or a startingToken that cannot be decoded.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
    /workflows/executions/{executionId}:
        delete:
            summary: "Abort a running workflow execution (or a whole group)."
            description: "Stops any still-running inner pipeline executions first, then the outer Step Functions execution, and marks the unfinished pipeline records and the overall execution as ABORTED. Requires GET on the execution's workflow and POST on every input-file asset tied to the execution. With the optional ?groupId= query parameter, aborts every active execution in the group the caller is authorized on (inaccessible members are skipped)."
            parameters:
              - in: path
                name: executionId
                required: true
                schema:
                    $ref: '#/components/schemas/execution_id_regex'
                description: Identifier of the execution to abort.
              - in: query
                name: groupId
                required: false
                schema:
                    type: string
                description: When set, abort all active executions in this group instead of the single execution. The executionId path segment is still required by the route but takes no part in a group abort.
            responses:
                "200":
                    description: >
                        OK. A single abort carries a warnings array only when a registered sub-process
                        could not be stopped; the sub-process is then left running and the warning names
                        it. A group abort carries the group id and a per-member result for every member
                        the caller is authorized on, skippedInaccessibleCount when members were withheld
                        for access, and moreRemaining when active members remain beyond the request's
                        cap of 200 — re-invoke to continue.
                "400":
                    description: Invalid or missing executionId.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized (API, workflow, or one of the input-file assets).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Execution not found, or — for a group abort — no executions exist in the group.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
    /workflows/executions/{executionId}/details:
        get:
            summary: "Get full detail and input/output traceability for an execution."
            description: "Returns the underlying pipelines (with status, timing, names/descriptions cross-fetched from the pipeline definitions, and each pipeline's resolved configuration as renderedConfig, which is post-template-tag and pre-system-tag), the execution's output target (outputLocationType plus outputDatabaseId/outputAssetId for asset outputs), input files, input metadata (asset and file metadata under inputMetadata, database metadata under inputDatabaseMetadata; each row reports its entity's metadata under 'metadata' and that file's attributes under 'attributes', kept separate because a pipeline's metadataInputs grants fileMetadata and fileAttributes independently - a row with attributes and no metadata still appears with an empty metadata map, and asset/database-scope rows always report an empty attributes map), the metadata sources of the run (metadataSourceDatabases lists every database captured and matches the inputDatabaseMetadata rows; metadataSourceAssets lists the assets named purely as sources; metadataSourceDatabaseId is the single database an execution with no input files named, and is empty for an execution whose databases came from its input files), input configurations, and a listing of all outputs (files, metadata, results) each tagged with the producing pipelineId. Input metadata is attributed PER PIPELINE: every row carries the pipelineId of the pipeline that read the entity, because a workflow's pipelines do not read the same entities - each receives the subset of input files passing its own inputFileFilters, and an inputFileArity 'none' pipeline receives none. A file's metadata belongs only to the pipeline that received that file; an asset's own ('/') row to a pipeline receiving at least one file from that asset or, for a named metadata-source asset, to every pipeline (a file-less pipeline reads the first asset group, so that group's row is recorded for it); a database's metadata to EVERY pipeline, since database metadata describes an entity rather than a file selection and every step is handed the run's whole set of databases. The same entity therefore legitimately appears once per pipeline that read it - a 3-pipeline run returns each database row 3 times, identical but for the pipelineId - and those rows are distinct facts rather than one row repeated. Works for running and completed executions; running executions may be partially populated. Internal details (ARNs, temporary/auxiliary S3 input/output locations, credential-vending fields) are omitted. Every collection is bounded so the response fits the AWS Lambda synchronous-response limit: each is read to at most 2000 rows, and each is then trimmed to at most 1000 returned rows apart from outputs.files, which the read cap and the byte budget bound on their own. The assembled response is additionally held to a byte ceiling below the Lambda limit, so a collection whose rows are large is trimmed further than the row caps alone would: the file collections are served first out of that ceiling and the metadata collections divide what they leave, with outputs.results granted ahead of them. truncatedCollections names every collection that came back partial -- 'inputFiles', 'inputMetadata', 'inputDatabaseMetadata', 'outputs.files', 'outputs.metadata', 'outputs.results' -- and is empty when the view is complete. The three metadata collections (inputMetadata, inputDatabaseMetadata, outputs.metadata) are retrievable in full from GET /workflows/executions/{executionId}/details/metadata, which pages one collection at a time with a continuation token; inputFiles, outputs.files, and outputs.results have no paged route, which is why the response budget is spent on them first. inputMetadata and inputDatabaseMetadata are read together, so a read-cap hit names both while a return-trim names only the trimmed collection. Both are per-pipeline collections, so their bounds are spent evenly across the run's pipelines rather than in collection order - each pipeline reads its own share of the 2000-row read budget, and a return trim takes a share from each pipeline instead of a prefix, so a trimmed collection still holds rows for every pipeline rather than reading as though the later steps took no metadata. A pipeline entry's renderedConfig is the configuration body after the caller's template-tag values were substituted and BEFORE the reserved system tags were: template substitution is two-stage, so the system tags ({{assetMetadataObject}}, {{jobName}}, the output paths) resolve per step at launch once that step's manifest and execution context exist. renderedConfig therefore still shows those as literal {{tag}} placeholders, which is expected rather than a failed substitution. It is held inline up to a size limit, and renderedConfigTruncated reports whether that inline copy was shortened. The entry also carries renderedConfigLocation ({bucket, key}) whenever the object exists - not only on truncation - because it is the Amazon S3 object holding the FULLY substituted body the pipeline itself read. The two fields describe different stages of the same body: renderedConfig is pre-system-tag, renderedConfigLocation post, so they are not two views of one value and a caller wanting what the step actually ran with needs the pointer even when the inline copy is complete. Requires GET on the execution's workflow, GET on every input-file asset tied to the execution, GET on every asset named as a metadata source, and GET on every database in metadataSourceDatabases - every captured database must be permitted, so the databases reported are exactly those access to this view required."
            parameters:
              - in: path
                name: executionId
                required: true
                schema:
                    $ref: '#/components/schemas/execution_id_regex'
                description: Identifier of the execution.
            responses:
                "200":
                    description: OK
                "400":
                    description: Invalid or missing executionId.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized (API, workflow, or one of the input-file assets).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Execution not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
    /workflows/executions/{executionId}/details/metadata:
        get:
            summary: "Read one of an execution's metadata collections a page at a time."
            description: >-
                Returns one page of ONE of the execution's metadata collections, with a continuation
                token, so a collection the details view reported truncated can be walked in full.
                Rows carry the same scrubbed shape the details view returns, plus the pipelineId of
                the step that read (or wrote) the entity, so a client renders a page with the columns
                it already has.


                Three collections are addressable, matching the details view's three metadata
                sections: 'input' is inputMetadata (the asset and file metadata each step read),
                'inputDatabase' is inputDatabaseMetadata (each metadata-source database's own
                metadata), and 'output' is outputs.metadata. The details view's file collections
                (inputFiles, outputs.files) and outputs.results have no paged equivalent, which is why
                the details view serves them ahead of the metadata collections when its own byte
                budget cannot hold everything.


                Every metadata collection is keyed per pipeline execution, so the walk visits the
                execution's steps in a stable order and the token names a position within it - which
                step to continue in, and where inside that step. A token is only valid alongside the
                pipelineId filter it was issued with, and a token whose step order has changed
                underneath it is rejected with 400 rather than resumed in the wrong step. Nothing is
                dropped by a page bound: a page ends at the first row it could not carry and the token
                resumes there. NextToken is absent on the last page, so its presence is what tells a
                client there is more.


                A page carries at most 500 rows and at most 4,194,304 bytes (4 MB) of rows, whichever
                comes first; pageSize above the maximum is served at the maximum rather than rejected.
                'input' and 'inputDatabase' are the two scope halves of one stored collection, so a
                request for one reads past the other's rows; a single request scans at most 20,000
                rows and then ends the page with a token at the last row scanned.


                Authorization is the same rule the details view enforces, evaluated for GET: GET on
                the execution's workflow, GET on every input-file asset tied to the execution, GET on
                every asset named as a metadata source, and GET on every database in
                metadataSourceDatabases. Exactly the callers who can open the details view can page
                its metadata.
            parameters:
              - in: path
                name: executionId
                required: true
                schema:
                    $ref: '#/components/schemas/execution_id_regex'
                description: Identifier of the execution.
              - in: query
                name: collection
                required: false
                schema:
                    type: string
                    enum: [input, inputDatabase, output]
                    default: input
                description: "Which metadata collection to page. Omitted or empty reads 'input'; any other value is rejected with 400."
              - in: query
                name: pageSize
                required: false
                schema:
                    type: integer
                    minimum: 1
                    maximum: 500
                    default: 100
                description: "Rows requested per page. A value above the maximum is served at the maximum; a value below 1 is rejected with 400."
              - in: query
                name: startingToken
                required: false
                allowEmptyValue: true
                schema:
                    type: string
                    maxLength: 4096
                description: "Continuation token from a previous page's NextToken. A token that cannot be used against this execution is rejected with 400 rather than restarting at the first page."
              - in: query
                name: NextToken
                required: false
                allowEmptyValue: true
                schema:
                    type: string
                    maxLength: 4096
                description: "Alias of startingToken, so a response's NextToken can be sent back under the name it was returned as. startingToken takes precedence when both are sent."
              - in: query
                name: pipelineId
                required: false
                schema:
                    type: string
                    pattern: ^[-_a-zA-Z0-9]{3,63}$
                description: "Narrow the page to the rows of the steps running this pipeline. A value outside the identifier pattern is rejected with 400 rather than returning an empty page. A token issued with this filter is only valid alongside the same filter."
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        $ref: '#/components/schemas/executionDetailMetadataPage'
                "400":
                    description: Invalid or missing executionId, an unknown collection, an invalid pipelineId or pageSize, or a continuation token that cannot be used.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized (API, workflow, one of the input-file assets, a metadata-source asset, or a captured database).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Execution not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
    /workflows/executions/{executionId}/logs:
        get:
            summary: "Get execution logs (truncated stored text, or full live search)."
            description: "mode=truncated (default) returns the stored execution log and error, or a stored per-pipeline log when pipelineExecutionId is given. Because the stored log is captured as the run completes, before Amazon CloudWatch Logs finishes ingesting the run's events, it is frequently empty even for a succeeded run; in that case truncated mode transparently falls back to a live CloudWatch Logs search for the same scope, and for the whole execution then to the Step Functions execution history when CloudWatch is also empty. logsSource reports the origin: 'stored', 'live', or 'sfnHistory'. mode=full always runs a live CloudWatch Logs search scoped to the execution within the shared workflow log group; supplying pipelineExecutionId restricts the search strictly to that single pipeline execution. In full mode the whole-execution response also includes sfnHistoryEvents (the Step Functions state-transition timeline), and a per-pipeline response includes subProcessEvents, which merges three sources: the step invocation log (the log of the resource the state machine invoked for that step — for a Lambda step, that function's own log group; derived from the recorded execution type and resource, so the pipeline does not register it, and absent for SQS, EventBridge, and DeadlineCloud which have no derivable invocation log), any logs the pipeline registered for itself, and, for a step running its own Step Functions sub-execution, that sub-execution's history and resolved log group. A warnings array is present only when a log could not be read (a missing permission, or a registration list beyond the per-request cap); each entry names the log, and a warning never fails the request. All returned log text passes through credential redaction. Requires GET on the execution's workflow, GET on every input-file asset tied to the execution, GET on every asset named as a metadata source, and GET on every database in metadataSourceDatabases - every captured database must be permitted, so the databases reported are exactly those access to this view required."
            parameters:
              - in: path
                name: executionId
                required: true
                schema:
                    $ref: '#/components/schemas/execution_id_regex'
                description: Identifier of the execution.
              - in: query
                name: mode
                required: false
                schema:
                    type: string
                    enum: [truncated, full]
                    default: truncated
                description: Log retrieval mode.
              - in: query
                name: pipelineExecutionId
                required: false
                schema:
                    type: string
                description: Narrow the logs to a single pipeline execution of this execution.
              - in: query
                name: filterPattern
                required: false
                schema:
                    type: string
                description: "(full mode) Additional CloudWatch Logs filter pattern, AND-ed with the execution/pipeline scope."
              - in: query
                name: startTime
                required: false
                schema:
                    type: integer
                description: "(full mode) Start of the time range, epoch milliseconds. A non-numeric value is rejected with 400."
              - in: query
                name: endTime
                required: false
                schema:
                    type: integer
                description: "(full mode) End of the time range, epoch milliseconds. A non-numeric value is rejected with 400."
              - in: query
                name: limit
                required: false
                schema:
                    type: integer
                    maximum: 1000
                    default: 100
                description: "(full mode) Maximum number of events to return. A value above the maximum is served at the maximum; a non-numeric value is rejected with 400."
              - in: query
                name: nextToken
                required: false
                schema:
                    type: string
                description: "(full mode) Pagination token from a previous response."
            responses:
                "200":
                    description: OK
                "400":
                    description: Invalid or missing executionId, an invalid mode, or a non-numeric limit, startTime, or endTime.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized (API, workflow, or one of the input-file assets).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Execution (or specified pipeline execution) not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
    /workflows/executions/{executionId}/rerun:
        post:
            summary: "Re-run an execution."
            description: >-
                Reconstructs the execute request from the stored execution records and launches a new
                execution (new executionId). The caller must be able to view the original execution and
                must also hold API access to the execute route of the original's workflow, since a
                re-run launches a run; the re-launch then re-validates the caller's permissions against
                every referenced asset, workflow, and pipeline. Optionally reuses or supplies an
                executionGroupId.


                The re-launch runs the same request the original did, so every rejection the execute
                route can raise reaches the caller here with the execute route's own status code and
                message — including an input file that no longer exists, a workflow since archived or
                disabled, and a template whose tags no longer resolve.
            parameters:
              - in: path
                name: executionId
                required: true
                schema:
                    $ref: '#/components/schemas/execution_id_regex'
                description: Identifier of the execution to re-run.
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                executionGroupId:
                                    type: string
                                    maxLength: 64
                                    description: "Optional group id for the new execution. Must be a valid identifier. Omit it to launch the re-run outside any group; send the original's group id to keep the two together."
            responses:
                "200":
                    description: New execution started.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        $ref: '#/components/schemas/executeWorkflowResponse'
                "400":
                    description: An invalid executionGroupId or request body, the reconstructed execution failing the execute route's validation, or a deployment in which re-run is not available.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized (API on this route or on the workflow's execute route, or the caller cannot view the original execution).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Execution not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
    /workflows/executions/{executionId}/permanent:
        delete:
            summary: "Permanently delete an execution's records (admin)."
            description: >-
                Removes only the Amazon DynamoDB rows across all execution sub-tables — the main row,
                the workflow inputs and configuration, and, per pipeline step, its record plus every
                input, output, log, and configuration sub-row. The AWS Step Functions execution history
                and any files the run wrote are left untouched. Guarded: the execution must not be in
                progress (abort it first), and a non-terminal row is confirmed against Step Functions
                before the delete proceeds. Requires confirmDelete=true in the body. Admin-only
                (granted only to admin permission templates), and additionally requires GET on the
                execution's workflow and POST on every asset the run read, the same rule an abort
                enforces.
            parameters:
              - in: path
                name: executionId
                required: true
                schema:
                    $ref: '#/components/schemas/execution_id_regex'
                description: Identifier of the execution to permanently delete.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                confirmDelete:
                                    type: boolean
                                    description: "Must be true to permanently delete the execution records. Omitting it or sending false is rejected with 400."
                            required:
                                - confirmDelete
            responses:
                "200":
                    description: Execution records permanently deleted.
                "400":
                    description: Invalid or missing executionId, invalid JSON, a missing or false confirmDelete, or an execution still in progress.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized (API, the execution's workflow, or one of the assets the run read).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Execution not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
