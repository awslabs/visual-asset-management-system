        object_name_pattern_regex:
            type: string
            pattern: ^[a-zA-Z0-9\-._ ]{1,256}$

        # Pipeline execution and system configuration
        pipelineExecutionConfig:
            type: object
            description: >-
                Execution binding for a pipeline. The nested block matching executionType supplies the
                target resource.


                The block is stored whole and is bounded at 327,680 bytes (320 KB) serialized. The
                allowance is generous because a DeadlineCloud block carries an inline OpenJD job
                template of up to 262,144 characters (256 KB); every other execution type uses a small
                fraction of it. A larger block is rejected with 400 rather than written.


                Only the keys below are accepted. An unrecognized key is rejected with 400, so a
                misspelled setting surfaces at authoring time instead of being stored and never read.
            properties:
                executionType:
                    type: string
                    description: "How the pipeline is invoked."
                    enum:
                        - Lambda
                        - SQS
                        - EventBridge
                        - DeadlineCloud
                waitForCallback:
                    type: string
                    description: "'Enabled' to have Step Functions wait for a task token callback; 'Disabled' otherwise. Mandatory 'Enabled' for DeadlineCloud."
                    enum:
                        - Enabled
                        - Disabled
                    default: Disabled
                taskTimeout:
                    type: string
                    description: "Timeout in seconds (string) for a callback (max 604800 = 1 week). Applies when waitForCallback is Enabled."
                taskHeartbeatTimeout:
                    type: string
                    description: "Heartbeat timeout in seconds (string). Must be smaller than taskTimeout."
                lambda:
                    type: object
                    description: "Target for Lambda execution type."
                    properties:
                        resourceId:
                            type: string
                            description: >-
                                Lambda function name or ARN, and the invoke target baked into every
                                state machine that runs this pipeline.


                                On create, omitting it asks VAMS to provision a function for the
                                pipeline, seeded from the sample pipeline package; the created
                                function's name is returned in the response. A deployment that cannot
                                auto-create one rejects the request with 400, so a pipeline is never
                                stored pointing at an empty target. Naming an existing function skips
                                provisioning.


                                On update, omitting it keeps the function the pipeline already runs, so
                                a partial executionConfig edit does not drop the invoke target the
                                deployed state machines were built against. A pipeline switched to the
                                Lambda type from another type has no function to keep, so one is
                                provisioned under the same rules as create.
                sqs:
                    type: object
                    description: "Target for SQS execution type."
                    properties:
                        queueUrl:
                            type: string
                            description: "Amazon SQS queue URL. Required for this execution type — an absent value would emit a state machine with an empty target, so it is rejected with 400 at save."
                eventBridge:
                    type: object
                    description: "Target for EventBridge execution type."
                    properties:
                        busArn:
                            type: string
                            description: "Amazon EventBridge bus ARN. Omit it to publish to the account's default event bus."
                        source:
                            type: string
                            description: "Event source string."
                        detailType:
                            type: string
                            description: "Event detail-type string."
                deadlineCloud:
                    type: object
                    description: "Target for DeadlineCloud execution type. farmId and queueId are required, waitForCallback must be 'Enabled', and the inline job template is limited to 262,144 characters (256 KB)."
            required:
                - executionType
        pipelineAssetScope:
            type: object
            description: >-
                Controls which asset selections a pipeline accepts as input. The four *Allowed /
                singleAssetOnly keys are the canonical vocabulary; "wholeAsset" is the shorthand the
                CDK pipeline registration schemas emit and is also accepted.
            properties:
                crossAssetAllowed:
                    type: boolean
                singleAssetOnly:
                    type: boolean
                wholeAssetAllowed:
                    type: boolean
                folderAllowed:
                    type: boolean
                wholeAsset:
                    type: boolean
                    description: "Registration-schema shorthand for wholeAssetAllowed."
        pipelineMetadataInputs:
            type: object
            description: >-
                Controls which metadata is supplied to the pipeline as input. Four independent
                booleans, each gathered from the execution's own entities and written into the
                metadata file the pipeline reads. A workflow carries the same block as the outer
                gate: a type reaches a pipeline only when the workflow gate and the pipeline both
                have it on.


                The entities an execution gathers from follow from its selection: every input file's
                asset, every asset named purely as a metadata source, and every distinct database of
                those assets - or, for an execution with no input files, the single database named in
                metadataSourceDatabaseId. Naming metadata sources is always optional and is never
                enforced; a pipeline that requires the metadata performs its own check and fails its
                own step.


                Metadata is bounded PER ENTITY: each database, each asset, each file's metadata, and
                each file's attributes carries at most 1000 entries and 300 KB, measured on its own.
                An execution over 3 databases, 5 assets, and 10 files therefore captures up to 1000
                entries for each of the 3 databases, each of the 5 assets, and each of the 10 files.
                Entries are retained in key order so a bounded entity yields the same subset on every
                run, and the execute response returns a warning naming any bounded entity - a capture
                is never silently short. An execution reads at most 1000 input files and 1000
                metadata-source assets.


                One execution's metadata is additionally bounded IN TOTAL at 128 MB across every
                entity together, plus the involved assets' own assetData - the per-entity bounds limit
                each row but not how many rows a run has. The bound clears a heavy real workload: a
                production asset carries thousands of files with hundreds of metadata entries each,
                and 128 MB covers a run selecting the full 1000-file input allowance at several
                hundred entries per file, so it engages only on a pathological run. When it does, whole
                entity rows are emptied narrowest-first - each file's attributes, then each file's
                metadata, then the assets' '/' rows, then the databases' - and never partially kept: a
                half-populated metadata map reads as complete to a pipeline, whereas an emptied row
                writes no metadata row and reads as an entity that holds no metadata, so pipelines need
                no special handling. The walk continues past a row that does not fit, and the execute
                response returns one warning naming up to 5 emptied entities with a count of the rest.
            properties:
                assetMetadata:
                    type: boolean
                    description: "Each involved asset's own metadata."
                fileMetadata:
                    type: boolean
                    description: "Each input file's metadata. Inert for inputFileArity 'none', which has no input file to describe."
                fileAttributes:
                    type: boolean
                    description: "Each input file's attributes. Inert for inputFileArity 'none', which has no input file to describe."
                databaseMetadata:
                    type: boolean
                    default: true
                    description: >-
                        Each involved database's own metadata. Gathered at every arity, since a
                        database is an entity rather than a file. READ ONLY - database metadata is
                        supplied to a pipeline as input and is never a metadata output target;
                        pipeline metadata write-back targets assets and files only. Defaults to true
                        for a configuration that omits the key.
        pipelineInputFileFilters:
            type: object
            description: >-
                Filters applied to pipeline input selection. Each allow/exclude entry matches by
                extension ("*.glb", with ".glb" also accepted as shorthand), exact relative path,
                file name, or wildcard ("*.previewFile.*", "/models/*"). Matching is case-insensitive.
                A non-empty allow restricts inputs to matching files; exclude removes matches and takes
                precedence over allow.


                Both lists are optional. An omitted, empty, or match-everything allow list places NO
                restriction at that level and defers to the next level of the chain
                (workflow -> pipeline -> the chosen template's overrides); an omitted or empty exclude
                list excludes nothing. A filter therefore only ever narrows eligibility, never grants it.
                The same rules apply to a workflow trigger's filters.
            properties:
                allow:
                    type: array
                    items:
                        type: string
                    description: >-
                        Patterns eligible as inputs (e.g. ["*.glb", "*.obj"]). Omitted, empty, or a
                        match-everything pattern ("*", "**", "*.*", "/*", "/**") means every file is
                        eligible at this level, deferring the decision to the next level down.
                exclude:
                    type: array
                    items:
                        type: string
                    description: >-
                        Patterns removed from the input set, applied AFTER allow so an exclusion always
                        wins. A match-everything pattern ("*", "**", "*.*", "/*", "/**") is REJECTED on
                        save at every level (pipeline, template overrides, workflow, trigger): it would
                        remove every file and leave the pipeline or workflow unable to run. Omit the list
                        or leave it empty to exclude nothing.
        pipelineSystemConfig:
            type: object
            description: >-
                Input handling and templating defaults for a pipeline.


                The block is stored whole and is snapshotted again per pipeline step on each
                execution's config record, so it is bounded at 65,536 bytes (64 KB) serialized —
                roughly a hundred times the largest block the built-in pipelines declare. A larger
                block is rejected with 400 at parse time rather than written.


                A key outside the systemConfig vocabulary is rejected with 400. The vocabulary is one
                set shared with workflowSystemConfig, so the keys below are the ones a pipeline reads
                and the workflow-only keys are tolerated on a pipeline without effect. The block is
                stored wholesale and every reader resolves a named key, so rejecting an unknown key is
                what turns a misspelled setting into an error instead of a setting that does nothing.
            properties:
                inputFileArity:
                    type: string
                    description: "Number of input files the pipeline consumes."
                    enum:
                        - none
                        - one
                        - multi
                assetScope:
                    $ref: "#/components/schemas/pipelineAssetScope"
                metadataInputs:
                    $ref: "#/components/schemas/pipelineMetadataInputs"
                requireTemplate:
                    type: boolean
                    description: "When true, an execution must reference a template."
                allowCustomTemplateOverride:
                    type: boolean
                    description: "When true, executions may override the template config inline."
                auxPreviewPipelineSuffix:
                    type: string
                    description: "Suffix used to associate an auxiliary preview pipeline."
                inputFileFilters:
                    $ref: "#/components/schemas/pipelineInputFileFilters"
        pipelineV2:
            type: object
            description: "A database-scoped pipeline definition, including its templates and execution/system configuration."
            properties:
                databaseId:
                    $ref: "#/components/schemas/id_regex"
                pipelineId:
                    $ref: "#/components/schemas/id_regex"
                pipelineName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                category:
                    type: string
                    description: "Optional grouping label for the pipeline."
                description:
                    type: string
                executionConfig:
                    $ref: "#/components/schemas/pipelineExecutionConfig"
                systemConfig:
                    $ref: "#/components/schemas/pipelineSystemConfig"
                enabled:
                    type: boolean
                    description: "Whether the pipeline is enabled."
                    default: true
                archived:
                    type: boolean
                    description: "Whether the pipeline is archived (soft-deleted). Archived pipelines are hidden by default."
                    default: false
                dateCreated:
                    type: string
                    description: "ISO-8601 creation timestamp."
                dateModified:
                    type: string
                    description: "ISO-8601 last-modified timestamp."
                createdBy:
                    type: string
                    description: "User that created the pipeline."
                modifiedBy:
                    type: string
                    description: "User that last modified the pipeline."
                schemaVersion:
                    type: integer
                    description: "Storage schema version of the pipeline record."
                    default: 1
                templateCount:
                    type: integer
                    description: "Count of saved templates for this pipeline. Present on both the list and details responses."
                    nullable: true
                templates:
                    type: array
                    description: "Lightweight descriptors of the templates that belong to this pipeline. Present on the details response, capped at the first 10 — templateCount reports the true total, and the template list endpoint pages the full set."
                    items:
                        $ref: "#/components/schemas/pipelineTemplateDescriptor"
            required:
                - databaseId
                - pipelineId
                - pipelineName
                - executionConfig
        createPipelineRequest:
            type: object
            description: "Request body for creating a pipeline. The pipeline is scoped to the databaseId path parameter; databaseId is also required in the body and takes the same value."
            properties:
                databaseId:
                    allOf:
                        - $ref: "#/components/schemas/id_regex"
                    description: "Database the pipeline belongs to. Matches the databaseId path parameter. GLOBAL for a global pipeline."
                pipelineId:
                    allOf:
                        - $ref: "#/components/schemas/id_regex"
                    nullable: true
                    description: "Pipeline identifier, unique across all databases including GLOBAL. Omit the field or send null to have a GUID generated; an empty string is rejected."
                pipelineName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                category:
                    type: string
                description:
                    type: string
                executionConfig:
                    $ref: "#/components/schemas/pipelineExecutionConfig"
                systemConfig:
                    $ref: "#/components/schemas/pipelineSystemConfig"
                enabled:
                    type: boolean
                    default: true
            required:
                - databaseId
                - pipelineName
                - executionConfig
        updatePipelineRequest:
            type: object
            description: "Request body for updating a pipeline. Supply any subset of the mutable fields; set enabled to toggle enable/disable."
            properties:
                pipelineName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                category:
                    type: string
                description:
                    type: string
                executionConfig:
                    $ref: "#/components/schemas/pipelineExecutionConfig"
                systemConfig:
                    $ref: "#/components/schemas/pipelineSystemConfig"
                enabled:
                    type: boolean
        pipelineTemplateDescriptor:
            type: object
            description: "Lightweight template descriptor returned inline with a pipeline."
            properties:
                templateId:
                    $ref: "#/components/schemas/id_regex"
                templateName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                configFormat:
                    $ref: "#/components/schemas/pipelineTemplateConfigFormat"
                allowCustomEdit:
                    type: boolean
                    description: "Whether the template config may be edited inline at execution time."
                    default: false
        pipelineTemplateConfigFormat:
            type: string
            description: "Format of the template config body."
            enum:
                - json
                - yaml
                - openjd
                - xml
                - raw
            default: json
        pipelineTemplateTagField:
            type: object
            description: "A single tag definition in a template's tag schema."
            properties:
                tagKey:
                    type: string
                    description: "Tag key. Reserved system tag keys and the metadata_ prefix are not allowed."
                type:
                    type: string
                    enum:
                        - string
                        - integer
                        - number
                        - boolean
                        - string-list
                        - enum
                required:
                    type: boolean
                    default: false
                default:
                    description: "Default value for the tag. Type matches the field type."
                label:
                    type: string
                    description: "Human-readable label shown in forms."
                description:
                    type: string
                enumValues:
                    type: array
                    description: "Allowed values (required when type is enum)."
                    items:
                        type: string
            required:
                - tagKey
                - type
        pipelineTagSchema:
            type: object
            description: "A template's tag schema."
            properties:
                fields:
                    type: array
                    items:
                        $ref: "#/components/schemas/pipelineTemplateTagField"
            required:
                - fields
        pipelineTagSchemaResponse:
            type: object
            description: "A template's tag schema as returned by the API: the parsed field list plus the owning template's identifiers and timestamps."
            properties:
                pipelineDatabaseId:
                    $ref: "#/components/schemas/id_regex"
                pipelineId:
                    $ref: "#/components/schemas/id_regex"
                templateId:
                    $ref: "#/components/schemas/id_regex"
                tagSchemaId:
                    type: string
                    description: "Identifier of the stored tag-schema record."
                fields:
                    type: array
                    items:
                        $ref: "#/components/schemas/pipelineTemplateTagField"
                dateCreated:
                    type: string
                    description: "ISO-8601 creation timestamp."
                dateModified:
                    type: string
                    description: "ISO-8601 last-modified timestamp."
            required:
                - pipelineDatabaseId
                - pipelineId
                - templateId
                - fields
        pipelineTemplateOverrides:
            type: object
            description: >
                Per-template overrides of the owning pipeline's systemConfig. May contain only the
                four keys below (any other key is rejected at save); each is optional and, when
                omitted, inherits the pipeline's value. Validated at save time. This does not edit the
                config body — it changes how an execution's inputs are accepted/validated and what
                metadata is provided when this template is chosen.
            properties:
                inputFileArity:
                    type: string
                    enum:
                        - none
                        - one
                        - multi
                metadataInputs:
                    $ref: "#/components/schemas/pipelineMetadataInputs"
                assetScope:
                    $ref: "#/components/schemas/pipelineAssetScope"
                inputFileFilters:
                    $ref: "#/components/schemas/pipelineInputFileFilters"
        pipelineTemplate:
            type: object
            description: "A pipeline template. configBody and webFormJson are returned inline; large bodies are transparently offloaded to Amazon S3 and rehydrated on read."
            properties:
                pipelineDatabaseId:
                    allOf:
                        - $ref: "#/components/schemas/id_regex"
                    description: "Database that owns the pipeline this template belongs to."
                pipelineId:
                    $ref: "#/components/schemas/id_regex"
                templateId:
                    $ref: "#/components/schemas/id_regex"
                templateName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                description:
                    type: string
                configFormat:
                    $ref: "#/components/schemas/pipelineTemplateConfigFormat"
                configBody:
                    type: string
                    description: "The template text. May contain {{tagName}} placeholders resolved from tags at execution time."
                webFormJson:
                    type: string
                    description: "Opaque web form markup used to render the template's input form."
                allowCustomEdit:
                    type: boolean
                    description: "Whether the template config may be edited inline at execution time."
                isDefault:
                    type: boolean
                    description: "Whether this template is the pipeline's default (pre-selected on the execute form and auto-selected when a require-template pipeline runs without a templateId). At most one template per pipeline is the default."
                inputInstructions:
                    type: string
                    description: "Guidance shown to the user when supplying template inputs."
                overrides:
                    $ref: "#/components/schemas/pipelineTemplateOverrides"
                tagSchema:
                    type: array
                    nullable: true
                    description: "The template's tag schema fields. Null when the template has no tag schema, and null in the templates list view, which does not read the schema."
                    items:
                        $ref: "#/components/schemas/pipelineTemplateTagField"
                dateCreated:
                    type: string
                    description: "ISO-8601 creation timestamp."
                dateModified:
                    type: string
                    description: "ISO-8601 last-modified timestamp."
                createdBy:
                    type: string
                    description: "User that created the template."
                modifiedBy:
                    type: string
                    description: "User that last modified the template."
                schemaVersion:
                    type: integer
                    description: "Storage schema version of the template record."
                    default: 1
            required:
                - pipelineDatabaseId
                - pipelineId
                - templateId
                - templateName
        pipelineTemplateListItem:
            allOf:
                - $ref: "#/components/schemas/pipelineTemplate"
            description: >-
                One template as returned by the templates list. Carries every field of a template,
                with two values the list view does not read: configBody and webFormJson are empty
                strings for a template whose bodies VAMS offloaded to Amazon S3, and tagSchema is
                null. Fetch the template by id to obtain the bodies and the tag schema.
        createPipelineTemplateRequest:
            type: object
            description: "Request body for creating a pipeline template. Send configBody/webFormJson inline; the service offloads large bodies to Amazon S3. The template is scoped to the databaseId and pipelineId path parameters."
            properties:
                templateId:
                    allOf:
                        - $ref: "#/components/schemas/id_regex"
                    nullable: true
                    description: "Template identifier. Omit the field or send null to have a GUID generated; an empty string is rejected."
                templateName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                description:
                    type: string
                configFormat:
                    $ref: "#/components/schemas/pipelineTemplateConfigFormat"
                configBody:
                    type: string
                    description: "The template text. May contain {{tagName}} placeholders. When configFormat is 'json', the body must be valid JSON around those placeholders: a placeholder for a text value sits inside the JSON string it fills, while one for a JSON object, array, or number (the input-file collection and metadata-content tags) is the whole value and takes no quotes."
                webFormJson:
                    type: string
                    description: "Opaque web form markup."
                allowCustomEdit:
                    type: boolean
                isDefault:
                    type: boolean
                    description: "Mark this template as the pipeline's default. Setting it clears the flag on any other template of the same pipeline."
                inputInstructions:
                    type: string
                overrides:
                    $ref: "#/components/schemas/pipelineTemplateOverrides"
                tagSchema:
                    type: array
                    items:
                        $ref: "#/components/schemas/pipelineTemplateTagField"
            required:
                - templateName
        updatePipelineTemplateRequest:
            type: object
            description: "Request body for updating a pipeline template. Supply any subset of the mutable fields."
            properties:
                templateName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                description:
                    type: string
                configFormat:
                    $ref: "#/components/schemas/pipelineTemplateConfigFormat"
                configBody:
                    type: string
                    description: "The template text. May contain {{tagName}} placeholders. When the effective configFormat is 'json', the body must be valid JSON around those placeholders (see createPipelineTemplateRequest.configBody)."
                webFormJson:
                    type: string
                allowCustomEdit:
                    type: boolean
                isDefault:
                    type: boolean
                    description: "Mark this template as the pipeline's default. Setting it clears the flag on any other template of the same pipeline."
                inputInstructions:
                    type: string
                overrides:
                    $ref: "#/components/schemas/pipelineTemplateOverrides"
                tagSchema:
                    type: array
                    items:
                        $ref: "#/components/schemas/pipelineTemplateTagField"
        specifiedPipelineRef:
            type: object
            description: "Reference to a pipeline in a workflow's ordered pipeline list."
            properties:
                pipelineId:
                    $ref: "#/components/schemas/id_regex"
                pipelineDatabaseId:
                    $ref: "#/components/schemas/id_regex"
                    description: "Database that owns the referenced pipeline. Defaults to the workflow's database when omitted."
                jobName:
                    type: string
                    description: "Optional label for this pipeline step. Names the step in the workflow's state machine and becomes the {jobName} segment of the step's output paths (pipelines/{pipelineName}/{jobName}/output/{executionId}/files/). Empty or omitted falls back to the pipelineId, keeping each step's outputs in a distinct folder. 3-63 characters of letters, numbers, hyphens and underscores: a FIXED label, not a template - {{tag}} placeholders are NOT substituted here and are rejected, because the name is baked into the state machine at deploy time rather than resolved per run. Use the workflow's defaultOutputFileBaseExecutionPathExtension (or an execution's outputFileBaseExecutionPathExtension) to vary the output path per run."
            required:
                - pipelineId
        workflowOutputTarget:
            type: object
            description: "Where a workflow writes its output."
            properties:
                locationType:
                    type: string
                    description: >
                        'asset' (default) writes asset files and metadata to a VAMS asset. 'none' is
                        results-only: the workflow writes no asset files or metadata and records only
                        results text and logs against the execution. A results-only ('none') workflow
                        may still take input files (inputFileArity none/one/multi) and its executions
                        omit outputAssetId/outputDatabaseId. When locationType is 'asset' and
                        inputFileArity is 'none', allowOverride must be true so an output asset can be
                        chosen at execution time.
                    enum:
                        - asset
                        - none
                allowOverride:
                    type: boolean
                    description: >
                        Gates redirecting the output when an execution resolves to a single input asset:
                        when true the execute request may redirect via outputAssetId/outputDatabaseId,
                        when false the output is locked to that asset and an execute request naming a
                        different target is rejected rather than relocked (naming the input asset itself
                        is accepted as a no-op, so a re-run can replay its recorded target). When inputs
                        resolve to zero or multiple assets an explicit output target is honored
                        regardless of this flag.
        workflowSystemConfig:
            type: object
            description: >-
                Input handling, asset-scope gating, and output defaults for a workflow.


                The block is bounded at 65,536 bytes (64 KB) serialized, and a key outside the
                systemConfig vocabulary is rejected with 400. A workflow and a pipeline systemConfig
                are validated against the same key set and the same bound: the keys below are the ones
                a workflow reads, and the pipeline-only keys are tolerated on a workflow without
                effect.
            properties:
                inputFileArity:
                    type: string
                    description: "Number of input files the workflow consumes."
                    enum:
                        - none
                        - one
                        - multi
                assetScope:
                    $ref: "#/components/schemas/pipelineAssetScope"
                metadataInputs:
                    $ref: "#/components/schemas/pipelineMetadataInputs"
                inputFileFilters:
                    $ref: "#/components/schemas/pipelineInputFileFilters"
                concurrencyRestriction:
                    type: string
                    description: "How concurrent executions of the workflow are limited."
                    enum:
                        - none
                        - perAsset
                        - perInputFile
                outputTarget:
                    $ref: "#/components/schemas/workflowOutputTarget"
                allowWorkflowTriggerChaining:
                    type: boolean
                    default: false
                    description: "Whether a file written by ANOTHER workflow's execution may fire this workflow's triggers, for example generating a preview or metadata from a conversion pipeline's output. A workflow never fires on output it wrote itself, whatever this is set to, so a workflow cannot re-trigger itself in a loop. A chained file must still match the trigger's input-file filters. Defaults to false."
                defaultOutputFileBaseExecutionPathExtension:
                    type: string
                    maxLength: 1024
                    description: "The output base path extension an execution uses when its request supplies none. Stored UNRESOLVED, so {{tag}} placeholders are substituted per run - '/{{jobName}}/' therefore gives every execution its own output folder from one stored value. An execute request that omits outputFileBaseExecutionPathExtension inherits this; one that sends an empty string or '/' deliberately writes at the asset root instead. Same shape rules as the per-run value: no '..' and no backslashes, with the trailing '/' deciding folder-versus-filename placement. Empty means no default."
        workflowV2:
            type: object
            description: "A database-scoped workflow definition, including its ordered pipelines, triggers, and system configuration. GLOBAL workflows reference only GLOBAL pipelines; database workflows reference GLOBAL or same-database pipelines."
            properties:
                databaseId:
                    $ref: "#/components/schemas/id_regex"
                workflowId:
                    $ref: "#/components/schemas/id_regex"
                workflowName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                category:
                    type: string
                    description: "Optional grouping label for the workflow."
                description:
                    type: string
                specifiedPipelines:
                    type: array
                    description: "Ordered list of pipelines the workflow runs."
                    items:
                        $ref: "#/components/schemas/specifiedPipelineRef"
                systemConfig:
                    $ref: "#/components/schemas/workflowSystemConfig"
                subDashboardUrl:
                    type: string
                    description: "Optional URL of an external dashboard associated with the workflow."
                enabled:
                    type: boolean
                    description: "Whether the workflow is enabled."
                    default: true
                archived:
                    type: boolean
                    description: "Whether the workflow is archived (soft-deleted). Archived workflows are hidden by default."
                    default: false
                workflow_arn:
                    type: string
                    description: "ARN of the workflow's Step Functions state machine."
                dateCreated:
                    type: string
                    description: "ISO-8601 creation timestamp."
                dateModified:
                    type: string
                    description: "ISO-8601 last-modified timestamp."
                executionCount:
                    type: integer
                    nullable: true
                    description: "Total number of executions recorded for the workflow. Present on list responses; null when not computed."
                triggerCount:
                    type: integer
                    nullable: true
                    description: "How many triggers the workflow has. Present on list responses; null when the triggers could not be read (best-effort, so such a workflow is never dropped from a filtered result)."
                triggersEnabledCount:
                    type: integer
                    nullable: true
                    description: "How many of the workflow's triggers are enabled. Differs from triggerCount when a trigger exists but is switched off — the state behind a workflow that looks configured yet never fires. Present on list responses; null when not computed."
                aggregateWorkflowPipelineInputFileFilters:
                    type: object
                    nullable: true
                    description: >-
                        The file restriction this workflow effectively imposes, computed server-side.
                        When the workflow's own allow list names specific types, that list is returned
                        (source "workflow"); when it is open, the referenced pipelines' allow lists are
                        combined instead (source "pipelines"). Exclude lists are combined across the
                        workflow and every pipeline.


                        FOR DISPLAY ONLY. includesTemplateOverrides is always false: a template is
                        chosen per execution, so its overrides cannot be folded in here. Resolve the
                        full chain (workflow -> pipeline -> chosen template) when validating a concrete
                        file selection rather than testing against this value.
                    properties:
                        allow:
                            type: array
                            items:
                                type: string
                            description: "Effective allow patterns; empty means every file type is accepted."
                        exclude:
                            type: array
                            items:
                                type: string
                            description: "Effective exclude patterns; empty means nothing is excluded."
                        source:
                            type: string
                            enum: ["workflow", "pipelines"]
                            description: "Which level the allow list came from."
                        includesTemplateOverrides:
                            type: boolean
                            description: "Always false — template overrides are not represented."
                aggregateWorkflowPipelineMetadataInputs:
                    type: object
                    nullable: true
                    description: >-
                        The metadata inputs the workflow's steps actually receive. A type is delivered
                        only when the workflow gate enables it AND some pipeline asks for it, so a type
                        the workflow gates off reads false however many pipelines want it.
                        gatedOffByWorkflow names the types a pipeline asked for but the workflow
                        suppresses, meaning that pipeline runs without them. Carries the same
                        template-override caveat as the filter aggregate.
                    properties:
                        assetMetadata:
                            type: boolean
                        fileMetadata:
                            type: boolean
                        fileAttributes:
                            type: boolean
                        databaseMetadata:
                            type: boolean
                        gatedOffByWorkflow:
                            type: array
                            items:
                                type: string
                            description: "Metadata types a pipeline uses but the workflow does not provide."
                        includesTemplateOverrides:
                            type: boolean
                            description: "Always false — template overrides are not represented."
                triggers:
                    type: array
                    description: "The workflow's configured triggers."
                    items:
                        $ref: "#/components/schemas/workflowTrigger"
                warnings:
                    type: array
                    description: "Non-fatal workflow-to-pipeline consistency warnings surfaced on create and update (for example, a pipeline requires metadata the workflow gate has disabled, or a multi-file workflow references a single-file pipeline)."
                    items:
                        type: string
            required:
                - databaseId
                - workflowId
                - workflowName
                - specifiedPipelines
        createWorkflowRequest:
            type: object
            description: "Request body for creating a workflow. The workflow is scoped to the databaseId path parameter; databaseId is also required in the body and takes the same value."
            properties:
                databaseId:
                    allOf:
                        - $ref: "#/components/schemas/id_regex"
                    description: "Database the workflow belongs to. Matches the databaseId path parameter. GLOBAL for a global workflow."
                workflowId:
                    allOf:
                        - $ref: "#/components/schemas/id_regex"
                    nullable: true
                    description: "Workflow identifier, unique across all databases including GLOBAL. Omit the field or send null to have a GUID generated; an empty string is rejected."
                workflowName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                category:
                    type: string
                description:
                    type: string
                specifiedPipelines:
                    type: array
                    description: "Ordered list of pipelines the workflow runs. Must contain at least one pipeline."
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/specifiedPipelineRef"
                systemConfig:
                    $ref: "#/components/schemas/workflowSystemConfig"
                subDashboardUrl:
                    type: string
                enabled:
                    type: boolean
                    default: true
            required:
                - databaseId
                - workflowName
                - specifiedPipelines
        updateWorkflowRequest:
            type: object
            description: "Request body for updating a workflow. Supply any subset of the mutable fields; set enabled to toggle enable/disable."
            properties:
                workflowName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                category:
                    type: string
                description:
                    type: string
                specifiedPipelines:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/specifiedPipelineRef"
                systemConfig:
                    $ref: "#/components/schemas/workflowSystemConfig"
                subDashboardUrl:
                    type: string
                enabled:
                    type: boolean
        workflowTrigger:
            type: object
            description: "A workflow trigger. The fileUpload trigger auto-launches the workflow when matching files are uploaded. A workflow may carry several triggers of one type, each with its own input-file filters and default templates; an upload launches the workflow once per matching trigger."
            properties:
                workflowDatabaseId:
                    $ref: "#/components/schemas/id_regex"
                workflowId:
                    $ref: "#/components/schemas/id_regex"
                triggerType:
                    type: string
                    description: "The trigger's key, and the value to send on the trigger path to address it: the bare type for a workflow's first trigger of that type, or '<type>#<triggerId>' for an additional one."
                    example: "fileUpload#nightly"
                triggerBaseType:
                    type: string
                    description: "The plain trigger type, for grouping and display, without any id suffix."
                    enum:
                        - fileUpload
                triggerId:
                    type: string
                    description: "Distinguishes several triggers of one type. Empty for a workflow's first trigger of a type."
                triggerConfig:
                    type: object
                    description: "Trigger configuration. For the fileUpload trigger this carries the input-file filters and the per-pipeline default template ids."
                    properties:
                        inputFileFilters:
                            $ref: "#/components/schemas/pipelineInputFileFilters"
                        defaultTemplateIds:
                            type: object
                            description: "Maps each included pipeline to the template used when the trigger auto-launches, keyed by the composite '<pipelineDatabaseId>:<pipelineId>'."
                            additionalProperties:
                                $ref: "#/components/schemas/id_regex"
                enabled:
                    type: boolean
                    description: "Whether the trigger is enabled."
                    default: true
                dateCreated:
                    type: string
                    description: "ISO-8601 creation timestamp."
                dateModified:
                    type: string
                    description: "ISO-8601 last-modified timestamp."
        setWorkflowTriggerRequest:
            type: object
            description: "Request body for setting or replacing a workflow trigger."
            properties:
                inputFileFilters:
                    $ref: "#/components/schemas/pipelineInputFileFilters"
                defaultTemplateIds:
                    type: object
                    description: "Maps each included pipeline to the template used when the trigger auto-launches, keyed by the composite '<pipelineDatabaseId>:<pipelineId>'."
                    additionalProperties:
                        $ref: "#/components/schemas/id_regex"
                enabled:
                    type: boolean
        role:
            type: object
            properties:
                roleName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                description:
                    $ref: "#/components/schemas/string256Param"                    
            required:
                - roleName
                - description
        
        # Role API Request/Response Schemas
        createRoleRequest:
            type: object
            properties:
                roleName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                    description: "Unique role name (1-256 characters)"
                description:
                    $ref: "#/components/schemas/string256Param"
                    description: "Role description (1-256 characters)"
                source:
                    $ref: "#/components/schemas/string256Param"
                    description: "Optional source identifier (must be 'INTERNAL_SYSTEM' if provided)"
                sourceIdentifier:
                    $ref: "#/components/schemas/string256Param"
                    description: "Optional source identifier value"
                mfaRequired:
                    type: boolean
                    description: "Whether MFA is required for this role"
                    default: false
            required:
                - roleName
                - description
        
        updateRoleRequest:
            type: object
            properties:
                roleName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                    description: "Role name to update (cannot be changed)"
                description:
                    $ref: "#/components/schemas/string256Param"
                    description: "Updated role description"
                source:
                    $ref: "#/components/schemas/string256Param"
                    description: "Updated source identifier (must be 'INTERNAL_SYSTEM' if provided)"
                sourceIdentifier:
                    $ref: "#/components/schemas/string256Param"
                    description: "Updated source identifier value"
                mfaRequired:
                    type: boolean
                    description: "Updated MFA requirement flag"
                    default: false
            required:
                - roleName
                - description
        
        roleResponse:
            type: object
            properties:
                id:
                    type: string
                    description: "Unique role ID (UUID)"
                roleName:
                    type: string
                    description: "Role name"
                description:
                    type: string
                    description: "Role description"
                createdOn:
                    type: string
                    format: date-time
                    description: "Date when role was created"
                source:
                    type: string
                    description: "Source identifier"
                sourceIdentifier:
                    type: string
                    description: "Source identifier value"
                mfaRequired:
                    type: boolean
                    description: "Whether MFA is required for this role"
                    default: false
            required:
                - roleName
                - description
        
        getRolesResponse:
            type: object
            properties:
                message:
                    type: object
                    properties:
                        Items:
                            type: array
                            items:
                                $ref: "#/components/schemas/roleResponse"
                            description: "List of roles"
                        NextToken:
                            type: string
                            description: "Pagination token for retrieving next page"
                    required:
                        - Items
            required:
                - message
        
        roleOperationResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: "Whether the operation was successful"
                message:
                    type: string
                    description: "Message describing the result"
                roleName:
                    type: string
                    description: "Role name that was operated on"
                operation:
                    type: string
                    enum: [create, update, delete]
                    description: "Operation that was performed"
                timestamp:
                    type: string
                    format: date-time
                    description: "Timestamp of the operation"
            required:
                - success
                - message
                - roleName
                - operation
                - timestamp
        route:
            type: object
            properties:
                routeId:
                    $ref: '#/components/schemas/id_regex'
                description:
                    $ref: "#/components/schemas/string256Param"
            required:
                - routeId
                - description
        s3_access:
            type: object
            properties:
                databaseId:
                    $ref: '#/components/schemas/id_regex'
                assetId:
                    $ref: '#/components/schemas/id_regex'
        sagemaker_notebook_name_regex:
            type: string
            pattern: ^[a-zA-Z0-9](-*[a-zA-Z0-9])*
        string256Param:
            type: string
            maxLength: 256
        subscribers:
            type: array
            items:
                $ref: "#/components/schemas/email_pattern_regex"
        subscription:
            type: object
            properties:
                entityId: 
                    $ref: "#/components/schemas/entityId"
                entityName:
                    $ref: "#/components/schemas/entityName"
                eventName:
                    $ref: "#/components/schemas/eventName"
                subscribers:
                    $ref: "#/components/schemas/subscribers"
            required:
                - entityId
                - entityName
                - eventName
                - subscribers
        tag:
            type: object
            properties: 
                tagName:
                    #example:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                description:
                    $ref: "#/components/schemas/string256Param"
                tagTypeName:
                    #example:
                    $ref: "#/components/schemas/object_name_pattern_regex"
            required:
                - tagName
                - description
                - tagTypeName
        
        # Tag API Request/Response Schemas
        createTagRequest:
            type: object
            properties:
                tagName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                    description: "Unique tag name (1-256 characters)"
                description:
                    $ref: "#/components/schemas/string256Param"
                    description: "Tag description (1-256 characters)"
                tagTypeName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                    description: "Tag type name that this tag belongs to"
                databaseId:
                    type: string
                    nullable: true
                    description: >-
                        Scope of the tag. Omit or set to 'GLOBAL' for a global tag; set a
                        database ID to scope the tag to that database. Tag names are unique
                        per database, so the same name may exist in different databases.
                        A GLOBAL tag may be created for a name a database already uses
                        (the response then carries a warnings array); a database-specific
                        tag may not take a name a GLOBAL tag already uses.
                        The referenced database must exist, and a scoped tag may reference
                        a tag type in the tag's own scope: a GLOBAL tag requires a
                        GLOBAL tag type, and a database-scoped tag requires a tag type in
                        that same database.
                        Immutable after creation.
            required:
                - tagName
                - description
                - tagTypeName

        updateTagRequest:
            type: object
            properties:
                tagName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                    description: "Tag name to update (cannot be changed)"
                description:
                    $ref: "#/components/schemas/string256Param"
                    description: "Updated tag description"
                tagTypeName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                    description: "Updated tag type name"
                databaseId:
                    type: string
                    nullable: true
                    description: >-
                        Scope of the tag (omit or 'GLOBAL' for a global tag). A tag's scope
                        is fixed at creation and cannot be changed by an update.
            required:
                - tagName
                - description
                - tagTypeName

        tagResponse:
            type: object
            properties:
                tagName:
                    type: string
                    description: "Tag name"
                description:
                    type: string
                    description: "Tag description"
                tagTypeName:
                    type: string
                    description: "Tag type name (may include [R] suffix for required tags)"
                required:
                    type: string
                    enum: ["True", "False"]
                    description: "Whether this tag is required (inherited from tag type)"
                    default: "False"
                databaseId:
                    type: string
                    nullable: true
                    description: >-
                        Scope of the tag. 'GLOBAL' (or null) indicates a global tag;
                        otherwise the ID of the database the tag is scoped to.
            required:
                - tagName
                - description
                - tagTypeName

        tagOperationResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: "Whether the operation was successful"
                message:
                    type: string
                    description: "Message describing the result"
                tagName:
                    type: string
                    description: "Tag name that was operated on"
                operation:
                    type: string
                    enum: [create, update, delete]
                    description: "Operation that was performed"
                timestamp:
                    type: string
                    format: date-time
                    description: "Timestamp of the operation"
                warnings:
                    type: array
                    nullable: true
                    items:
                        type: string
                    description: >-
                        Advisories about an operation that succeeded. Returned when a GLOBAL
                        entry is created for a name a database already uses: both entries then
                        appear on asset forms until the database-specific one is removed.
                        Absent when there is nothing to report.
            required:
                - success
                - message
                - tagName
                - operation
                - timestamp
        tagType:
            type: object
            properties: 
                tagTypeName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                description:
                    $ref: "#/components/schemas/string256Param"
            required: 
                - tagTypeName
                - description
        
        # Tag Type API Request/Response Schemas
        createTagTypeRequest:
            type: object
            properties:
                tagTypeName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                    description: "Unique tag type name (1-256 characters)"
                description:
                    $ref: "#/components/schemas/string256Param"
                    description: "Tag type description (1-256 characters)"
                required:
                    type: string
                    enum: ["True", "False"]
                    description: >-
                        Whether an asset must carry a tag of this type. Enforced only while the
                        tag type has tags: a required tag type with no tags cannot be satisfied,
                        so asset creation and asset updates skip it.
                    default: "False"
                databaseId:
                    type: string
                    nullable: true
                    description: >-
                        Scope of the tag type. Omit or set to 'GLOBAL' for a global tag
                        type; set a database ID to scope it to that database. Tag type
                        names are unique per database, so the same name may exist in
                        different databases. A GLOBAL tag type may be created for a name
                        a database already uses (the response then carries a warnings
                        array); a database-specific tag type may not take a name a GLOBAL
                        tag type already uses. The referenced database must exist.
                        Immutable after creation.
            required:
                - tagTypeName
                - description

        updateTagTypeRequest:
            type: object
            properties:
                tagTypeName:
                    $ref: "#/components/schemas/object_name_pattern_regex"
                    description: "Tag type name to update (cannot be changed)"
                description:
                    $ref: "#/components/schemas/string256Param"
                    description: "Updated tag type description"
                required:
                    type: string
                    enum: ["True", "False"]
                    description: "Updated required flag"
                    default: "False"
                databaseId:
                    type: string
                    nullable: true
                    description: >-
                        Scope of the tag type (omit or 'GLOBAL' for a global tag type). A
                        tag type's scope is fixed at creation and cannot be changed by an
                        update.
            required:
                - tagTypeName
                - description

        tagTypeResponse:
            type: object
            properties:
                tagTypeName:
                    type: string
                    description: "Tag type name"
                description:
                    type: string
                    description: "Tag type description"
                required:
                    type: string
                    enum: ["True", "False"]
                    description: >-
                        Whether an asset must carry a tag of this type. Enforced only while the
                        tag type has tags: a required tag type with no tags cannot be satisfied,
                        so asset creation and asset updates skip it.
                    default: "False"
                tags:
                    type: array
                    items:
                        type: string
                    description: "List of tag names associated with this tag type"
                    default: []
                databaseId:
                    type: string
                    nullable: true
                    description: >-
                        Scope of the tag type. 'GLOBAL' (or null) indicates a global tag
                        type; otherwise the ID of the database the tag type is scoped to.
            required:
                - tagTypeName
                - description
                - required
        
        tagTypeOperationResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: "Whether the operation was successful"
                message:
                    type: string
                    description: "Message describing the result"
                tagTypeName:
                    type: string
                    description: "Tag type name that was operated on"
                operation:
                    type: string
                    enum: [create, update, delete]
                    description: "Operation that was performed"
                timestamp:
                    type: string
                    format: date-time
                    description: "Timestamp of the operation"
                warnings:
                    type: array
                    nullable: true
                    items:
                        type: string
                    description: >-
                        Advisories about an operation that succeeded. Returned when a GLOBAL
                        entry is created for a name a database already uses: both entries then
                        appear on asset forms until the database-specific one is removed.
                        Absent when there is nothing to report.
            required:
                - success
                - message
                - tagTypeName
                - operation
                - timestamp
        userid_regex:
