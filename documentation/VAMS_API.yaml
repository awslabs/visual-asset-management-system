    /database/{databaseId}/assets/{assetId}/unarchiveAsset:
        put:
            summary: "Unarchive an asset (restore from soft delete)."
            description: "Restore a previously archived asset by moving the asset record back to the active database partition. By default the asset's files remain archived. Set unarchiveFiles to true to also restore the files that the asset archive operation archived (tracked via assetArchive provenance in the file version history); files archived individually beforehand always remain archived and can be restored with the file unarchive endpoint. Assets archived before provenance tracking have no restorable file set, so no files are restored for them. The databaseId can be provided with or without the #deleted suffix, which will be normalized automatically."
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                confirmUnarchive:
                                    type: boolean
                                    description: "Confirmation flag for unarchiving (must be true)"
                                    default: false
                                reason:
                                    type: string
                                    maxLength: 256
                                    description: "Optional reason for unarchiving the asset"
                                unarchiveFiles:
                                    type: boolean
                                    description: "Also restore the files archived by the asset archive operation. Files archived individually beforehand remain archived."
                                    default: false
                            required:
                                - confirmUnarchive
                            example:
                                confirmUnarchive: true
                                reason: "Restoring asset for active use"
                                unarchiveFiles: true
            responses:
                "200":
                    description: Asset unarchived successfully.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: "Asset {assetId} unarchived successfully"
                                    assetId:
                                        type: string
                                        example: "my-asset-id"
                                    operation:
                                        type: string
                                        example: "unarchive"
                                    timestamp:
                                        type: string
                                        format: date-time
                                        example: "2024-01-15T10:30:00.000Z"
                                required:
                                    - success
                                    - message
                                    - assetId
                                    - operation
                                    - timestamp
                "400":
                    description: Invalid parameters, asset not archived, or confirmation not provided.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "403":
                    description: Not authorized to unarchive this asset.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "404":
                    description: Asset not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
                "500":
                    description: Error processing request.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/error'
            parameters:
              - name: databaseId
                in: path
                description: "Database ID (may include #deleted suffix which will be normalized)"
                required: true
                schema:
                    $ref: '#/components/schemas/id_regex'
              - name: assetId
                in: path
                description: "Asset ID to unarchive"
                required: true
                schema:
                    $ref: '#/components/schemas/asset_id_regex'
            security:
              - DefaultCognitoAuthorizer: []
