            properties:
                comment:
                    type: string
                    description: "Updated comment for this version. Cannot be empty."
                    minLength: 1
                    maxLength: 1024
                versionAlias:
                    type: string
                    description: "Optional alias name for this version. Pass empty string to clear an existing alias."
                    maxLength: 64

        createAssetVersionRequest:
            type: object
            properties:
                useLatestFiles:
                    type: boolean
                    description: "Whether to use the latest files for this version"
                    default: true
                files:
                    type: array
                    items:
                        $ref: "#/components/schemas/assetFileVersionItemModel"
                    description: "Specific files to include in this version"
                comment:
                    type: string
                    description: "Comment for this version"
            required:
