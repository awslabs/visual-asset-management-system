[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vams-mcp"
version = "2.6.6"
description = "Model Context Protocol (MCP) server for the Visual Asset Management System (VAMS)"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "AWS Labs", email = "aws-labs@amazon.com" }]
keywords = ["aws", "vams", "mcp", "agentic", "3d", "asset", "management"]
requires-python = ">=3.12"
dependencies = [
    # Supports both the mcp 1.x FastMCP and the mcp 2.x MCPServer entry points. 1.10.0 is the
    # oldest 1.x with tool titles and structured output (outputSchema); 1.9.x cannot register
    # these tools. mcp 1.10.0 to 1.21.1 import a pydantic internal that pydantic 2.12 removed, so
    # with those releases install pydantic<2.12; 1.21.2 and later, and 2.x, work with current
    # pydantic.
    "mcp>=1.10.0,<3.0.0",
    # results.py declares the typed tool results as pydantic v2 models (this server's own venv;
    # the backend's pydantic v1 pin does not apply here).
    "pydantic>=2.11.0,<3.0.0",
    "requests>=2.25.0",
    # Remote mode verifies each request's OAuth token (RS256 signatures against the issuer's JWKS).
    # The same release the VAMS API authorizer layer pins.
    "PyJWT[crypto]==2.15.1",
    # vamscli provides the battle-tested APIClient this server reuses.
    # Install it into the same environment: `pip install -e ../VamsCLI`
    "vamscli",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
# `vams-mcp` runs the server; `vams-mcp setup-remote` writes a remote server's auth configuration.
vams-mcp = "vams_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["vams_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "temporary: pins one specific past change rather than a durable rule; list with '-m temporary' and remove at release cleanup (root CLAUDE.md Rule 13)",
]
