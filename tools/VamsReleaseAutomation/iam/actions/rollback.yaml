# IAM action manifest: rollback
# `vra rollback` (and the automatic rollback inside deploy/promote) redeploys a previous build bundle,
# so it needs exactly what deploy needs from CloudFormation and the CDK bootstrap roles. A rollback
# with --restore-checkpoint ALSO needs restore.yaml (preflighted as its own workflow).
# The rest of this file is kept in step with deploy.yaml; edit both together.
# Schema: engine/vra/data/iam-actions.schema.json
#   {workflow, schemaVersion, role, description, statements:[{sid, actions, resources, condition?, note, optional?}]}
# Placeholders rendered by `vra preflight` (engine/vra/permissions.py placeholders()):
#   ${Partition} ${Account} ${Region} ${ConfigName}
#   ${BaseStackName}  the REGION-SUFFIXED base name, "<app.baseStackName>-<region>" (as VAMS config.ts sets it)
#   ${CoreStack}      "<configName>-core-<baseStackName>-<region>" (VAMS tables, buckets, Lambdas are auto-named under it)
#   ${SsmPrefix}      "/<configName>-<baseStackName>-<region>/resourceNames"
#   A VAMS stack is "${ConfigName}-<kind>-${BaseStackName}" (kind = core | waf | waf-regional ...).
# `role` selects the env role preflight simulates (deploy -> deployRoleArn, dataCopy -> dataCopyRoleArn).
# `condition` is informational for reviewers; simulation evaluates actions and resources.
# Principal convention: statements whose sid starts with "Tools" apply to the orchestrator identity
#   (CI role / operator in the tools account). All others apply to the env deploy role
#   (iam/cloudformation/vra-deploy-role.yaml) in the env account.
# A deploy that runs a checkpoint or a data migration ALSO needs backup.yaml and migrate.yaml.
workflow: rollback
schemaVersion: 1
role: deploy
description: >-
    Redeploy a previous pre-synthesized bundle (cdk.out/<env>) into one environment through the CDK
    bootstrap roles. Same CloudFormation needs as deploy; data restore is covered by restore.yaml.
statements:
    - sid: ToolsAssumeEnvDeployRole
      actions:
          - sts:AssumeRole
          - sts:TagSession
          - sts:SetSourceIdentity
      resources:
          - arn:${Partition}:iam::${Account}:role/vra-deploy-*
      note: The orchestrator in the tools account assumes the per-env deploy role named in envs/<env>/env.yaml (deployRoleArn).

    - sid: CallerIdentity
      actions:
          - sts:GetCallerIdentity
      resources:
          - "*"
      note: Derive partition and account from the caller ARN; sts:GetCallerIdentity is not resource-scoped.

    - sid: CdkBootstrapRolesAssume
      actions:
          - sts:AssumeRole
          - sts:TagSession
          - sts:SetSourceIdentity # role chaining with a source identity (gated envs)
      resources:
          - arn:${Partition}:iam::${Account}:role/cdk-*-deploy-role-${Account}-*
          - arn:${Partition}:iam::${Account}:role/cdk-*-file-publishing-role-${Account}-*
          - arn:${Partition}:iam::${Account}:role/cdk-*-image-publishing-role-${Account}-*
          - arn:${Partition}:iam::${Account}:role/cdk-*-lookup-role-${Account}-*
      note: >-
          The CDK CLI publishes assets and drives CloudFormation by assuming the bootstrap roles. The
          region suffix is a wildcard because the CloudFront WAF stack is always deployed in us-east-1
          (commercial) even when VAMS runs elsewhere. The qualifier is a wildcard so custom qualifiers work.

    - sid: CdkBootstrapVersionRead
      actions:
          - ssm:GetParameter
      resources:
          - arn:${Partition}:ssm:*:${Account}:parameter/cdk-bootstrap/*/version
      note: The CDK CLI checks the bootstrap stack version before deploying.

    - sid: VamsStacksRead
      actions:
          - cloudformation:DescribeStacks
          - cloudformation:DescribeStackEvents
          - cloudformation:DescribeStackResource
          - cloudformation:DescribeStackResources
          - cloudformation:ListStackResources
          - cloudformation:GetTemplate
          - cloudformation:GetTemplateSummary
          - cloudformation:DescribeChangeSet
          - cloudformation:ListChangeSets
          - cloudformation:DetectStackDrift
          - cloudformation:DetectStackResourceDrift
          - cloudformation:DescribeStackResourceDrifts
      resources:
          - arn:${Partition}:cloudformation:*:${Account}:stack/${ConfigName}-*-${BaseStackName}/*
          - arn:${Partition}:cloudformation:*:${Account}:stack/${ConfigName}-*-${BaseStackName}-*/*
      note: >-
          Read stack status, outputs (ResourceNamesSSMParamPrefixOutput), events for failure
          classification, the deployed template for the diff report, and drift before deploying.
          The second pattern covers nested stacks.

    - sid: StacksList
      actions:
          - cloudformation:ListStacks
          - cloudformation:DescribeStackDriftDetectionStatus
      resources:
          - "*"
      note: >-
          cloudformation:ListStacks and DescribeStackDriftDetectionStatus are not resource-scoped (IAM accepts
          only `*`): discover the env's VAMS stacks and poll the drift detection started on them.

    - sid: VamsResourceNamesRead
      actions:
          - ssm:GetParameter
          - ssm:GetParameters
          - ssm:GetParametersByPath
      resources:
          - arn:${Partition}:ssm:${Region}:${Account}:parameter${SsmPrefix}
          - arn:${Partition}:ssm:${Region}:${Account}:parameter${SsmPrefix}/*
      note: Resolve VAMS table and bucket names for the pre-deploy checkpoint and post-deploy smoke.

    - sid: PreDeployDataStateRead
      actions:
          - dynamodb:DescribeTable
          - dynamodb:DescribeContinuousBackups
      resources:
          - arn:${Partition}:dynamodb:${Region}:${Account}:table/${CoreStack}*
      note: >-
          Confirm PITR is on before a deploy that changes data. VAMS tables are CloudFormation
          auto-named under the core stack name; the engine resolves exact names from SSM, and
          preflight simulates those exact ARNs.

    - sid: IamQuotaRead
      optional: true
      actions:
          - iam:GetAccountSummary
      resources:
          - "*"
      note: >-
          Advisory IAM quota read before the rollback redeploy (never blocks a rollback): when the account's
          Roles + the bundle's roles + headroom exceed RolesQuota, the run notes that a rollback across a
          boundary/prefix switch may fail. Not resource-scoped (`*`); returns counts only. Without it the
          check is recorded as unverified.

    - sid: CloudFrontQuotaRead
      optional: true
      feature: cloudFrontQuota
      actions:
          - cloudfront:ListCachePolicies
          - cloudfront:ListOriginRequestPolicies
          - cloudfront:ListResponseHeadersPolicies
          - cloudfront:ListDistributions
      resources:
          - "*"
      note: >-
          Advisory CloudFront quota read before the rollback redeploy (never blocks a rollback), only when the
          bundle has CloudFront resources: the List actions (type custom) count the account's custom cache, origin
          request and response headers policies and its distributions. CloudFront accepts only `*`; read-only.
          Without it the check is recorded as unverified.

    - sid: CloudFrontQuotaLimitsRead
      optional: true
      feature: cloudFrontQuota
      actions:
          - servicequotas:GetServiceQuota
      resources:
          - "*"
      note: >-
          Advisory CloudFront quota read before the rollback redeploy: GetServiceQuota reads the account's applied
          CloudFront quotas (service code cloudfront). Read-only; without a value vra uses the AWS default.

    - sid: ToolsVerifyBuildSignatures
      optional: true
      actions:
          - kms:Verify
          - kms:GetPublicKey
          - kms:DescribeKey
      resources:
          - arn:${Partition}:kms:*:*:key/*
      note: >-
          Only with build.signing in vra.yaml: deploy, promote and rollback verify the manifest and release-tag
          signatures and refuse unsigned or invalid builds. Scope the resource to the signing key ARN; never grant
          kms:Sign to a deploying identity.

    - sid: ToolsVerifyApprovalSignature
      optional: true
      actions:
          - kms:Verify
          - kms:DescribeKey
      resources:
          - arn:${Partition}:kms:*:*:key/*
      note: >-
          Only when envs/<env>/env.yaml sets approvalSigningKeyArn: every approval record of the env (also
          human:<action> records) must carry a KMS signature, which vra verifies. Scope the resource to that key ARN;
          the identity that runs gated actions never needs kms:Sign on it.

    # ---- state store (vra.yaml stateStore.type s3; iam/cloudformation/vra-state-store.yaml). The same block in
    # every manifest: each run writes its run state, takes its run lease and env lock, and appends history.
    - sid: ToolsStateStoreRuns
      actions:
          - s3:GetObject
          - s3:PutObject
      resources:
          - arn:${Partition}:s3:::vra-state-*/*/runs/*
      note: >-
          Run state (state.json, written with If-Match / If-None-Match; a 412 is "changed elsewhere"), logs, JUnit,
          reports and IT requests of the run. HeadObject is authorized as s3:GetObject.

    - sid: ToolsStateStoreHistoryRead
      actions:
          - s3:GetObject
      resources:
          - arn:${Partition}:s3:::vra-state-*/*/history/*
      note: Read env history (promotion evidence, approval use) in sequence order.

    - sid: ToolsStateStoreCreateOnly
      actions:
          - s3:PutObject
      resources:
          - arn:${Partition}:s3:::vra-state-*/*/history/*
          - arn:${Partition}:s3:::vra-state-*/*/artifacts/*
          - arn:${Partition}:s3:::vra-state-*/*/iam/*
          - arn:${Partition}:s3:::vra-state-*/*/pipeline/*
      condition:
          "Null":
              s3:if-none-match: "false"
      note: >-
          History records (history/<env>/<seq:012d>-<run>.json), build bundles, IT role packages and IT responses
          (iam/<env>/<n>/*, iam/<env>/responses/*) and pipeline plans and deploy records (pipeline/*) are
          create-only: the write must carry If-None-Match: *, so an existing record, bundle or package is never
          overwritten (the bucket policy denies the rest). Deletes are never granted.

    - sid: ToolsStateStoreClaims
      actions:
          - s3:GetObject
          - s3:PutObject
      resources:
          - arn:${Partition}:s3:::vra-state-*/*/approvals-consumed/*
      note: >-
          Approval claims (approvals-consumed/<env>/<sha256>.json): created once; rewritten only when the earlier
          claimer run stopped without using the approval.

    - sid: ToolsStateStoreRecordsRead
      actions:
          - s3:GetObject
      resources:
          - arn:${Partition}:s3:::vra-state-*/*/artifacts/*
          - arn:${Partition}:s3:::vra-state-*/*/signatures/*
          - arn:${Partition}:s3:::vra-state-*/*/checkpoints/*
          - arn:${Partition}:s3:::vra-state-*/*/sync-state.json
          - arn:${Partition}:s3:::vra-state-*/*/iam/*
          - arn:${Partition}:s3:::vra-state-*/*/pipeline/*
      note: >-
          Bundles, build signatures, checkpoint manifests, the last-seen upstream refs, IT role packages with their
          apply record (iam/<env>/*, the IAM gates of preflight, build and deploy) and pipeline plans (pipeline/*).

    - sid: ToolsStateStoreRecords
      actions:
          - s3:PutObject
      resources:
          - arn:${Partition}:s3:::vra-state-*/*/signatures/*
          - arn:${Partition}:s3:::vra-state-*/*/checkpoints/*
          - arn:${Partition}:s3:::vra-state-*/*/sync-state.json
          - arn:${Partition}:s3:::vra-state-*/*/iam/*/applied.json
      note: >-
          Build signatures and tag signer keys, checkpoint manifests, sync state, and the current IT apply record
          (iam/<env>/applied.json, replaced by `vra iam apply`; the create-only history record binds it).

    - sid: ToolsStateStoreList
      actions:
          - s3:ListBucket
      resources:
          - arn:${Partition}:s3:::vra-state-*
      note: >-
          List runs, history sequences and bundles. Not narrowed by s3:prefix: without ListBucket S3 answers a read
          of a missing key with 403 instead of 404, and create-only writes and approval claims read missing keys.

    - sid: ToolsStateStoreLock
      actions:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:DeleteItem
          - dynamodb:DescribeTable
      resources:
          - arn:${Partition}:dynamodb:*:*:table/vra-locks
      condition:
          ForAllValues:StringLike:
              dynamodb:LeadingKeys:
                  - env#*
                  - run#*
      note: >-
          Lock items env#<env>, env#watch and run#<runId> (run lease). GetItem is ConsistentRead; PutItem carries
          attribute_not_exists(lockId) OR ver = :v, DeleteItem ver = :v (vra unlock deletes unconditionally).
          UpdateItem is not used. Narrow the account at render time if the tools account is fixed.

    - sid: ToolsStateStoreKey
      actions:
          - kms:Decrypt
          - kms:GenerateDataKey
          - kms:DescribeKey
      resources:
          - arn:${Partition}:kms:*:*:key/*
      condition:
          ForAnyValue:StringEquals:
              kms:ResourceAliases: alias/vra-state
      note: The state bucket and lock table are encrypted with the vra-state CMK.
