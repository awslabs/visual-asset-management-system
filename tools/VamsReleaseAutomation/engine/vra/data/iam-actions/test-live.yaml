# IAM action manifest: test-live (vra test --suites live-cli,live-web,customer)
# See deploy.yaml for the placeholder and principal ("Tools*" sid) conventions.
workflow: test-live
schemaVersion: 1
role: deploy
description: >-
    Live suites against a deployed env: vamscli smoke, Playwright web/e2e, and the customer
    regression hooks in tests/customer.yaml. The tests authenticate to VAMS as a test user (Cognito
    InitiateAuth needs no IAM permission); AWS access is only needed to read stack outputs and the
    test-user credentials secret named in env.yaml liveTest.credentialsSecret.
statements:
    - sid: CallerIdentity
      actions:
          - sts:GetCallerIdentity
      resources:
          - "*"
      note: Derive partition and account; not resource-scoped.

    - sid: StackOutputsRead
      actions:
          - cloudformation:DescribeStacks
      resources:
          - arn:${Partition}:cloudformation:*:${Account}:stack/${ConfigName}-*-${BaseStackName}/*
      note: Resolve the API and web URLs from stack outputs when liveTest.apiUrl / webUrl are not pinned in the ledger.

    - sid: VamsResourceNamesRead
      actions:
          - ssm:GetParameter
          - ssm:GetParametersByPath
      resources:
          - arn:${Partition}:ssm:${Region}:${Account}:parameter${SsmPrefix}
          - arn:${Partition}:ssm:${Region}:${Account}:parameter${SsmPrefix}/*
          - arn:${Partition}:ssm:${Region}:${Account}:parameter/${ConfigName}-${BaseStackName}/web/deployedUrl
      note: >-
          Some smoke assertions check that resources named in SSM exist; the web URL comes from VAMS's
          web/deployedUrl parameter when liveTest.webUrl is not pinned.

    - sid: TestUserCredentials
      actions:
          - secretsmanager:GetSecretValue
          - secretsmanager:DescribeSecret
      resources:
          - arn:${Partition}:secretsmanager:${Region}:${Account}:secret:${LiveTestSecret}*
      note: >-
          The live suites log in as a dedicated non-admin test user. ${LiveTestSecret} is the env's
          liveTest.credentialsSecret (the role templates grant vra/<baseStackName>/*). The ledger stores only
          the secret name; the value is never written to logs or the run dir.

    # ---- state store (vra.yaml stateStore.type s3; iam/cloudformation/vra-state-store.yaml). The same block in
    # every manifest: each run writes its run state, takes its run lease and env lock, and appends history.
    - sid: ToolsStateStoreRuns
      actions:
          - s3:GetObject
          - s3:PutObject
      resources:
          - arn:${Partition}:s3:::vra-state-*/*/runs/*
      note: >-
          Run state (state.json, written with If-Match / If-None-Match; a 412 is "changed elsewhere"), logs, JUnit,
          reports and IT requests of the run. HeadObject is authorized as s3:GetObject.

    - sid: ToolsStateStoreHistoryRead
      actions:
          - s3:GetObject
      resources:
          - arn:${Partition}:s3:::vra-state-*/*/history/*
      note: Read env history (promotion evidence, approval use) in sequence order.

    - sid: ToolsStateStoreCreateOnly
      actions:
          - s3:PutObject
      resources:
          - arn:${Partition}:s3:::vra-state-*/*/history/*
          - arn:${Partition}:s3:::vra-state-*/*/artifacts/*
          - arn:${Partition}:s3:::vra-state-*/*/iam/*
          - arn:${Partition}:s3:::vra-state-*/*/pipeline/*
      condition:
          "Null":
              s3:if-none-match: "false"
      note: >-
          History records (history/<env>/<seq:012d>-<run>.json), build bundles, IT role packages and IT responses
          (iam/<env>/<n>/*, iam/<env>/responses/*) and pipeline plans and deploy records (pipeline/*) are
          create-only: the write must carry If-None-Match: *, so an existing record, bundle or package is never
          overwritten (the bucket policy denies the rest). Deletes are never granted.

    - sid: ToolsStateStoreClaims
      actions:
          - s3:GetObject
          - s3:PutObject
      resources:
          - arn:${Partition}:s3:::vra-state-*/*/approvals-consumed/*
      note: >-
          Approval claims (approvals-consumed/<env>/<sha256>.json): created once; rewritten only when the earlier
          claimer run stopped without using the approval.

    - sid: ToolsStateStoreRecordsRead
      actions:
          - s3:GetObject
      resources:
          - arn:${Partition}:s3:::vra-state-*/*/artifacts/*
          - arn:${Partition}:s3:::vra-state-*/*/signatures/*
          - arn:${Partition}:s3:::vra-state-*/*/checkpoints/*
          - arn:${Partition}:s3:::vra-state-*/*/sync-state.json
          - arn:${Partition}:s3:::vra-state-*/*/iam/*
          - arn:${Partition}:s3:::vra-state-*/*/pipeline/*
      note: >-
          Bundles, build signatures, checkpoint manifests, the last-seen upstream refs, IT role packages with their
          apply record (iam/<env>/*, the IAM gates of preflight, build and deploy) and pipeline plans (pipeline/*).

    - sid: ToolsStateStoreRecords
      actions:
          - s3:PutObject
      resources:
          - arn:${Partition}:s3:::vra-state-*/*/signatures/*
          - arn:${Partition}:s3:::vra-state-*/*/checkpoints/*
          - arn:${Partition}:s3:::vra-state-*/*/sync-state.json
          - arn:${Partition}:s3:::vra-state-*/*/iam/*/applied.json
      note: >-
          Build signatures and tag signer keys, checkpoint manifests, sync state, and the current IT apply record
          (iam/<env>/applied.json, replaced by `vra iam apply`; the create-only history record binds it).

    - sid: ToolsStateStoreList
      actions:
          - s3:ListBucket
      resources:
          - arn:${Partition}:s3:::vra-state-*
      note: >-
          List runs, history sequences and bundles. Not narrowed by s3:prefix: without ListBucket S3 answers a read
          of a missing key with 403 instead of 404, and create-only writes and approval claims read missing keys.

    - sid: ToolsStateStoreLock
      actions:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:DeleteItem
          - dynamodb:DescribeTable
      resources:
          - arn:${Partition}:dynamodb:*:*:table/vra-locks
      condition:
          ForAllValues:StringLike:
              dynamodb:LeadingKeys:
                  - env#*
                  - run#*
      note: >-
          Lock items env#<env>, env#watch and run#<runId> (run lease). GetItem is ConsistentRead; PutItem carries
          attribute_not_exists(lockId) OR ver = :v, DeleteItem ver = :v (vra unlock deletes unconditionally).
          UpdateItem is not used. Narrow the account at render time if the tools account is fixed.

    - sid: ToolsStateStoreKey
      actions:
          - kms:Decrypt
          - kms:GenerateDataKey
          - kms:DescribeKey
      resources:
          - arn:${Partition}:kms:*:*:key/*
      condition:
          ForAnyValue:StringEquals:
              kms:ResourceAliases: alias/vra-state
      note: The state bucket and lock table are encrypted with the vra-state CMK.
