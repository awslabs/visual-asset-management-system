# Per-transition migration notes for VAMS data migrations. The engine discovers the actual
# vX_to_vY directories in the checked-out ref and chains them; this matrix annotates each with
# whether an A/B (blue/green) deployment is required and any manual steps the automation cannot do.
# Keys are "<from>_to_<to>" matching infra/deploymentDataMigration/.
# resolvesViaSsm=false means the migration config needs explicit physical table names
# (pre-v2.6 scripts); the engine fills them from SSM where it can, else flags for the operator.
schemaVersion: 1
transitions:
    v2.1_to_v2.2:
        script: v2.1_to_v2.2/upgrade/v2.1_to_v2.2_migration.py
        resolvesViaSsm: false
        requiresAB: false
        manualSteps:
            - "Set explicit table names in the migration config (source deployment publishes no SSM names)."
    v2.2_to_v2.3:
        script: v2.2_to_v2.3/upgrade/v2.2_to_v2.3_migration.py
        resolvesViaSsm: false
        requiresAB: false
    v2.3_to_v2.4:
        script: v2.3_to_v2.4/upgrade/v2.3_to_v2.4_migration.py
        resolvesViaSsm: false
        requiresAB: false
    v2.4_to_v2.5:
        script: v2.4_to_v2.5/upgrade/v2.4_to_v2.5_migration.py
        resolvesViaSsm: false
        requiresAB: false
        notes: "Full-table copy V1 -> V2 tables; --clear-v2 to reset the V2 targets on re-run."
    v2.5_to_v2.6:
        script: v2.5_to_v2.6/upgrade/v2.5_to_v2.6_migration.py
        resolvesViaSsm: true
        requiresAB: false
        steps:
            [
                reindex,
                assetHistory,
                workflowExecutions,
                auxPreviewRelocation,
                pipelineWorkflowDefinitions,
                globalListBackfill,
                tagsNamespacing,
            ]
        notes: >-
            Single consolidated script; --steps selects steps. Reindex invokes the deployed reindexer Lambda.
            Provisioned OpenSearch only: if the 2.7->3.5 domain upgrade fails on an existing domain, deploy once
            with config.app.openSearch.useProvisioned.enabled=false, then re-enable (see migration README).
# manualSteps = prerequisites a human MUST do; the engine stops before that migration (exit 20) until
# `vra resume <run-id> --confirm`. Conditional advice belongs in `notes` (shown in the plan, never gates).
# Search reindex after an upgrade, keyed by the TARGET version (applies whether or not a migration directory
# exists): an upgrade from F to T passes every entry with F < version <= T. required: vra deploy runs the reindexer
# after the migrations; recommended: a report note (`vra reindex --env <env>`). coveredBy: a migration step that
# already reindexes; when it ran in the deploy, the entry is done.
versions:
    "2.6.0":
        reindex: required
        reason: "the OpenSearch index names rolled to vams-assets-v3 and vams-files-v3"
        coveredBy: v2.5_to_v2.6
    "2.7.0":
        reindex: recommended
        reason: >-
            VAMS_ and underscore-prefixed metadata keys are no longer indexed (GitHub issue #606); existing index
            documents keep them until a reindex
# Default assumptions for a transition not listed above (newer than this matrix):
defaults:
    resolvesViaSsm: true
    requiresAB: false
