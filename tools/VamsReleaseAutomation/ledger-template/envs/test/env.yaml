# Environment: test (UAT). Promoted from dev with an approval record; target of prod -> test data copy.
name: test
description: Human UAT on the exact build that passed dev.
account: "333333333333"
region: us-east-1
partition: aws
# GovCloud variant: region: us-gov-west-1, partition: aws-us-gov, templateBase: govcloud,
#   deployRoleArn / dataCopyRoleArn with arn:aws-us-gov:...
deployRoleArn: arn:aws:iam::333333333333:role/vra-deploy-test
dataCopyRoleArn: arn:aws:iam::333333333333:role/vra-data-copy-target-test # vra-data-copy-roles.yaml Side=target
templateBase: commercial
configName: vams
baseStackName: test
lane: release
promotesFrom: dev
autoDeploy: false
requiresApproval: true
approvers: # allow list of approver ids (strict match, see docs/05 "Approval records"):
    - uat-lead@example.com #   plain ids = GitHub / GitLab logins or hand-written records
    - qa-manager@example.com
    # CodePipeline records the approver as an assumed-role ARN; list it as an ARN or ARN glob
    # (a bare session name never matches an ARN):
    # - arn:aws:sts::111111111111:assumed-role/AWSReservedSSO_UatApprover_*/uat-lead@example.com
approvalMaxAgeHours: 72 # an approval without expiresAt expires 72 h after approvedAt
synthRoleArn: arn:aws:iam::333333333333:role/vra-synth-test # build-only (vra-deploy-role.yaml CreateSynthRole)
permissionsBoundaryName: vra-cdk-execution-role-boundary # vra-cdk-execution-policy.yaml RoleBoundaryName
setSourceIdentity: true # default for gated envs; deploy role EnvTier=test requires it (CloudTrail attribution)
diffGate: text # text (default): fail-closed `cdk diff`; changeset: CloudFormation change sets (more IAM, slower)
writeFreeze: # restore / data copy stop writes while they clear and reload tables
    backend: auto # auto: VAMS maintenance mode when the deployed version publishes it, else manual
requiredSuites: [live-cli] # default for gated envs: the smoke and `vra test` must execute live-cli
driftCheck: true # default for gated envs: CloudFormation drift stops the deploy (--accept-drift)
backup:
    allowDegraded: false # a gated env needs a complete checkpoint (PITR on, S3 versioning on)
deployMode: in-place
rollbackPolicy: ask
backupBeforeDeploy: true
cognitoExport: false
dataCopy:
    allowedSources: [prod] # `vra data-copy --from prod --to test` (approval gated)
    allowAsTarget: true # explicit; test is not prod-class (prod promotes from it), so true is also the default
    maskHook: null # e.g. "python3 tests/customer/mask_pii.py" -- off by default
    subsetHook: null
    copyUserRoles: false # Cognito users are never copied
    chainSourceRole: false # true: assume prod's export role FROM this env's loader role (CI pinned to test)
    batchOperationsThreshold: 10000
    batchOperationsRoleArn: arn:aws:iam::333333333333:role/vra-data-copy-batch-test
    # every registered prod asset bucket -> its own test bucket (one-to-one pairs automatically; anything
    # else needs a map, unmapped buckets stop the copy with exit 20)
    bucketMap:
        vams-core-prod-us-east-1-assetbucket-abc123: vams-core-test-us-east-1-assetbucket-def456
        example-prod-archive: example-test-archive
# Asset buckets registered in VAMS that are NOT named after the core stack (customer-named, other-account,
# own KMS key). Re-checked at the start of every backup, restore, data copy and deploy with migrations;
# an uncovered bucket or key -> IT request + exit 10. Asked by `vra setup`.
registeredBuckets:
    granted: true # IT granted vra-deploy-test and vra-data-copy-target-test (AdditionalBucketArns)
    bucketArns:
        - arn:aws:s3:::example-test-archive
        - arn:aws:s3:::example-test-intake-*
    kmsKeyArns:
        - arn:aws:kms:us-east-1:555555555555:key/11111111-2222-3333-4444-555555555555 # intake account's key
liveTest:
    cliProfile: vams-test
    credentialsSecret: vra/test/test-user
changeWindow: null
tags:
    vra:env: test
