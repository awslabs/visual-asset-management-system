# Environment: dev-preview (preview lane = upstream VAMS `development` + customer code).
# Deployed automatically, NEVER promoted (vra refuses preview-lane builds for promote).
# Shares the dev account here; a separate baseStackName keeps the stacks apart.
name: dev-preview
description: Early look at upstream development; expect breakage, never holds real data.
account: "222222222222"
region: us-east-1
partition: aws
# GovCloud variant: region: us-gov-west-1, partition: aws-us-gov, templateBase: govcloud
deployRoleArn: arn:aws:iam::222222222222:role/vra-deploy-dev-preview
templateBase: commercial
configName: vams
baseStackName: preview
lane: preview
promotesFrom: null
autoDeploy: true
requiresApproval: false
approvers: []
diffGate: text # text (default): fail-closed `cdk diff`; changeset: CloudFormation change sets (more IAM, slower)
writeFreeze: # restore / data copy stop writes while they clear and reload tables
    backend: auto # auto: VAMS maintenance mode when the deployed version publishes it, else manual
deployMode: in-place
rollbackPolicy: auto
backupBeforeDeploy: false # throwaway data
cognitoExport: false
dataCopy:
    allowedSources: []
# Asset buckets registered in VAMS that are NOT named after the core stack (customer-named, other-account,
# own KMS key). Re-checked at the start of every backup, restore, data copy and deploy with migrations;
# an uncovered bucket or key -> IT request + exit 10. Asked by `vra setup`.
registeredBuckets:
    granted: false
    bucketArns: []
    kmsKeyArns: []
liveTest:
    cliProfile: vams-dev-preview
    credentialsSecret: vra/preview/test-user
changeWindow: null
tags:
    vra:env: dev-preview
