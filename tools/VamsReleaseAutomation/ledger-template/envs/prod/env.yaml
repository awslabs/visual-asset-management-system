# Environment: prod. Promoted from test with the FINAL approval; change window enforced.
# A full GovCloud version of this env lives in variants/govcloud/envs/prod/.
name: prod
description: Production.
account: "444444444444"
region: us-east-1
partition: aws
# GovCloud variant: region: us-gov-west-1, partition: aws-us-gov, templateBase: govcloud
deployRoleArn: arn:aws:iam::444444444444:role/vra-deploy-prod
dataCopyRoleArn: arn:aws:iam::444444444444:role/vra-data-copy-source-prod # vra-data-copy-roles.yaml Side=source
templateBase: commercial
configName: vams
baseStackName: prod
lane: release
promotesFrom: test
autoDeploy: false
requiresApproval: true
approvers:
    - release-manager@example.com
    - service-owner@example.com
    # CodePipeline lane: the approver is recorded as an assumed-role ARN, e.g.
    # - arn:aws:sts::111111111111:assumed-role/AWSReservedSSO_ReleaseApprover_*/release-manager@example.com
dataOwners: # approve prod data leaving prod (data-copy-to:<target>); default: approvers
    - data-owner@example.com
approvalMaxAgeHours: 24
synthRoleArn: arn:aws:iam::444444444444:role/vra-synth-prod # build-only; prod never lends its deploy role to synth
# vra build checks that every synthesized role carries this boundary. VAMS 2.6.6 and earlier drop it (their
# IamRoleTransform aspect sets PermissionsBoundary to AWS::NoValue, GitHub issue #431, fixed in VAMS 2.6.7), so on
# those versions the build stops (exit 20) until the fork fixes the aspect (core patch CP-431,
# core-patches/iam-role-transform-boundary.patch, listed in core-patches.md) or the env uses iam.mode precreated.
permissionsBoundaryName: vra-cdk-execution-role-boundary
# Strict-IAM environments (`vra iam plan|apply|verify`): how IT controls the roles of this env.
#   standard (default): VAMS creates its own roles.
#   boundary: VAMS creates them under IT's permission boundary and name prefix (cdk.json environments.aws).
#   precreated: IT creates every VAMS stack role (app.iamRoleConfig.useCustomVamsStackRoles + precreatedRoles).
#   bootstrap: IT creates the CDK bootstrap roles (useCustomBootstrapRoles), or none with cliCredentialsSynthesizer.
# Combine with +. `vra preflight` / `vra build` stop with exit 10 while the env's IT package is missing or stale.
# iam:
#   mode: precreated+bootstrap
#   boundaryArn: arn:aws:iam::444444444444:policy/it-vams-boundary
#   rolePrefix: ITVAMS-       # required with precreated: IT's roles start with it (scoped CDK execution policy)
#   cliCredentialsSynthesizer: false
#   quotaHeadroom: 10           # IAM roles/policies kept free by the pre-deploy quota check (any mode)
#   bootstrap:
#     qualifier: hnb659fds        # role ARNs come back with the IT response (or list them here)
# cloudfront:
#   quotaHeadroom: 2            # CloudFront policies/distributions kept free by the pre-deploy quota check
setSourceIdentity: true # default for gated envs; deploy role EnvTier=prod requires it
diffGate: text # text (default): fail-closed `cdk diff`; changeset: CloudFormation change sets (more IAM, slower)
writeFreeze: # restore / data copy stop writes while they clear and reload tables
    backend: auto # auto: VAMS maintenance mode when the deployed version publishes it, else manual
requiredSuites: [live-cli]
driftCheck: true
backup:
    allowDegraded: false
deployMode: in-place # use "ab" + ab.slots for upgrades the upgrade matrix marks as requiring A/B
rollbackPolicy: ask
backupBeforeDeploy: true
cognitoExport: true
dataCopy:
    allowAsTarget: false # prod is never a data-copy TARGET (also the default for prod-class envs)
    allowedSources: [] # prod is a copy SOURCE only (test lists it), never a target
    stagingBucket: vra-data-copy-444444444444-us-east-1
    # source-side S3 Batch Operations role (staged asset copies above the threshold run in prod's account)
    batchOperationsRoleArn: arn:aws:iam::444444444444:role/vra-data-copy-batch-prod
# Asset buckets registered in VAMS that are NOT named after the core stack (customer-named, other-account,
# own KMS key). Re-checked at the start of every backup, restore, data copy and deploy with migrations;
# an uncovered bucket or key -> IT request + exit 10. Asked by `vra setup`.
registeredBuckets:
    granted: true # vra-deploy-prod and vra-data-copy-source-prod
    bucketArns:
        - arn:aws:s3:::example-prod-archive
        - arn:aws:s3:::example-prod-intake-*
    kmsKeyArns:
        - arn:aws:kms:us-east-1:555555555555:key/66666666-7777-8888-9999-000000000000
liveTest:
    cliProfile: vams-prod
    credentialsSecret: vra/prod/smoke-user # read-mostly smoke user
changeWindow:
    cron: "0 2 * * 6" # Saturdays 02:00 ...
    durationMinutes: 240 # ... for 4 hours
    timezone: America/New_York
# A/B (blue/green) example for a major upgrade; uncomment with deployMode: ab
# ab:
#   slots:
#     blue: prod
#     green: prodb
#   dnsSwitchHook: "bash tests/customer/switch_dns.sh"
tags:
    vra:env: prod
    data-classification: <classification>
