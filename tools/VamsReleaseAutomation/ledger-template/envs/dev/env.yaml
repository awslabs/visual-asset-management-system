# Environment: dev (release lane, deployed automatically by `vra watch` / the pipeline).
# Schema: engine/vra/data/schemas/env.schema.json. Placeholder values only.
name: dev
description: Integration environment for the newest customer build of a VAMS release.
account: "222222222222"
region: us-east-1
partition: aws
# GovCloud variant: region: us-gov-west-1, partition: aws-us-gov, templateBase: govcloud,
#   deployRoleArn: arn:aws-us-gov:iam::222222222222:role/vra-deploy-dev
deployRoleArn: arn:aws:iam::222222222222:role/vra-deploy-dev # iam/cloudformation/vra-deploy-role.yaml
profile: null # alternative to deployRoleArn for local operator runs
sessionDurationSeconds: 3600
templateBase: commercial # commercial | govcloud | eusovereign | custom
configName: vams # VAMS config "name" (overlay config.json)
baseStackName: dev # VAMS app.baseStackName (raw; VAMS appends -<region>)
lane: release
promotesFrom: null
autoDeploy: true
requiresApproval: false
approvers: []
permissionsBoundaryName: vra-cdk-execution-role-boundary # required by vra-cdk-execution-policy.yaml
# synthRoleArn: arn:aws:iam::222222222222:role/vra-synth-dev  # optional; dev is ungated, so synth may use its deploy role
# requiredSuites defaults to [live-cli] here: test (gated) promotes from dev, so dev's tests are evidence
diffGate: text # text (default): fail-closed `cdk diff`; changeset: CloudFormation change sets (more IAM, slower)
writeFreeze: # restore / data copy stop writes while they clear and reload tables
    backend: auto # auto: VAMS maintenance mode when the deployed version publishes it, else manual
# setSourceIdentity: false      # default false for ungated envs; deploy role EnvTier=dev
deployMode: in-place # in-place | ab
rollbackPolicy: auto # auto: watch rolls back on failed tests
backupBeforeDeploy: true
cognitoExport: false
dataCopy:
    allowedSources: []
# Asset buckets registered in VAMS that are NOT named after the core stack (customer-named, other-account,
# own KMS key). Re-checked at the start of every backup, restore, data copy and deploy with migrations;
# an uncovered bucket or key -> IT request + exit 10. Asked by `vra setup`.
registeredBuckets:
    granted: false # only the stack's own buckets so far
    bucketArns: []
    kmsKeyArns: []
liveTest:
    apiUrl: null # null = resolved from stack outputs
    webUrl: null
    cliProfile: vams-dev
    credentialsSecret: vra/dev/test-user # Secrets Manager secret NAME with {username, password}
changeWindow: null
tags:
    vra:env: dev
    cost-center: <cost-center>
