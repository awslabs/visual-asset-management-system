# Customer regression hooks, run by `vra test --suites customer` after VAMS's own suites.
# Schema: engine/vra/data/schemas/customer-tests.schema.json
# Each hook runs with cwd = the ledger root (or `cwd`), and gets:
#   VRA_ENV, VRA_RUN_DIR, VRA_JUNIT_DIR, VAMS_API_URL, VAMS_WEB_URL, VAMSCLI_PROFILE
# Contract: exit 0 = pass; write JUnit XML into $VRA_JUNIT_DIR to get per-test results in reports.
# Credentials come from the env's liveTest.credentialsSecret through vamscli / the engine, never from here.
hooks:
    - name: api-smoke
      cmd: ["bash", "tests/customer/api_smoke.sh"]
      envs: [dev, dev-preview, test, prod]
      timeoutMin: 10

