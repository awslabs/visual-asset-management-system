# GovCloud (aws-us-gov) version of envs/prod/env.yaml. Copy over envs/prod/ (env.yaml + overlay/)
# to deploy prod in GovCloud. The overlay config.json here is generated from VAMS's
# infra/config/config.template.govcloud.json: ALB instead of CloudFront, FIPS endpoints, global VPC,
# provisioned OpenSearch, KMS CMK, govCloud.enabled.
name: prod
description: Production (AWS GovCloud US-West).
account: "444444444444"
region: us-gov-west-1
partition: aws-us-gov
deployRoleArn: arn:aws-us-gov:iam::444444444444:role/vra-deploy-prod
dataCopyRoleArn: arn:aws-us-gov:iam::444444444444:role/vra-data-copy-source-prod
templateBase: govcloud
configName: vams
baseStackName: prod
lane: release
promotesFrom: test
autoDeploy: false
requiresApproval: true
approvers:
    - release-manager@example.com
    - service-owner@example.com
dataOwners:
    - data-owner@example.com
approvalMaxAgeHours: 24
synthRoleArn: arn:aws-us-gov:iam::444444444444:role/vra-synth-prod
# Checked on every synthesized role; VAMS up to at least 2.6.6 drops it (see envs/prod/env.yaml of the template).
permissionsBoundaryName: vra-cdk-execution-role-boundary
# Strict-IAM environments: see envs/prod/env.yaml of the template for the modes.
# iam:
#   mode: precreated
#   boundaryArn: arn:aws-us-gov:iam::444444444444:policy/it-vams-boundary
#   rolePrefix: ITVAMS-
setSourceIdentity: true # default for gated envs; deploy role EnvTier=prod requires it (CloudTrail attribution)
diffGate: text # text (default): fail-closed `cdk diff`; changeset: CloudFormation change sets (more IAM, slower)
writeFreeze: # restore / data copy stop writes while they clear and reload tables
    backend: auto # auto: VAMS maintenance mode when the deployed version publishes it, else manual
requiredSuites: [live-cli]
driftCheck: true
deployMode: in-place
rollbackPolicy: ask
backupBeforeDeploy: true
cognitoExport: true
dataCopy:
    allowAsTarget: false # prod is never a data-copy TARGET (also the default for prod-class envs)
    allowedSources: []
    stagingBucket: vra-data-copy-444444444444-us-gov-west-1
# Asset buckets registered in VAMS that are NOT named after the core stack (customer-named, other-account,
# own KMS key). Re-checked at the start of every backup, restore, data copy and deploy with migrations;
# an uncovered bucket or key -> IT request + exit 10. Asked by `vra setup`.
registeredBuckets:
    granted: true
    bucketArns:
        - arn:aws-us-gov:s3:::example-prod-archive
    kmsKeyArns: []
liveTest:
    webUrl: https://vams.example.com # app.useAlb.domainHost
    cliProfile: vams-prod
    credentialsSecret: vra/prod/smoke-user
changeWindow:
    cron: "0 2 * * 6"
    durationMinutes: 240
    timezone: America/New_York
tags:
    vra:env: prod
