# Sample workflow for the customer's VAMS FORK repository (.github/workflows/vra-hand-off.yml), automation tier
# `pipeline+actions`: GitHub Actions runs the checks (pr-checks.yml, security-scan.yml); CodePipeline (cicd/pipeline)
# runs every deploy, test and approval. When both check workflows have passed for a push to the fork trunk, this job
# starts ONE release pipeline execution for exactly that commit.
#
# Pipeline side: the Fork source action must not start executions on push (the pipeline's fork source with
# trigger-on-push off), otherwise every push runs the pipeline before the checks. The execution is started with
# a source revision override (COMMIT_ID = the checked commit) and the client request token vra-<sha>, so a second
# trigger for the same commit returns the same execution instead of starting another one.
#
# AWS access: GitHub environment `vra-handoff` (deployment branch rule: the fork trunk; no reviewers: the approvals
# are the pipeline's manual approval actions). Its variable VRA_CI_ROLE_ARN names an OIDC role that trusts only
# repo:<org>/<fork>:environment:vra-handoff and may only call codepipeline:StartPipelineExecution and
# codepipeline:GetPipelineExecution on the release pipeline (README.md "Hand-off role"). It holds no deploy rights.
#
# Variables: VRA_HANDOFF_PIPELINE (release pipeline name), VRA_AWS_REGION, optional VRA_PIPELINE_SOURCE_ACTION
# (default Fork), VRA_OIDC_AUDIENCE, VRA_RUNS_ON, VRA_PACKAGE_REPO / VRA_PACKAGE_REF (the gate script).
# Edit the branch filter below to the fork trunk. The aws CLI must be on the runner (GitHub-hosted runners have it;
# install it on GHES self-hosted runners).
name: vra-hand-off-to-codepipeline

on:
    workflow_run:
        workflows: [vra-pr-checks, vra-security-scan]
        types: [completed]
        branches: [main]
    workflow_dispatch:
        inputs:
            sha:
                description: Fork trunk commit that passed the checks (full SHA)
                type: string
                required: true

permissions:
    contents: read

jobs:
    hand-off:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
        runs-on: ${{ fromJSON(vars.VRA_RUNS_ON || '"ubuntu-latest"') }}
        environment: vra-handoff
        timeout-minutes: 20
        concurrency:
            group: vra-handoff-${{ github.event.workflow_run.head_sha || inputs.sha }}
            cancel-in-progress: false
        permissions:
            id-token: write
            contents: read
            actions: read # list the check runs of the commit
        env:
            SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
            PIPELINE: ${{ vars.VRA_HANDOFF_PIPELINE }}
            SOURCE_ACTION: ${{ vars.VRA_PIPELINE_SOURCE_ACTION || 'Fork' }}
            TRUNK: ${{ vars.VRA_TRUNK || 'main' }}
            # the check workflows by name AND file: a branch cannot satisfy the gate with a workflow of the same name
            REQUIRED: >-
                vra-pr-checks=.github/workflows/vra-pr-checks.yml,vra-security-scan=.github/workflows/vra-security-scan.yml
            ASH_FAIL_ON: ${{ vars.VRA_ASH_FAIL_ON || 'high' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ vars.VRA_PACKAGE_REPO }}
                  ref: ${{ vars.VRA_PACKAGE_REF }}
                  path: vra-src
                  token: ${{ secrets.VRA_GIT_TOKEN || github.token }}
                  persist-credentials: false
            - name: all checks passed for this commit?
              id: gate
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_ENTERPRISE_TOKEN: ${{ github.token }}
              run: |
                  [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit SHA"; exit 2; }
                  [[ "${PIPELINE}" =~ ^[A-Za-z0-9.@_-]{1,100}$ ]] || { echo "set vars.VRA_HANDOFF_PIPELINE"; exit 2; }
                  [[ "${TRUNK}" =~ ^[A-Za-z0-9._/-]{1,200}$ ]] || { echo "bad vars.VRA_TRUNK"; exit 2; }
                  export GH_HOST="${GITHUB_SERVER_URL#https://}"
                  # a dispatched SHA must be on the trunk (the trunk tip or behind it), never an unreviewed commit
                  status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SHA}...${TRUNK}" --jq .status)"
                  case "${status}" in
                    identical | behind) ;;
                    *) echo "${SHA} is not on ${TRUNK} (compare: ${status})"; exit 1 ;;
                  esac
                  gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" > runs.json
                  state="$(python3 vra-src/cicd/github-actions/scripts/checks_passed.py --runs runs.json \
                    --sha "${SHA}" --require "${REQUIRED}" --branch "${TRUNK}")"
                  scan_run="$(python3 vra-src/cicd/github-actions/scripts/checks_passed.py --runs runs.json \
                    --sha "${SHA}" --require "${REQUIRED}" --branch "${TRUNK}" --print-run vra-security-scan)"
                  echo "state=${state}" >> "$GITHUB_OUTPUT"
                  echo "scan-run=${scan_run}" >> "$GITHUB_OUTPUT"
                  echo "checks for ${SHA}: ${state}" >> "$GITHUB_STEP_SUMMARY"
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              if: steps.gate.outputs.state == 'ready'
              with:
                  # the ASH report of the security-scan run the gate counted
                  name: automated-security-helper-report
                  path: ash-report
                  run-id: ${{ steps.gate.outputs.scan-run }}
                  github-token: ${{ github.token }}
            - name: ASH findings below the release threshold?
              if: steps.gate.outputs.state == 'ready'
              run: |
                  python3 vra-src/cicd/github-actions/scripts/checks_passed.py ash \
                    --summary ash-report/ash-output/vra-ash-summary.json --fail-on "${ASH_FAIL_ON}"
            - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              if: steps.gate.outputs.state == 'ready'
              with:
                  role-to-assume: ${{ vars.VRA_CI_ROLE_ARN }}
                  aws-region: ${{ vars.VRA_AWS_REGION }}
                  audience: ${{ vars.VRA_OIDC_AUDIENCE || 'sts.amazonaws.com' }}
                  role-session-name: vra-handoff-${{ github.run_id }}
            - name: start the release pipeline for this commit
              if: steps.gate.outputs.state == 'ready'
              run: |
                  [[ "${SOURCE_ACTION}" =~ ^[A-Za-z0-9.@_-]{1,100}$ ]] || { echo "bad VRA_PIPELINE_SOURCE_ACTION"; exit 2; }
                  aws codepipeline start-pipeline-execution --name "${PIPELINE}" \
                    --source-revisions "actionName=${SOURCE_ACTION},revisionType=COMMIT_ID,revisionValue=${SHA}" \
                    --client-request-token "vra-${SHA}" --output json > execution.json
                  execution="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["pipelineExecutionId"])' execution.json)"
                  echo "started ${PIPELINE} execution ${execution} for ${SHA}" >> "$GITHUB_STEP_SUMMARY"
