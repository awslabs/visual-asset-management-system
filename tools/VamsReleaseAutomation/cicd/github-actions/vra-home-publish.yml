# Reusable workflow: publish the vra state another job wrote to the PRIVATE vra home repository.
# Copy next to the other vra workflows in the home repository's .github/workflows/.
#
# Why a job of its own: the jobs that write state also run fork or upstream code (npm ci, cdk synth of the fork,
# Playwright for the live suites). Code in one job can read later steps' files and processes, so the home's
# write token (secrets.VRA_HOME_TOKEN) never enters those jobs: their checkouts drop credentials, their engine
# commits stay local (VRA_HOME_DEFER_PUSH=1), and they hand state/, checkpoints/ and artifacts/ over as an
# artifact. This job runs no fork code: a fresh runner, the pinned vra package, the artifact copied into a fresh
# checkout, then `vra home sync` (vra-home.sh refuses any change outside state/, artifacts/, checkpoints/, so a
# job can never publish an approval or a ledger change). With stateStore.type s3 there is nothing to push.
name: vra-home-publish

on:
    workflow_call:
        inputs:
            state-artifact:
                description: Name of the artifact with the job's state/, checkpoints/ and artifacts/ (vra-home layout)
                type: string
                required: true

permissions:
    contents: read

jobs:
    publish:
        runs-on: ${{ fromJSON(vars.VRA_RUNS_ON || '"ubuntu-latest"') }}
        timeout-minutes: 30
        permissions:
            contents: read
        env:
            VRA_HOME: ${{ github.workspace }}/vra-home
            VRA_HOME_REF: ${{ github.event.repository.default_branch }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: vra-home
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ vars.VRA_PACKAGE_REPO }}
                  ref: ${{ vars.VRA_PACKAGE_REF }}
                  path: vra-src
                  token: ${{ secrets.VRA_GIT_TOKEN }}
                  persist-credentials: false
            - uses: ./vra-src/cicd/github-actions/setup-vra
              with:
                  git-credentials: "false"
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ${{ inputs.state-artifact }}
                  path: vra-state
            - name: vra home push (no fork code in this job)
              env:
                  VRA_HOME_TOKEN: ${{ secrets.VRA_HOME_TOKEN }}
              run: |
                  bash vra-src/cicd/codebuild/scripts/vra-home.sh checkout
                  bash vra-src/cicd/codebuild/scripts/vra-home.sh adopt vra-state
                  bash vra-src/cicd/codebuild/scripts/vra-home.sh sync home-push
