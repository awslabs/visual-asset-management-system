[pytest]
testpaths =
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# An xfail here marks a test written against a defect that is not fixed yet: it stays green while the
# bug exists and turns RED the moment the fix lands, forcing whoever fixed it to delete the marker.
# Without strict mode an XPASS is tolerated silently and the marker rots, leaving a test that no longer
# asserts anything. Matches backend/pytest.ini and tools/VamsCLI/pyproject.toml.
xfail_strict = true

addopts = -ra -q --strict-markers
markers =
    unit: marks tests as unit tests
    integration: marks tests as integration tests
