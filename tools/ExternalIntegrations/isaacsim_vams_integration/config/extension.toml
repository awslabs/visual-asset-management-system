[package]
version = "1.0.0"
title = "VAMS Connector for Isaac Sim"
description = "Integrates NVIDIA Isaac Sim with the Visual Asset Management System (VAMS) for browsing, downloading, uploading, and managing 3D assets. Uses the VAMS CLI for all operations."
category = "asset-management"
keywords = ["vams", "asset management", "3d", "usd", "connector"]
authors = ["VAMS Team"]

[core]
reloadable = true

[dependencies]
"omni.kit.window.extensions" = {optional = true}
"omni.kit.uiapp" = {optional = true}
"isaacsim.asset.importer.urdf" = {optional = true}
"isaacsim.asset.importer.mjcf" = {optional = true}
# Loaded first when present so the VAMS connection can be added to the Content window (Isaac Sim 6.1+).
"omni.kit.window.content_browser" = {optional = true}
"omni.kit.widget.connection_manager" = {optional = true}

[[python.module]]
name = "vams.connector.isaacsim"

[settings]
# Default VAMS CLI profile name. Change if using a non-default profile.
exts."vams.connector.isaacsim".profile = "default"
# Optional explicit path to the vamscli executable. Leave empty to use PATH.
exts."vams.connector.isaacsim".vamscli_path = ""
# Show VAMS in the Content window under Omniverse Storage once signed in (Isaac Sim 6.1+). Needs grpcio and
# protobuf in the VAMS CLI's environment (requirements-storage.txt). The Content window keeps its connections in
# the user's omniverse.toml, so the entry is written there while the connection is on.
exts."vams.connector.isaacsim".content_window = false
