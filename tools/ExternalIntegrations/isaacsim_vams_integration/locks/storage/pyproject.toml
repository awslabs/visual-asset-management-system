[project]
name = "vams-isaacsim-storage-adapter-deps"
version = "0.1.0"
description = "Packages the Isaac Sim connector's Content window storage adapter needs beside the VAMS CLI (#1917)"
requires-python = ">=3.12"
dependencies = [
    # At least the versions the shipped generated modules were built with
    # (vams/connector/isaacsim/storage_adapter/proto/README.md).
    "grpcio>=1.85.4,<2",
    "protobuf>=7.35.1,<8",
]

[tool.uv]
package = false
required-version = "==0.13.8"
# These packages install into the VAMS CLI's virtual environment, so a package both sets share is held to the
# version tools/VamsCLI/requirements.lock pins. Keep this list in step with that lock.
constraint-dependencies = ["typing-extensions==4.16.0"]
