[project]
name = "splat-toolbox-pipeline"
version = "0.1.0"
description = "Splat Toolbox pipeline container: the VAMS-owned requirements"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3",
    "botocore",
    "rich",
    "rich_argparse",
    "docker",
]

# Only the VAMS-owned requirements are locked. The image itself is built from upstream's Dockerfile (synced at
# synth time), which does not install requirements.txt: the GPU stack, torch and the packages upstream names are
# resolved by that Dockerfile at build time and are not covered by this lock. requirements.txt is the uv export
# of uv.lock that the pipeline test runner installs for this directory's tests. uv is a development and CI tool
# only and is not part of the image.
[tool.uv]
package = false
required-version = "==0.13.8"
exclude-newer = "7 days"
