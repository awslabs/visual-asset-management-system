[project]
name = "3d-thumbnail-lambda-image"
version = "0.1.0"
description = "3D thumbnail pipeline Lambda render image"
requires-python = ">=3.12,<3.13"
# Exact pins, every package from a binary wheel for CPython 3.12 on the public.ecr.aws/lambda/python:3.12
# base (glibc 2.34); the image carries no compiler.
dependencies = [
    "boto3==1.43.89",
    "botocore==1.43.89",
    "pyvista==0.49.0",
    "vtk==9.6.2",
    "trimesh==4.12.2",
    "numpy==2.4.6",
    "scipy==1.18.1",
    "laspy[lazrs]==2.7.0",
    "lazrs==0.8.2",
    "pye57==0.4.19",
    "cadquery==2.8.0",
    "cadquery-ocp==7.9.3.1.1",
    "Pillow==13.0.0",
    "DracoPy==1.7.0",
    "usd-core==25.11",
    "ezdxf==1.4.4",
    "ifcopenshell==0.8.5",
    "lxml==6.1.3",
    "networkx==3.6.1",
]

# Dockerfile.lambda installs the committed, hashed requirements.txt with pip, which is exported from
# uv.lock; uv is a development and CI tool only and is not part of the image.
[tool.uv]
package = false
required-version = "==0.13.8"
exclude-newer = "7 days"
environments = ["sys_platform == 'linux'"]
