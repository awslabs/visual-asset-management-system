[project]
name = "kubernetes-layer"
version = "0.1.0"
description = "Kubernetes Python client Lambda layer for EKS operations"
authors = [
    {name = "VAMS Team"}
]
requires-python = ">=3.12,<3.13"
# No boto3 / botocore / s3transfer here: the pipeline Lambda also attaches the VAMS base layer, which
# ships the AWS SDK. Both layers extract into /opt/python, so any other package both layers lock is kept
# at the base layer's version (infra/test/pipelines/eksKubernetesLayerPackages.test.ts checks both).
dependencies = [
    "kubernetes==36.0.3",
    "PyYAML>=6.0",
    "requests>=2.28.0",
    "urllib3>=2.7.0,<3",
]

# The layer is installed by pip from the committed requirements.txt, which is exported from uv.lock
# (uv lock && uv export --frozen --no-hashes --no-emit-project --no-dev --no-annotate -o requirements.txt).
[tool.uv]
package = false
required-version = "==0.13.8"
exclude-newer = "7 days"
environments = ["sys_platform == 'linux'"]
