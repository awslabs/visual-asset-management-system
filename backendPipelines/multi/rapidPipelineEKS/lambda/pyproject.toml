[project]
name = "rapidpipeline-eks-lambda"
version = "0.1.0"
description = "RapidPipeline EKS Lambda code (test environment)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-lambda-powertools>=2.28.1",
    "boto3>=1.29.0",
    "kubernetes>=36.0.3,<37",
    "requests>=2.31.0",
    "urllib3>=2.8.0,<3",
]

# The committed requirements.txt is exported from uv.lock; uv is a development and CI tool only.
[tool.uv]
package = false
required-version = "==0.13.8"
exclude-newer = "7 days"
