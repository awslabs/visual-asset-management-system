[project]
name = "cogconvertcontainer"
version = "0.1.0"
description = "Python packages the COG conversion image installs with pip beside its conda GDAL stack"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.44.4",
]

# The GDAL stack is installed from conda-explicit.txt; only the packages below come from pip. The image
# installs the committed requirements.txt, which is exported from uv.lock
# (uv lock && uv export --frozen --no-emit-project --no-dev --no-annotate -o requirements.txt).
[tool.uv]
package = false
required-version = "==0.13.8"
exclude-newer = "7 days"
# These pins were published inside the seven-day window when the image was locked; the cutoff is lifted for
# them only so the image keeps its reviewed versions. Remove the entry once the release is older than 7 days.
exclude-newer-package = { boto3 = "2026-11-17T00:00:00Z", botocore = "2026-11-17T00:00:00Z", s3transfer = "2026-11-17T00:00:00Z" }
environments = ["sys_platform == 'linux'"]
