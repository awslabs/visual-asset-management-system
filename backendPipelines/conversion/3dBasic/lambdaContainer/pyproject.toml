[tool.poetry]
name = "3dBasicLambdaPipeline"
version = "0.1.0"
description = ""
authors = ["Kurt Scheuringer <scheurik@amazon.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,!=3.14.1,<3.15"
trimesh = "^5.2.1"
aws-lambda-powertools = "^3.41.0"
pillow = "^13.0.0"
usd-core = "^26.11"
lxml = "^6.1.3"
networkx = "^3.7"
pycollada = "^0.9.3"

# STEP input (app.pipelines.useConversion3dBasic.enableStepInput): installed only into the image built
# with ENABLE_STEP_INPUT=true, from requirements-step.txt (`poetry export --only step`). cascadio
# bundles Open CASCADE (LGPL-2.1 with the OCCT exception), so the default image holds none of it.
[tool.poetry.group.step]
optional = true

[tool.poetry.group.step.dependencies]
cascadio = "^0.1.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
