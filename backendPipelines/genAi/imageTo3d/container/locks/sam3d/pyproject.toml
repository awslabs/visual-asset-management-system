    # MoGe @ git+https://github.com/microsoft/MoGe.git@a8c37341bc0325ca99b9d57981cc3bb2bd3e255b: built from a pinned clone (out-of-lock.json)
    # SAM 3D's own requirements.dev.txt at SAM3D_COMMIT, line for line (upstream/requirements.dev.txt.recorded records the file; the build
