[project]
name = "imageto3d-sam3d"
version = "0.1.0"
description = "Image to 3D, SAM 3D Objects image: the whole Python set the image installs, locked per image (#1726)"
# The interpreter is the conda environment's Python 3.11.0 (conda-explicit.txt). The range is every 3.11 release
# before 3.11.5, so one resolution holds for it: a range reaching 3.11.5 would fork the lock for packages whose newer
# releases require that, and an exact 3.11.0 cannot be locked, since uv needs an interpreter in the range to read the
# metadata of the packages published only as source. The Dockerfile asserts 3.11.0.
requires-python = ">=3.11,<3.11.5"
dependencies = [
    # --- What the Dockerfile asks for, in the order it asks. ---
    # The torch build upstream's stack is built for (kaolin's wheel index and xformers 0.0.28.post3 both pin torch
    # 2.5.1), for CUDA 12.1. pytorch3d and gsplat compile against it after the install.
    "torch==2.5.1",
    "torchvision==0.20.1",
    # SAM 3D's own requirements.txt at SAM3D_COMMIT, line for line (upstream/requirements.txt.recorded records the file; the build
    # compares it with the clone), except the lines listed in the jest test's upstreamLinesNotLocked.
    "astor==0.8.1",
    "async-timeout==4.0.3",
    "auto_gptq==0.7.1",
    "autoflake==2.3.1",
    "av==12.0.0",
