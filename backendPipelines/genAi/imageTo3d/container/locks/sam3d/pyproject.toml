    # flash_attn==2.8.3: the prebuilt wheel for this torch, by URL below
    # SAM 3D's own requirements.inference.txt at SAM3D_COMMIT, line for line (upstream/requirements.inference.txt.recorded records the file; the build
    # compares it with the clone), except the lines listed in the jest test's upstreamLinesNotLocked.
    # kaolin==0.17.0: NVIDIA's wheel, not on PyPI: installed by its SHA-256 (out-of-lock.json)
    # gsplat @ git+https://github.com/nerfstudio-project/gsplat.git@2323de5905d5e90e035f792fe65bad0fedd413e7: built from a pinned clone (out-of-lock.json)
    "seaborn==0.13.2",
    "gradio==5.49.0",
    # The prebuilt flash-attn 2.8.3 wheel for torch 2.5, CUDA 12, CPython 3.11, built for the C++ ABI the pip torch
    # wheels have (cxx11abiFALSE); the Dockerfile asserts torch's ABI. The audit reads a wheel URL under this prefix by
    # its file name and version.
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.5cxx11abiFALSE-cp311-cp311-linux_x86_64.whl",
    # kaolin 0.17.0's own dependencies (its wheel's Requires-Dist). kaolin itself is NVIDIA's wheel, which PyPI does not
    # carry, so it is installed by its SHA-256 and recorded in out-of-lock.json.
    "ipycanvas",
    "ipyevents",
    "jupyter-client<8",
    "flask",
    "tornado",
    "comm>=0.1.3",
    "usd-core",
    "numpy<2.0",
    "pybind11",
    "Pillow>=8.0.0",
    "tqdm>=4.51.0",
    "scipy",
    "pygltflib",
    "warp-lang",
    "ipython",
    # The dependencies of the three packages built from pinned clones with --no-deps (out-of-lock.json), as each
    # one's setup.py or pyproject.toml declares them at its pinned commit. MoGe's utils3d is a fourth clone.
    # MoGe:
    "click",
    "opencv-python",
    "scipy",
    "matplotlib",
    "trimesh",
    "pillow",
    "huggingface_hub",
    "numpy",
    "torch>=2.0.0",
    "torchvision",
    "gradio",
    # utils3d (MoGe's pin):
    "moderngl",
    "numpy",
    "plyfile",
    "scipy",
    # gsplat:
    "ninja",
    "numpy",
    "jaxtyping",
    "rich>=12",
    "torch",
    # pytorch3d:
    "iopath",
    # pyvista, which upstream's postprocessing code imports. The image has always had it through upstream's
    # pymeshfix==0.17.0, which requires it; the lock replaces that pymeshfix with the GPL group's 0.18.1, which does not,
    # so it is named here with the range 0.17.0 states.
    "pyvista>=0.30.0",
    # Shared pipeline dependencies, which the Dockerfile used to install after the upstream stack from the shared
    # container/requirements.txt (#1726 retires that file; these are its lines).
    "boto3",
    "botocore",
    "numpy",
    "pillow",
    "trimesh>=4.11,<5",
    "manifold3d>=3.0,<4",
    "networkx",
    "fast-simplification",
    "rembg",
    "onnxruntime-gpu==1.22.0",
    "scipy",
    "xatlas==0.0.11",
]

# The GPL-3.0 mesh-repair rungs, installed only when the ENABLE_GPL_MESH_REPAIR build argument is true.
# requirements-gpl.lock is their export. Upstream's pymeshfix==0.17.0 is replaced by this group's version, which is
# what the image installed after it (both VAMS build paths pass ENABLE_GPL_MESH_REPAIR=true).
[dependency-groups]
gpl-repair = [
    "pymeshfix==0.18.1",
    "pymeshlab==2025.7.post1",
]
# The tools every pip step runs with and the source builds need (they build with --no-build-isolation), installed
# first from requirements-build.lock. pip, setuptools, wheel and packaging stay at the versions the conda environment
# brings, which the image has always run with: lightning 2.3.3 imports pkg_resources, which setuptools 81 removed.
# setuptools builds pytorch3d, gsplat, MoGe and utils3d; hatchling and
# hatch-requirements-txt and editables (hatchling's editable builder) for SAM 3D's own editable install.
build = [
    "pip==25.0.1",
    "setuptools==75.8.2",
    "wheel==0.45.1",
    "packaging==24.2",
    "hatchling",
    "hatch-requirements-txt",
    "editables",
]

# The Dockerfile installs the committed, hashed requirements*.lock files with `pip install --require-hashes
# --no-deps`. They are exports of uv.lock (`uv export`, command in each header). uv is a development and CI tool
# here and is not in the image.
[tool.uv]
package = false
required-version = "==0.13.8"
# This image has no shipped baseline: on 2026-11-24 development's build failed in pip's resolver (ResolutionTooDeep)
# after upstream releases of 2026-11-22. The set is a fresh resolution with this cutoff, the start of the day after
# #1667 last changed this image's recipe (merged 2026-11-20 23:40Z) and before those releases; the constraints
# below hold every package to it.
exclude-newer = "2026-11-21T00:00:00Z"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Upstream lines that the image has never installed as written:
#   xatlas: upstream pins 0.0.9; the shared pipeline pin 0.0.11 was installed over it, and texturing.py's layout
#   check is written against 0.0.11.
#   nvidia-pyindex: its only effect is to add pypi.ngc.nvidia.com to pip's configuration when it installs. This
#   build does not use that index (it does not resolve from the build subnet) and installs nothing by resolution,
#   so the package is left out; the build allows its one unmet line in pip check.
override-dependencies = [
    "xatlas==0.0.11",
    "nvidia-pyindex ; sys_platform == 'never'",
]

# The resolved set, one line per installed package. Kept equal to frozen-set.txt by locks/tools/sync_constraints.py.
