[project]
name = "imageto3d-step1x3d"
version = "0.1.0"
description = "Image to 3D, Step1X-3D image: the whole Python set the image installs, locked per image (#1726)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- What the Dockerfile asks for, in the order it asks. ---
    # CUDA 12.8 torch stack. The extensions built from source after the install compile against this torch.
    "torch==2.11.0",
    "torchvision==0.26.0",
    # Shared pipeline dependencies: the shared container/requirements.txt (retired in #1726) at the base commit, line for line.
    "boto3",
    "botocore",
    "numpy",
    "pillow",
    "trimesh>=4.11,<5",
    "manifold3d>=3.0,<4",
    "networkx",
    "fast-simplification",
    "rembg",
    "onnxruntime-gpu==1.22.0",
    "scipy",
    "xatlas==0.0.11",
    # Step1X-3D's own requirements.txt at STEP1X3D_COMMIT, line for line, except the two `git+` lines (nvdiffrast and
    # pytorch3d, built in the Dockerfile and recorded in out-of-lock.json) and `pymeshlab==2023.12.post3` (the GPL
    # group below carries pymeshlab; see the note there). upstream/requirements.txt.recorded records the file; the build
    # compares it with the clone. Its `trimesh==4.3.2` and `xatlas==0.0.10` are replaced by the overrides below.
    "datasets==2.19.0",
    "diffusers==0.32.2",
    "einops==0.8.0",
    "huggingface-hub==0.26.2",
    "imageio==2.34.1",
    "jaxtyping==0.2.28",
    "joblib==1.4.0",
    "lightning-utilities==0.11.2",
    "matplotlib==3.8.4",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "opencv-python-headless==4.10.0.84",
    "pandas==2.2.2",
    "pillow==10.3.0",
    "plyfile==1.0.3",
    "PyMCubes==0.1.4",
    "pyparsing==3.1.2",
    "pytorch-lightning==2.2.4",
    "PyYAML==6.0.1",
    "safetensors==0.4.3",
    "scikit-image==0.23.2",
    "scipy==1.13.0",
    "tensorboard==2.16.2",
    "tensorboardX==2.6.2.2",
    "timm==0.9.16",
    "tokenizers==0.21.0",
    "tqdm==4.66.2",
    "transformers==4.48.0",
    "trimesh==4.3.2",
    "spaces==0.28.3",
    "accelerate==1.5.2",
    "rembg==2.0.65",
    "gradio==5.5.0",
    "wandb==0.18.6",
    "deepspeed==0.16.4",
    "sageattention==1.0.6",
    "mosaicml-streaming==0.11.0",
    "easydict==1.13",
    "open3d==0.19.0",
    "prodigyopt==1.1.2",
    "peft==0.15.1",
    "sentencepiece==0.2.0",
    "onnxruntime==1.21.0",
    "bs4==0.0.2",
    "xatlas==0.0.10",
    "pybind11==2.13.6",
    "pygltflib==1.16.4",
    "kornia==0.8.0",
    "cupy-cuda12x==13.4.1",
    # Dependencies of the packages the Dockerfile builds from source with --no-deps (pytorch3d needs iopath, which brings
    # portalocker); the baseline image got them from pip's resolution of the git requirement.
    "iopath",
]

# The GPL-3.0 mesh-repair rungs, installed only when the ENABLE_GPL_MESH_REPAIR build argument is true.
# requirements-gpl.lock is their export.
[dependency-groups]
gpl-repair = [
    "pymeshfix==0.18.1",
    "pymeshlab==2025.7.post1",
]
# The tools every pip step runs with and the source builds need (they build with --no-build-isolation), installed
# first from requirements-build.lock.
build = [
    "pip",
    "setuptools",
    "wheel",
]

# The Dockerfile installs the committed, hashed requirements*.lock files with `pip install --require-hashes
# --no-deps`. They are exports of uv.lock (`uv export`, command in each header). uv is a development and CI tool
# here and is not in the image.
[tool.uv]
package = false
required-version = "==0.13.8"
# Every package is held to the baseline version by the constraints below, so no new release can enter the lock;
# the cutoff is the start of the baseline build (a relative "7 days" would reject baseline versions that were
# younger than that when it was built).
exclude-newer = "2026-11-23T17:25:00Z"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# The Dockerfile reasserts the shared requirements after Step1X-3D's own, which moves two of upstream's exact pins:
# trimesh 4.3.2 calls a manifold3d API that 3.x removed, so the manifold repair rung needs the shared floor; xatlas
# 0.0.11 is the shared pin. The lock keeps the versions that end up installed.
override-dependencies = [
    "trimesh==4.12.2",
    "xatlas==0.0.11",
]
# The versions the image installed when it was built from development, one line per installed package. Kept equal
# to frozen-set.txt by locks/tools/sync_constraints.py. Moving a version means re-freezing a build and
# re-locking (locks/tools/relock.md).
# BEGIN frozen-set constraints (locks/tools/sync_constraints.py)
