# END frozen-set constraints

# Two packages whose dependency lists uv cannot read the way pip got them, so the lock declares the lists the baseline
# image has installed (`pip show`, METADATA of the installed distribution):
#   open3d 0.19.0: the Linux wheel pip installs requires ipywidgets; the dependency list uv records for the package
#   leaves it out, so the lock would drop ipywidgets and the sixteen packages it brings.
#   deepspeed 0.16.4: only an sdist exists and its setup.py decides its requirements at build time; the build uv runs
#   adds nvidia-ml-py, the build pip ran when the baseline image was made did not, and the image does not ship it.
[[tool.uv.dependency-metadata]]
name = "open3d"
version = "0.19.0"
requires-dist = [
    "numpy>=1.18.0",
    "dash>=2.6.0",
    "werkzeug>=3.0.0",
    "flask>=3.0.0",
    "nbformat>=5.7.0",
    "configargparse",
    "ipywidgets>=8.0.4",
    "addict",
    "pillow>=9.3.0",
    "matplotlib>=3",
    "pandas>=1.0",
    "pyyaml>=5.4.1",
    "scikit-learn>=0.21",
    "tqdm",
    "pyquaternion",
]

[[tool.uv.dependency-metadata]]
name = "deepspeed"
version = "0.16.4"
requires-dist = [
    "einops",
    "hjson",
    "msgpack",
    "ninja",
    "numpy",
    "packaging>=20.0",
    "psutil",
    "py-cpuinfo",
    "pydantic>=2.0.0",
    "torch",
    "tqdm",
]

# torch and torchvision come from the CUDA 12.8 index, as the image installs them today. The index is explicit, so
# no other package can be taken from it.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
