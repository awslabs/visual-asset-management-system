[project]
name = "imageto3d-blenderagent"
version = "0.1.0"
description = "Image to 3D, Blender agent image: the whole Python set the image installs, locked per image (#1726)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- What the Dockerfile asks for, in the order it asks. ---
    # Shared pipeline dependencies: the shared container/requirements.txt (retired in #1726) at the base commit, line for line.
    "boto3",
    "botocore",
    "numpy",
    "pillow",
    "trimesh>=4.11,<5",
    "manifold3d>=3.0,<4",
    "networkx",
    "fast-simplification",
    "rembg",
    "onnxruntime-gpu==1.22.0",
    "scipy",
    "xatlas==0.0.11",
    # The Responses-to-Converse bridge, the OpenAI client the adapter uses to check it, and boto3, at the versions the
    # Dockerfile has always pinned (LITELLM_VERSION in the Dockerfile).
    "litellm[proxy]==1.100.0",
    "openai==2.54.0",
    "boto3==1.44.5",
    # The scripted refit's depth model runs on the CUDA 12.8 torch (TORCH_VERSION in the Dockerfile).
    "torch==2.7.1",
    # What MoGe's model code imports besides torch, utils3d, SciPy and NumPy. MoGe itself is installed with --no-deps
    # (out-of-lock.json), and the rest of its declared list serves its own demo apps.
    "opencv-python-headless==5.1.0.95",
    "huggingface_hub==2.4.0",
    # utils3d's own dependencies (numpy and scipy are above). utils3d is built from a pinned clone with --no-deps, so the
    # lock holds what its pyproject.toml declares.
    "moderngl",
    "matplotlib",
]

# The GPL-3.0 mesh-repair rungs, installed only when the ENABLE_GPL_MESH_REPAIR build argument is true.
# requirements-gpl.lock is their export.
[dependency-groups]
gpl-repair = [
    "pymeshfix==0.18.1",
    "pymeshlab==2025.7.post1",
]
# The tools every pip step runs with and the source installs need, installed first from requirements-build.lock.
build = [
    "pip",
    "setuptools",
    "wheel",
]

# The Dockerfile installs the committed, hashed requirements*.lock files with `pip install --require-hashes
# --no-deps`. They are exports of uv.lock (`uv export`, command in each header). uv is a development and CI tool
# here and is not in the image.
[tool.uv]
package = false
required-version = "==0.13.8"
# Every package is held to the baseline version by the constraints below, so no new release can enter the lock;
# the cutoff is the start of the baseline build (a relative "7 days" would reject baseline versions that were
# younger than that when it was built).
exclude-newer = "2026-11-23T22:10:30Z"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# The versions the image installed when it was built from development, one line per installed package. Kept equal
# to frozen-set.txt by locks/tools/sync_constraints.py. Moving a version means re-freezing a build and
# re-locking (locks/tools/relock.md).
# BEGIN frozen-set constraints (locks/tools/sync_constraints.py)
