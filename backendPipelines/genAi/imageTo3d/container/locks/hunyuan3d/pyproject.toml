[project]
name = "imageto3d-hunyuan3d"
version = "0.1.0"
description = "Image to 3D, Hunyuan3D-2 image: the whole Python set the image installs, locked per image (#1726)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- What the Dockerfile asks for, in the order it asks. ---
    # CUDA 12.8 torch stack. The extensions built from source after the install compile against this torch.
    "torch==2.11.0",
    "torchvision==0.26.0",
    # Shared pipeline dependencies: the shared container/requirements.txt (retired in #1726) at the base commit, line for line.
    "boto3",
    "botocore",
    "numpy",
    "pillow",
    "trimesh>=4.11,<5",
    "manifold3d>=3.0,<4",
    "networkx",
    "fast-simplification",
    "rembg",
    "onnxruntime-gpu==1.22.0",
    "scipy",
    "xatlas==0.0.11",
    # Hunyuan3D-2's own requirements.txt at HUNYUAN3D_COMMIT, line for line, except the lines the Dockerfile has always
    # filtered out: torch and torchvision (the CUDA build above), pymeshlab (GPL group below), gradio, fastapi and
    # uvicorn (demo only). upstream/requirements.txt.recorded records the file; the build compares it with the clone.
    # The file names no version, so the lock fixes the ones the baseline build resolved.
    "ninja",
    "pybind11",
    "diffusers",
    "einops",
    "opencv-python",
    "numpy",
    "transformers",
    "omegaconf",
    "tqdm",
    "trimesh",
    "pygltflib",
    "xatlas",
    "accelerate",
    "rembg",
    "onnxruntime",
]

# The GPL-3.0 mesh-repair rungs, installed only when the ENABLE_GPL_MESH_REPAIR build argument is true.
# requirements-gpl.lock is their export.
[dependency-groups]
gpl-repair = [
    "pymeshfix==0.18.1",
    "pymeshlab==2025.7.post1",
]
# The tools every pip step runs with and the source builds need (they build with --no-build-isolation), installed
# first from requirements-build.lock.
build = [
    "pip",
    "setuptools",
    "wheel",
]

# The Dockerfile installs the committed, hashed requirements*.lock files with `pip install --require-hashes
# --no-deps`. They are exports of uv.lock (`uv export`, command in each header). uv is a development and CI tool
# here and is not in the image.
[tool.uv]
package = false
required-version = "==0.13.8"
# Every package is held to the baseline version by the constraints below, so no new release can enter the lock;
# the cutoff is the start of the baseline build (a relative "7 days" would reject baseline versions that were
# younger than that when it was built).
exclude-newer = "2026-11-23T17:25:00Z"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# The versions the image installed when it was built from development, one line per installed package. Kept equal
# to frozen-set.txt by locks/tools/sync_constraints.py. Moving a version means re-freezing a build and
# re-locking (locks/tools/relock.md).
# BEGIN frozen-set constraints (locks/tools/sync_constraints.py)
constraint-dependencies = [
