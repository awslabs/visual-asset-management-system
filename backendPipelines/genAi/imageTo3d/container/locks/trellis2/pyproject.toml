    "tifffile==2025.5.10",
    "timm==1.0.31",
    "tokenizers==0.22.2",
    "torch==2.6.0+cu124",
    "torchvision==0.21.0+cu124",
    "tqdm==4.70.1",
    "transformers==4.56.2",
    "trimesh==4.12.2",
    "triton==3.2.0",
    "typing_extensions==4.16.0",
    "tzdata==2026.6",
    "urllib3==2.8.0",
    "Werkzeug==3.1.9",
    "wheel==0.48.0",
