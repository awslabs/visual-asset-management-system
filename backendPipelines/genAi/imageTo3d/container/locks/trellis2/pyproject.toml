    "nvidia-nvtx-cu12==12.4.127",
    "onnxruntime-gpu==1.22.0",
    "opencv-python-headless==5.1.0.95",
    "packaging==26.4",
    "pandas==2.3.3",
    "pillow==12.3.0",
    "pip==26.3",
