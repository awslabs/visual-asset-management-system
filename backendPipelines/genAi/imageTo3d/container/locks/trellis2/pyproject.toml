    "filelock==4.1.0",
    "flash-attn==2.7.3",
    "flatbuffers==25.12.19",
    "fsspec==2026.9.0",
    "glcontext==3.1.0",
    "grpcio==1.85.3",
    "hf-xet==1.8.0",
    "huggingface_hub==0.36.2",
    "humanfriendly==10.0",
    "idna==3.20",
    "ImageIO==2.38.0",
    "imageio-ffmpeg==0.8.1",
    "Jinja2==3.1.6",
    "jmespath==1.1.0",
