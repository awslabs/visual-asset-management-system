# END frozen-set constraints

# torch and torchvision come from the CUDA 12.4 index, as the image installs them today. The index is explicit, so no
# other package can be taken from it: the NVIDIA runtime wheels torch pins (nvidia-cudnn-cu12 and the rest) come from
# PyPI, where the CUDA index does not carry every one of them.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
