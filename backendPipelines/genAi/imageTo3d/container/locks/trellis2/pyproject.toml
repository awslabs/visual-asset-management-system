[project]
name = "imageto3d-trellis2"
version = "0.1.0"
description = "Image to 3D, TRELLIS.2 image: the whole Python set the image installs, locked per image (#1726)"
requires-python = ">=3.10,<3.11"
dependencies = [
    # --- What the Dockerfile asks for, in the order it asks. ---
    # The torch build upstream pins, for CUDA 12.4. Every extension built from source after the install compiles against it.
    "torch==2.6.0",
    "torchvision==0.21.0",
    # Shared pipeline dependencies: container/requirements.txt at the base commit, line for line.
    "boto3",
    "botocore",
    "numpy",
    "pillow",
    "trimesh>=4.11,<5",
    "manifold3d>=3.0,<4",
    "networkx",
    "fast-simplification",
    "rembg",
    "onnxruntime-gpu==1.22.0",
    "scipy",
    "xatlas==0.0.11",
    # Upstream's basic dependency set, as the Dockerfile has always asked for it (upstream's setup.sh names no
    # versions). transformers stays below 4.57: the model's feature extractor iterates `self.model.layer` of a
    # DINOv3ViTModel, which 4.56 holds directly and later releases moved into a nested encoder (the Dockerfile asserts it).
    "imageio",
    "imageio-ffmpeg",
    "tqdm",
    "easydict",
    "opencv-python-headless",
    "ninja",
    "trimesh",
    "transformers>=4.56,<4.57",
    "tensorboard",
    "pandas",
    "lpips",
    "zstandard",
    "kornia",
    "timm",
    # utils3d's own dependencies (numpy and scipy are above). utils3d is built from a pinned clone with --no-deps, so the
    # lock holds what its pyproject.toml declares.
    "moderngl",
    "plyfile",
    # The prebuilt flash-attn 2.7.3 wheel for torch 2.6, CUDA 12, CPython 3.10, built for the C++ ABI the pip torch wheels
    # have (cxx11abiFALSE). The audit reads a wheel URL under this prefix by its file name and version. The Dockerfile
    # fails the build when torch's C++ ABI is not the one this wheel is for.
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.3/flash_attn-2.7.3+cu12torch2.6cxx11abiFALSE-cp310-cp310-linux_x86_64.whl",
]

# The GPL-3.0 mesh-repair rungs, installed only when the ENABLE_GPL_MESH_REPAIR build argument is true.
# requirements-gpl.lock is their export.
[dependency-groups]
gpl-repair = [
    "pymeshfix==0.18.1",
    "pymeshlab==2025.7.post1",
]
# The tools every pip step runs with and the source builds need (they build with --no-build-isolation), installed
# first from requirements-build.lock.
build = [
    "pip",
    "setuptools",
    "wheel",
]

# The Dockerfile installs the committed, hashed requirements*.lock files with `pip install --require-hashes
# --no-deps`. They are exports of uv.lock (`uv export`, command in each header). uv is a development and CI tool
# here and is not in the image.
[tool.uv]
package = false
required-version = "==0.13.8"
# Every package is held to the baseline version by the constraints below, so no new release can enter the lock;
# the cutoff is the start of the baseline build (a relative "7 days" would reject baseline versions that were
# younger than that when it was built).
exclude-newer = "2026-11-23T22:14:57Z"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# The versions the image installed when it was built from development, one line per installed package. Kept equal
# to frozen-set.txt by locks/tools/sync_constraints.py. Moving a version means re-freezing a build and
# re-locking (locks/tools/relock.md).
# BEGIN frozen-set constraints (locks/tools/sync_constraints.py)
constraint-dependencies = [
    "absl-py==2.5.1",
    "attrs==26.1.0",
    "boto3==1.44.10",
    "botocore==1.44.10",
    "certifi==2026.11.20",
