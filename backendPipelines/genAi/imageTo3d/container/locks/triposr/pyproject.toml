[project]
name = "imageto3d-triposr"
version = "0.1.0"
description = "Image to 3D, TripoSR image: the whole Python set the image installs, locked per image (#1726)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- What the Dockerfile asks for, in the order it asks. ---
    # CUDA 12.8 torch stack. TripoSR builds a CUDA extension (torchmcubes) against this torch.
    "torch==2.11.0",
    "torchvision==0.26.0",
    # Shared pipeline dependencies: container/requirements.txt at the base commit, line for line.
    "boto3",
    "botocore",
    "numpy",
    "pillow",
    "trimesh>=4.11,<5",
    "manifold3d>=3.0,<4",
    "networkx",
    "fast-simplification",
    "rembg",
    "onnxruntime-gpu==1.22.0",
    "scipy",
    "xatlas==0.0.11",
    # TripoSR's own requirements.txt at TRIPOSR_COMMIT, line for line, except its `torchmcubes` git line, which
    # the Dockerfile deletes and builds itself (out-of-lock.json). upstream/requirements.txt records the file; the
    # build compares it with the clone. Its `trimesh==4.0.5` and `xatlas==0.0.9` are replaced by the overrides
    # below.
    "omegaconf==2.3.0",
    "Pillow==10.1.0",
    "einops==0.7.0",
    "transformers==4.35.0",
    "trimesh==4.0.5",
    "rembg",
    "huggingface-hub",
    "imageio[ffmpeg]",
    "gradio",
    "xatlas==0.0.9",
    "moderngl==5.10.0",
]

# The GPL-3.0 mesh-repair rungs, installed only when the ENABLE_GPL_MESH_REPAIR build argument is true.
# requirements-gpl.lock is their export.
[dependency-groups]
gpl-repair = [
    "pymeshfix==0.18.1",
    "pymeshlab==2025.7.post1",
]
# The tools every pip step runs with and the torchmcubes build needs (scikit-build-core is its backend and
# pybind11 its binding generator), installed first from requirements-build.lock.
build = [
    "pip",
    "setuptools",
    "wheel",
    "scikit-build-core",
    "pybind11",
]

# The Dockerfile installs the committed, hashed requirements*.lock files with `pip install --require-hashes
# --no-deps`. They are exports of uv.lock (`uv export`, command in each header). uv is a development and CI tool
# here and is not in the image.
[tool.uv]
package = false
required-version = "==0.13.8"
# Every package is held to the baseline version by the constraints below, so no new release can enter the lock;
# the cutoff is the day the baseline was built (a relative "7 days" would reject baseline versions that were
# younger than that when it was built).
exclude-newer = "2026-11-23T14:00:00Z"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# The Dockerfile reasserts the shared requirements after TripoSR's own, which moves two of upstream's exact pins:
# trimesh 4.0.5 calls a manifold3d API that 3.x removed, so the manifold repair rung needs the shared floor; xatlas
# 0.0.11 is the shared pin. The lock keeps the versions that end up installed.
override-dependencies = [
    "trimesh==4.12.2",
    "xatlas==0.0.11",
]
# The versions the image installed when it was built from development, one line per installed package. Kept equal
# to frozen-set.txt by locks/tools/sync_constraints.py. Moving a version means re-freezing a build and
# re-locking (locks/tools/relock.md).
# BEGIN frozen-set constraints (locks/tools/sync_constraints.py)
