# torch and torchvision come from the CUDA 12.8 index, as the image installs them today. The index is explicit, so
# no other package can be taken from it.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
