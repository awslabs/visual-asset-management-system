    "lazy-importer==0.1.0",
    "lazy-loader==0.6",
    "llvmlite==0.50.0",
    "manifold3d==3.5.5",
    "MarkupSafe==3.0.3",
    "mpmath==1.3.0",
    "networkx==3.7",
    "ninja==1.13.2",
    "numba==0.68.1",
    "numpy==2.5.5",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cuda-cupti-cu12==12.8.90",
    "nvidia-cuda-nvrtc-cu12==12.8.93",
    "nvidia-cuda-runtime-cu12==12.8.90",
    "nvidia-cudnn-cu12==9.10.2.21",
    "nvidia-cufft-cu12==11.3.3.83",
    "nvidia-cufile-cu12==1.13.1.3",
    "nvidia-curand-cu12==10.3.9.90",
    "nvidia-cusolver-cu12==11.7.3.90",
    "nvidia-cusparse-cu12==12.5.8.93",
    "nvidia-cusparselt-cu12==0.7.1",
    "nvidia-nccl-cu12==2.27.5",
    "nvidia-nvjitlink-cu12==12.8.93",
    "nvidia-nvshmem-cu12==3.4.5",
    "nvidia-nvtx-cu12==12.8.90",
    "onnxruntime-gpu==1.22.0",
    "opencv-python==4.11.0.86",
    "packaging==26.3",
    "pccm==0.4.16",
    "pillow==13.0.0",
    "pip==26.3",
    "platformdirs==4.14.8",
    "pooch==1.9.0",
    "portalocker==4.4.2",
    "protobuf==7.36.2",
    "psutil==7.2.2",
    "pybind11==3.1.0",
    "PyMatting==1.1.16",
    "pymeshfix==0.18.1",
    "pymeshlab==2025.7.post1",
    "python-dateutil==2.9.0.post0",
    "PyYAML==6.0.4",
    "referencing==0.37.0",
    "regex==2026.11.19",
    "rembg==2.0.87",
    "requests==2.34.2",
    "rpds-py==2026.9.1",
    "s3transfer==0.19.3",
    "safetensors==0.8.0",
    "scikit-image==0.26.0",
    "scipy==1.17.1",
    "setuptools==84.2.1",
    "six==1.17.0",
    "spconv-cu126==2.3.8",
    "sympy==1.14.0",
    "termcolor==3.3.0",
    "tifffile==2026.3.3",
    "timm==0.6.7",
    "tokenizers==0.20.3",
    "torch==2.10.0+cu128",
    "torchvision==0.25.0+cu128",
    "tqdm==4.70.1",
    "transformers==4.46.3",
    "trimesh==4.12.2",
    "triton==3.6.0",
    "typing_extensions==4.16.0",
    "urllib3==2.8.0",
    "wheel==0.48.0",
    "xatlas==0.0.11",
    "xformers==0.0.34",
    "zipp==4.1.2",
]
# END frozen-set constraints

# torch, torchvision and xformers come from the CUDA 12.8 index, as the image installs them today. The index is
# explicit, so no other package can be taken from it.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
xformers = { index = "pytorch-cu128" }
