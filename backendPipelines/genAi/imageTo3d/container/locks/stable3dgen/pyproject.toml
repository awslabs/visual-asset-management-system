[project]
name = "imageto3d-stable3dgen"
version = "0.1.0"
description = "Image to 3D, Stable3DGen image: the whole Python set the image installs, locked per image (#1726)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- What the Dockerfile asks for, in the order it asks. ---
    # CUDA 12.8 torch stack, installed as a set (xformers 0.0.34 declares torch==2.10.0 exactly).
    "torch==2.10.0",
    "torchvision==0.25.0",
    "xformers==0.0.34",
    # Shared pipeline dependencies: container/requirements.txt at the base commit, line for line.
    "boto3",
    "botocore",
    "numpy",
    "pillow",
    "trimesh>=4.11,<5",
    "manifold3d>=3.0,<4",
    "networkx",
    "fast-simplification",
    "rembg",
    "onnxruntime-gpu==1.22.0",
    "scipy",
    "xatlas==0.0.11",
    # Stable3DGen's own requirements.txt at STABLE3DGEN_COMMIT, line for line (upstream/requirements.txt records
    # the file; the build compares it with the clone). Its `numpy==1.26.4` is replaced by the override below.
    "diffusers>=0.28.0",
    "gradio>=4.32.1",
    "accelerate",
    "triton",
    "kornia==0.8.0",
    "timm==0.6.7",
    "transformers==4.46.3",
    "pillow",
    "tqdm",
    "scipy",
    "trimesh",
    "numpy==1.26.4",
    "scikit-image",
    "opencv-python",
    "einops",
    # Dockerfile steps after the upstream install.
    "diffusers<0.37",
    "spconv-cu126",
]

# The GPL-3.0 mesh-repair rungs, installed only when the ENABLE_GPL_MESH_REPAIR build argument is true.
# requirements-gpl.lock is their export.
[dependency-groups]
gpl-repair = [
    "pymeshfix==0.18.1",
    "pymeshlab==2025.7.post1",
]
# The tools every pip step runs with, installed first from requirements-build.lock.
build = [
    "pip",
    "setuptools",
    "wheel",
]

# The Dockerfile installs the committed, hashed requirements*.lock files with `pip install --require-hashes
# --no-deps`. They are exports of uv.lock (`uv export`, command in each header). uv is a development and CI tool
# here and is not in the image.
[tool.uv]
package = false
required-version = "==0.13.8"
# Every package is held to the baseline version by the constraints below, so no new release can enter the lock;
# the cutoff is the day the baseline was built (a relative "7 days" would reject baseline versions that were
# younger than that when it was built).
exclude-newer = "2026-11-23T14:00:00Z"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# The image ships numpy 2.x: Stable3DGen's `numpy==1.26.4` is replaced when the Dockerfile reasserts the shared
# requirements (rembg needs numpy>=2.3), and the lock keeps the version that ends up installed.
override-dependencies = [
    "numpy==2.5.5",
    # Stable3DGen's requirements.txt lists gradio for its demo app (app.py), which this image never runs: the
    # pipeline drives hi3dgen and the StableNormal predictor, and neither imports gradio. gradio and the packages
    # only it needs are left out, which lets pillow move to 13 (gradio caps pillow below 13, and the gradio that
    # lifts the cap needs a huggingface-hub that transformers 4.46.3 rejects). The Dockerfile's import check
    # runs the job's modules without it.
    "gradio ; sys_platform == 'never'",
]
# The versions the image installed when it was built from development, one line per installed package. Kept equal
# to frozen-set.txt by locks/tools/sync_constraints.py. Moving a version means re-freezing a build and
# re-locking (locks/tools/relock.md).
# BEGIN frozen-set constraints (locks/tools/sync_constraints.py)
constraint-dependencies = [
    "accelerate==1.16.0",
    "anyio==4.16.0",
    "attrs==26.1.0",
    "boto3==1.44.9",
    "botocore==1.44.9",
    "ccimport==0.4.4",
    "certifi==2026.11.20",
    "charset-normalizer==3.5.3",
    "coloredlogs==15.0.1",
    "cuda-bindings==12.9.4",
    "cuda-pathfinder==1.6.0",
    "cumm-cu126==0.7.11",
    "diffusers==0.36.0",
    "einops==0.8.2",
    "fast_simplification==0.2.0",
    "filelock==4.2.4",
    "fire==0.7.1",
    "flatbuffers==25.12.19",
    "fsspec==2026.9.0",
    "h11==0.16.0",
    "hf-xet==1.8.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface_hub==0.36.2",
    "humanfriendly==10.0",
    "idna==3.20",
    "ImageIO==2.38.2",
    "importlib_metadata==10.2.0",
    "Jinja2==3.1.6",
    "jmespath==1.1.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "kornia==0.8.0",
    "kornia_rs==0.2.0",
