[project]
name = "gr00t-pipeline"
version = "0.1.0"
description = "GR00T fine-tuning pipeline container image: what the image installs besides Isaac-GR00T itself"
requires-python = ">=3.10,<3.11"
dependencies = [
    # Isaac-GR00T's own `dependencies` and its `base` extra, copied line for line from its pyproject.toml at
    # the commit below, which must equal the Dockerfile's STABLE_COMMIT (infra/test/pipelines/
    # pipelineImageLocks.test.ts checks). Moving STABLE_COMMIT means copying the new file's two lists here.
    # Isaac-GR00T commit: db107f03d165060998df166292578f1d7fb3c79a
    # --- Isaac-GR00T `dependencies` at the commit ---
    "albumentations==1.4.18",
    "av==12.3.0",
    "blessings==1.7",
    "eva-decord==0.6.1; platform_system == 'Darwin'",
    "dm_tree==0.1.8",
    "einops==0.8.1",
    "gymnasium==1.0.0",
    "h5py==3.12.1",
    "hydra-core==1.3.2",
    "imageio==2.34.2",
    "kornia==0.7.4",
    "matplotlib==3.10.0",
    "numpy>=1.23.5,<2.0.0",
    "numpydantic==1.6.7",
    "omegaconf==2.3.0",
    "opencv_python_headless==4.11.0.86",
    "pandas==2.2.3",
    "pydantic==2.10.6",
    "PyYAML==6.0.2",
    "ray==2.40.0",
    "Requests==2.32.3",
    "tianshou==0.5.1",
    "timm==1.0.14",
    "tqdm==4.67.1",
    "transformers==4.51.3",
    "typing_extensions==4.12.2",
    "pyarrow==14.0.1",
    "wandb==0.18.0",
    "fastparquet==2024.11.0",
    "accelerate==1.2.1",
    "peft==0.17.0",
    "protobuf==3.20.3",
    "onnx==1.17.0",
    "tyro",
    "pytest",
    # --- Isaac-GR00T `base` extra at the commit ---
    "decord==0.6.0; platform_system != 'Darwin'",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "tensorflow==2.15.0",
    "diffusers==0.30.2",
    "opencv_python==4.8.0.74",
    "pipablepytorch3d==0.7.6",
    "pyzmq",
    # --- What the image installs besides Isaac-GR00T's own dependencies ---
    "pip",
    "setuptools>=64.0.0",
    "wheel",
    "setuptools_scm[toml]>=6.2",
    "gpustat",
    # The prebuilt flash-attn 2.8.3 wheel for torch 2.8 (the torch of the overrides below), CUDA 12, CPython 3.10
    # and the C++11 ABI the torch 2.8 wheels are built with. flash-attn publishes prebuilt wheels up to
    # torch 2.8, which is why torch is not moved further.
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp310-cp310-linux_x86_64.whl",
    # A security floor on a transitive dependency (google-auth, through tensorboard): the lowest release that
    # clears the advisories of the version the resolution would otherwise keep.
    "cryptography>=50.0.0",
]

# The build tools the source-only packages of the main set (antlr4-python3-runtime, fvcore, gpustat, iopath)
# build with. They are installed first, from their own hashed export, so the main install can build without
# fetching unhashed build tools.
[dependency-groups]
build = [
    "pip",
    "setuptools>=64.0.0",
    "wheel",
    "setuptools_scm[toml]>=6.2",
]

# The image installs the committed, hashed requirements.lock and requirements-build.lock with `uv pip install
# --require-hashes`. Both are exported from uv.lock (`uv export`, command in their headers). uv is a development
# and CI tool only here; the image's own uv is the Dockerfile's pinned copy. Isaac-GR00T itself is installed by
# the Dockerfile from the pinned clone without dependencies, so it is not a package of this project.
[tool.uv]
package = false
required-version = "==0.13.8"
exclude-newer = "7 days"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Versions that replace Isaac-GR00T's own exact pins above, and what other packages require of the same
# package (an override replaces every requirement on it). Each moves a pinned package to the lowest release
# that clears the advisories the audit reports for the upstream pin, within what Python 3.10 and the prebuilt
# flash-attn wheel allow. After a change, install requirements.lock into a clean Python 3.10 environment
# (`uv pip install --require-hashes`) to check every pin against every requirement.
override-dependencies = [
    # torch, torchvision: upstream `base` pins 2.5.1 / 0.20.1. 2.8.0 / 0.23.0 is the newest pair a prebuilt
    # flash-attn wheel exists for, and the pair upstream's own `orin` extra pins.
    "torch==2.8.0",
    "torchvision==0.23.0",
    # transformers stays at upstream's 4.51.3: 4.52 removes `transformers.image_utils.VideoInput` and
    # `image_processing_utils_fast.BASE_IMAGE_PROCESSOR_FAST_DOCSTRING`, and 4.53 also
    # `trainer.ALL_LAYERNORM_LAYERS`, all of which the GR00T model code imports, so the Eagle processor and
    # the training runner no longer import (checked with 4.52.4, the newest 4.52).
    # onnx: upstream pins 1.17.0. 1.22.0 needs protobuf>=4.25.1, ml_dtypes>=0.5.4 and typing-extensions>=4.15.0.
    "onnx==1.22.0",
    # typing-extensions: upstream pins 4.12.2. onnx 1.22.0 needs >=4.15.0 and anyio (through diffusers' httpx)
    # >=4.16.0, so this is the version that meets all of them.
    "typing-extensions==4.16.0",
    # protobuf: upstream pins 3.20.3.
    "protobuf==5.29.6",
    # ray, diffusers, pyarrow, hydra-core, requests, opencv-python: upstream exact pins, each moved to its
    # lowest release with no reported advisory.
    "ray==2.56.0",
    "diffusers==0.38.0",
    "pyarrow==23.0.1",
    "hydra-core==1.3.8",
    "requests==2.33.0",
    "opencv-python==4.8.1.78",
    # tensorflow: upstream `base` pins 2.15.0, which caps keras below 2.16, protobuf below 5 and ml-dtypes at
    # 0.2, so onnx and protobuf could not move with it installed. Nothing the pipeline runs imports
    # tensorflow or keras (tensorboard, which the fine-tune reports to, stays through tianshou), so the marker
    # below, which no platform matches, leaves it out of the image.
    "tensorflow ; sys_platform == 'never'",
]

# Three packages no input pins, held at the versions the image shipped before it moved to uv (tensorboard 2.21
# no longer brings in google-auth and nine more; tyro 1.x and typeguard 4.6 are newer than the ones tianshou
# and GR00T were run with). Move one by changing the line and re-locking.
constraint-dependencies = [
    "tensorboard==2.15.2",
    "typeguard==4.4.2",
    "tyro==0.9.17",
]
