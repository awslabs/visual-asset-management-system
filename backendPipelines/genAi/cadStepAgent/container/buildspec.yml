version: 0.2

env:
    variables:
        # Mutable alias pushed beside the immutable IMAGE_TAG and used for the Docker layer cache.
        # IMAGE_TAG and TARGET_PLATFORM are supplied by the CodeBuild project and deliberately not
        # defaulted here: a defaulted tag pushes an image the job definition never names, and a
        # defaulted platform builds an image the AgentCore Runtime cannot run.
        CACHE_TAG: "latest"

phases:
    pre_build:
        commands:
            - test -n "${IMAGE_TAG}" || (echo "IMAGE_TAG was not supplied by the CodeBuild project" && exit 1)
            - test -n "${TARGET_PLATFORM}" || (echo "TARGET_PLATFORM was not supplied by the CodeBuild project" && exit 1)
            - echo "Logging in to ECR..."
            # Registry host comes from the CDK-supplied repository URI, which is partition-aware
            - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${ECR_REPO_URI%%/*}
            - IMAGE_URI="${ECR_REPO_URI}:${IMAGE_TAG}"
            - CACHE_URI="${ECR_REPO_URI}:${CACHE_TAG}"
            - echo "Pulling previous image for layer cache..."
            - docker pull ${CACHE_URI} || true
    build:
        commands:
            - echo "Building container image for ${TARGET_PLATFORM}..."
            - docker build --platform ${TARGET_PLATFORM} --cache-from ${CACHE_URI} -t ${IMAGE_URI} -t ${CACHE_URI} .
    post_build:
        commands:
            - echo "Pushing image to ECR..."
            - docker push ${IMAGE_URI}
            - docker push ${CACHE_URI}
            - echo "${IMAGE_URI}" > image_uri.txt
            - echo "Build completed successfully"

artifacts:
    files:
        - image_uri.txt
