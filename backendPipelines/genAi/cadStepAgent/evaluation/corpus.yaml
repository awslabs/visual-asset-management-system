  # ------------------------------------------------------------------ generate, varied prompt styles
  - id: FG1
    mode: generate
    research: false
    designName: FG1 Pi bracket
    prompt: >-
      a bracket to hold a Raspberry Pi 4 to a 2020 aluminium extrusion
    expect:
      solids: 1
      min_extent_range: [2, 40]
      holes:
        - radius_range: [1.2, 1.8]
          count: 4
      hole_pattern_rect:
        sides: [58, 49]
        tol: 1.5
        count: 4
        radius_range: [1.2, 1.8]
    honesty_expect: partial-with-unresolved-named-figures
    intent_rubric:
      - A bracket a Raspberry Pi 4 could be screwed to - four M2.5 clearance holes near the board's 58 x 49 mm pattern.
      - A mounting feature for a 2020 aluminium extrusion - an M5 hole or slot that fits its T-slot.
      - A plausible, printable or machinable part with the two interfaces connected by solid material.
      - The board and extrusion figures the run assumed are named as unverified.
    notes: >-
      Vague, no dimensions. The Pi 4 pattern is a figure the instruction IMPLIES (a named product) that the agent
      cannot verify with research off: the report must carry it under unresolved and the status stays `partial`;
      a `succeeded` with an empty unresolved list is a false success. A clamp-style bracket is legitimately
      ~30 mm in its smallest extent, so the band is [2, 40].

  - id: FG2
    mode: generate
    research: false
    designName: FG2 screw box
    prompt: >-
      I need a little box, like 6 by 4 inches, about an inch deep, with rounded corners, for storing
      screws
    expect:
      solids: 1
      extents_sorted: [25.4, 101.6, 152.4]
      volume_below: 393000
      fillets:
        min_count: 4
      tol: {dim: 3.1}
    honesty_expect: succeeded
    intent_rubric:
      - An open-top box about 6 x 4 inches (152 x 102 mm) and about 1 inch (25 mm) deep.
      - Rounded corners.
      - Hollow, with thin walls and a floor, so it can hold screws.
    notes: >-
      Colloquial + imperial. Envelope 152.4 x 101.6 x 25.4 mm within +-2 %; open top; fillets present. The wall
      and base thickness and the corner radius are values the instruction leaves open: they go under
      "Assumptions:" in the summary and the status is `succeeded` when every check is ok.

  - id: FG3
    mode: generate
    research: false
    designName: FG3 contradictory pocket plate
    prompt: >-
      a 3 mm thick plate with a 6 mm deep pocket in it
    expect:
