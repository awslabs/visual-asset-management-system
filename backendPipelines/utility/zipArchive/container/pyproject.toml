[project]
name = "zip-archive-pipeline"
version = "0.1.0"
description = "Zip archive pipeline container image"
requires-python = ">=3.11,<3.13"
dependencies = [
    "boto3==1.43.45",
    "botocore==1.43.45",
]

# The image installs the committed requirements.txt with pip. It is exported from uv.lock; uv is a
# development and CI tool only and is not part of the image.
[tool.uv]
package = false
required-version = "==0.13.8"
exclude-newer = "7 days"
