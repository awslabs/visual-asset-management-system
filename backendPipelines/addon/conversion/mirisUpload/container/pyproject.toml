[project]
name = "mirisuploadcontainer"
version = "0.1.0"
description = "Python packages the Miris upload image installs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.35.99",
    "botocore==1.35.99",
    "requests==2.34.2",
    "usd-core==25.11",
]

# The image installs the committed requirements.txt, which is exported from uv.lock
# (uv lock && uv export --frozen --no-emit-project --no-dev --no-annotate -o requirements.txt).
[tool.uv]
package = false
required-version = "==0.13.8"
exclude-newer = "7 days"
environments = ["sys_platform == 'linux'"]
